        { act: "ipa", topic: "Sec. 33", q: "The deed has no expulsion clause. Four of five partners vote to expel the fifth for poor performance. The expulsion is:", o: ["Invalid, because expulsion requires a power conferred by contract, exercised in good faith (s. 33)", "Valid, because the majority decided", "Valid if notice is published in the Gazette", "Valid if he is repaid his capital"], e: "Section 33(1): no majority may expel a partner except in the good-faith exercise of powers conferred by contract. In Carmichael v. Evans an express clause was validly invoked for dishonest conduct." },
        { act: "ipa", topic: "Sec. 34", q: "A partner is adjudicated insolvent. He ceases to be a partner:", o: ["On the date of the order of adjudication", "On the date the insolvency petition was filed", "On the date public notice is given", "Only when the firm is dissolved"], e: "Section 34(1) fixes the date of the adjudication order, whether or not the firm is thereby dissolved." },
        { act: "ipa", topic: "Sec. 37", q: "A partner dies. The survivors carry on the business with the firm's property without settling accounts with his estate. The estate may claim:", o: ["At its option, the share of profits attributable to the use of his share, or interest at 6% p.a. on it", "Only 6% interest", "Only his capital, without any return", "Half of all future profits"], e: "Section 37 gives the outgoing partner or his estate an option between profits attributable to the use of his share and 6% p.a. interest on the amount of his share (see Brown v. De Tastet)." },
        { act: "ipa", topic: "Sec. 38", q: "S gives a bank a continuing guarantee for a firm's overdraft. Later a new partner is admitted. Absent contrary agreement, S is:", o: ["Discharged as to transactions after the change in the firm (s. 38)", "Liable for all future transactions", "Discharged even for past transactions", "Liable only if the new partner consents"], e: "Section 38 revokes a continuing guarantee as to future transactions from the date of any change in the firm's constitution (Neel Comul Mookerjee v. Bipro Das)." },
        { act: "ipa", topic: "Sec. 41(b)", q: "A firm's only business is importing goods from Country X. War breaks out and trade with X becomes illegal. The firm is:", o: ["Compulsorily dissolved (s. 41(b))", "Dissolved only if all partners agree", "Dissolved only by order of the Court", "Suspended until the war ends"], e: "Section 41(b): a firm is dissolved by the happening of any event that makes it unlawful for the business to be carried on. A firm with several businesses is not necessarily dissolved by the illegality of one (proviso)." },
        { act: "ipa", topic: "Sec. 41(a)", q: "Compulsory dissolution under Section 41(a) takes place when:", o: ["All the partners, or all but one, are adjudicated insolvent", "Any one partner is adjudicated insolvent", "A majority of the partners are adjudicated insolvent", "The firm is unable to pay a debt"], e: "Under s. 41(a), insolvency of a single partner dissolves the firm only under s. 42(d), and even that is subject to contract." },
        { act: "ipa", topic: "Sec. 42(c)", q: "A firm has three partners. The deed says nothing about death. One partner dies. The firm is:", o: ["Dissolved, as dissolution on death applies subject to contract (s. 42(c))", "Continued automatically by the other two", "Continued with the heir as a partner", "Dissolved only after a court order"], e: "Section 42(c): subject to contract, a firm is dissolved by the death of a partner. The partners may agree in advance that the firm will continue." },
        { act: "ipa", topic: "Sec. 4, 42", q: "A and B are the only partners. Their deed says the firm will continue despite a partner's death. A dies. The firm:", o: ["Is dissolved, since a partnership cannot exist with only one person", "Continues with B alone", "Continues with A's estate as a partner", "Continues if A's minor heir is admitted to benefits"], e: "A firm needs at least two persons. A continuation clause works only if at least two partners survive; a minor admitted to benefits is not a partner." },
        { act: "ipa", topic: "Sec. 43", q: "In a partnership at will, a partner gives written notice of dissolution to all the others without naming a date. The firm is dissolved:", o: ["From the date of communication of the notice", "From the date the notice was written", "One month after the notice", "Only after the Court confirms it"], e: "Section 43(2): the firm is dissolved from the date mentioned in the notice or, if no date is mentioned, from the date of communication." },
        { act: "ipa", topic: "Sec. 44", q: "Which of the following is NOT a ground for dissolution by the Court under Section 44?", o: ["A partner has taken a long holiday abroad with the others' consent", "A partner has become of unsound mind", "The business can only be carried on at a loss", "A partner has transferred the whole of his interest to a third party"], e: "Section 44 grounds: (a) unsound mind, (b) permanent incapacity, (c) misconduct prejudicial to the business, (d) wilful or persistent breach, (e) transfer of whole interest, (f) business only at a loss, (g) just and equitable." },
        { act: "ipa", topic: "Sec. 44(g)", q: "Complete deadlock and loss of mutual confidence between partners would ordinarily be urged under:", o: ["Section 44(g): the just and equitable ground", "Section 41(b)", "Section 42(a)", "Section 33"], e: "The residuary 'just and equitable' ground in s. 44(g) covers deadlock, destruction of mutual trust and similar situations not covered by clauses (a) to (f)." },
        { act: "ipa", topic: "Sec. 44(b) · Whitwell v. Arthur", q: "A partner has a paralytic stroke, but medical evidence shows he is recovering. His co-partner sues for dissolution under s. 44(b). The Court will likely:", o: ["Refuse immediate dissolution, since the incapacity must be permanent", "Dissolve the firm at once", "Expel the sick partner", "Order the sick partner's share to be sold"], e: "Section 44(b) requires permanent incapacity. In Whitwell v. Arthur the court refused to dissolve where the partner was recovering." },
        { act: "ipa", topic: "Sec. 45", q: "After dissolution but before public notice, partner A buys goods on credit in the firm name from T, who has no knowledge of the dissolution. The partners are:", o: ["Liable to T as partners until public notice of dissolution is given (s. 45)", "Not liable, since the firm no longer exists", "Liable only if A was the managing partner", "Liable only out of A's share"], e: "Section 45(1) continues liability for acts done after dissolution until public notice. The proviso protects the estate of a deceased partner, an insolvent partner, and a dormant partner unknown to the third party." },
        { act: "ipa", topic: "Sec. 48(a)", q: "On settlement of accounts after dissolution, losses (including deficiencies of capital) are met in which order?", o: ["Profits → capital → partners individually in profit-sharing ratio", "Capital → profits → partners in capital ratio", "Partners individually → profits → capital", "Profits → partners individually → capital"], e: "Section 48(a): losses are paid first out of profits, next out of capital, and lastly, if necessary, by the partners individually in the proportions in which they shared profits." },
        { act: "ipa", topic: "Sec. 48(b)", q: "Under Section 48(b), firm assets are applied FIRST in paying:", o: ["Debts of the firm to third parties", "Partners' advances (loans) to the firm", "Partners' capital", "The residue, in profit-sharing ratio"], e: "Order in s. 48(b): (i) outside debts, (ii) partners' advances rateably, (iii) partners' capital rateably, (iv) residue in profit-sharing ratio." },
        { act: "ipa", topic: "Sec. 48(b)", q: "After outside creditors are paid, which is repaid first out of the remaining assets?", o: ["Partners' advances (loans), rateably", "Partners' capital, rateably", "Advances and capital together, pari passu", "Capital of the partner with the largest share"], e: "Section 48(b)(ii) ranks partners' advances distinct from capital ahead of capital (s. 48(b)(iii))." },
        { act: "ipa", topic: "Sec. 49", q: "A owes personal creditors, and A's firm owes its own creditors. A's separate property is applied:", o: ["First to A's separate debts; any surplus goes towards the firm's debts", "First to the firm's debts", "Equally between both sets of creditors", "Only to the firm's debts"], e: "Section 49: firm property pays firm debts first and a partner's separate property pays his separate debts first; each surplus then flows to the other set of creditors." },
        { act: "ipa", topic: "Sec. 51", q: "P paid a premium to join a firm for a fixed 10-year term. The firm is dissolved after 2 years because another partner dies. P is:", o: ["Not entitled to any refund of premium, since the dissolution was caused by death", "Entitled to an 80% refund", "Entitled to a full refund", "Entitled to a refund with 6% interest"], e: "Section 51 allows a reasonable refund on premature dissolution, but not where dissolution is caused by death, is mainly due to the claimant's own misconduct, or follows an agreement with no return clause." },
        { act: "ipa", topic: "Sec. 52", q: "Which of the following is NOT a right of a partner who rescinds the partnership contract for fraud?", o: ["Interest at 6% p.a. on all profits made by the firm", "A lien on the surplus assets for money paid for his share and capital", "To rank as a creditor for any payments he made towards firm debts", "To be indemnified by the partner guilty of the fraud"], e: "Section 52 gives three rights: (a) lien on surplus assets, (b) creditor status for payments of firm debts, (c) indemnity from the guilty partner(s)." },
        { act: "ipa", topic: "Sec. 53", q: "After dissolution, but before winding up is complete, one partner carries on a similar business in the firm name. Another partner may:", o: ["Restrain him by injunction (s. 53)", "Only claim damages after winding up", "Do nothing, since the firm no longer exists", "Ask the Registrar to cancel the registration"], e: "Section 53: until the affairs are completely wound up, any partner may restrain another from carrying on a similar business in the firm name or using firm property for his own benefit." },
        { act: "ipa", topic: "Sec. 55(3)", q: "On sale of the firm's goodwill, the selling partner agrees not to run a similar business in the same city for 3 years. The covenant is:", o: ["Valid, if the restrictions are reasonable (s. 55(3))", "Void under Section 27 of the Contract Act", "Valid only if registered", "Void as to time but valid as to area"], e: "Section 55(3), like s. 36(2) and s. 54, creates a statutory exception to s. 27 of the Contract Act for reasonable restraints on the sale of goodwill." },
        { act: "ipa", topic: "Sec. 55(2) · Trego v. Hunt", q: "Absent any agreement, a partner whose firm's goodwill has been sold may:", o: ["Carry on a competing business and advertise it, but not use the firm name or solicit old customers", "Never carry on a similar business", "Use the firm name with the buyer's knowledge", "Solicit old customers but not advertise"], e: "Section 55(2) codifies Trego v. Hunt: competition is allowed, but not using the firm name, representing himself as carrying on the firm's business, or soliciting its customers." },
        { act: "ipa", topic: "Ch. VII", q: "Registration of a partnership firm under the Indian Partnership Act is:", o: ["Optional, but non-registration brings the disabilities in s. 69", "Compulsory within one year of formation", "Compulsory before the firm starts business", "Required only for firms with more than 10 partners"], e: "The Act does not make registration compulsory, and a firm may register at any time. The sanction for non-registration is the inability to sue under s. 69." },
        { act: "ipa", topic: "Sec. 58", q: "The statement applying for registration under Section 58 must be signed and verified by:", o: ["All the partners, or their agents specially authorised", "Any one partner", "The managing partner alone", "A majority of the partners"], e: "Section 58(1) requires signature by all the partners or their specially authorised agents, and verification in the prescribed manner." },
        { act: "ipa", topic: "Sec. 58(3)", q: "Which word may NOT be used in a firm name without the State Government's consent in writing?", o: ["Imperial", "Brothers", "Traders", "Associates"], e: "Section 58(3) bars words like Crown, Emperor, Empress, Empire, Imperial, King, Queen, Royal, or words expressing or implying government sanction, unless the State Government consents." },
        { act: "ipa", topic: "Sec. 69(2)", q: "An unregistered firm sues a customer for the price of goods sold to him. The suit is:", o: ["Barred by s. 69(2)", "Maintainable if the claim exceeds ₹100", "Maintainable if all the partners join as plaintiffs", "Maintainable if the firm registers while the suit is pending"], e: "Section 69(2) bars a suit by or on behalf of a firm against a third party to enforce a right arising from a contract, unless the firm is registered and the suing partners are shown in the Register." },
        { act: "ipa", topic: "Sec. 69", q: "A customer sues an unregistered firm for damages for breach of contract. The suit is:", o: ["Maintainable, since s. 69 does not bar suits by third parties against the firm", "Barred by s. 69(2)", "Barred unless the firm consents", "Maintainable only after the firm registers"], e: "Section 69 restricts only suits by the firm or its partners. Outsiders can always sue an unregistered firm." },
        { act: "ipa", topic: "Sec. 69(3)(a)", q: "A partner of an unregistered firm sues for dissolution and accounts. The suit is:", o: ["Maintainable, because it is saved by s. 69(3)(a)", "Barred by s. 69(1)", "Maintainable only if the claim is ₹100 or less", "Barred unless the firm first registers"], e: "Section 69(3)(a) saves the right to sue for dissolution, for accounts of a dissolved firm, and to realise the property of a dissolved firm." },
        { act: "ipa", topic: "Sec. 69 · Haldiram Bhujiawala", q: "An unregistered firm sues X for passing off its trade mark, a common-law or statutory right not arising from a contract. The s. 69 bar:", o: ["Does not apply, since it covers only rights arising from a contract or conferred by the Partnership Act", "Applies fully", "Applies unless the claim is below ₹100", "Applies only to claims of set-off"], e: "In Haldiram Bhujiawala v. Anand Kumar Deepak Kumar (2000), the Supreme Court held that s. 69(2) is confined to contractual rights, so a passing-off action is not barred." },
        { act: "ipa", topic: "Sec. 69", q: "An unregistered firm files a suit on a contract and registers itself while the suit is pending. The defect:", o: ["Is not cured: registration is tested on the date the suit is instituted", "Is cured retrospectively", "Is cured if the defendant does not object", "Is cured if registration is within 6 months"], e: "The bar in s. 69 operates at institution. Later registration does not validate a suit that was incompetent when filed; a fresh suit (within limitation) would be needed." },
        { act: "ipa", topic: "Sec. 69(4)(b)", q: "Which of these suits by an unregistered firm is NOT barred by Section 69?", o: ["A suit or claim of set-off not exceeding ₹100 in value (of the specified small-cause kind)", "A suit for ₹10,000 against a buyer for price", "A claim of set-off of ₹5,000 arising from a contract", "A suit by a partner against the firm for his share of profits while the firm continues"], e: "Section 69(4)(b) exempts suits or set-offs not exceeding ₹100 of a small-cause kind. Section 69(3) expressly extends the bar to set-offs above that." },
        { act: "ipa", topic: "Sec. 72", q: "'Public notice' under the Act is given by publication in:", o: ["The Official Gazette and at least one vernacular newspaper circulating in the district of the firm's principal place of business", "Any English daily newspaper", "The Official Gazette only", "A notice displayed at the firm's premises"], e: "Section 72(b). For a registered firm, retirement, expulsion, dissolution or a minor's election also needs notice to the Registrar under s. 63 (s. 72(a))." },
        { act: "ipa", topic: "Sec. 70", q: "Under the central Act, knowingly signing a false statement for registration is punishable with imprisonment of up to:", o: ["Three months, or fine, or both", "Six months, or fine, or both", "One year and a minimum fine", "Fine only"], e: "Section 70 of the Act as originally enacted provides up to three months, or fine, or both. Some States, such as Maharashtra, have enhanced the penalty." },
        { act: "ipa", topic: "Sec. 1", q: "The Act came into force on 1 October 1932, except Section 69, which came into force on:", o: ["1 October 1933", "1 January 1933", "1 April 1933", "1 October 1932 as well"], e: "Section 1(3): the Act came into force on 1 October 1932, but s. 69 took effect a year later, giving firms time to register." },
        { act: "ipa", topic: "Sec. 4 · V. Subramaniam", q: "In Indian law, a partnership firm is:", o: ["Not a legal person distinct from its partners; the firm name is a compendious name for the partners", "A body corporate with perpetual succession", "A legal person only after registration", "A juristic person for all purposes, including owning property apart from its partners"], e: "A firm is not a separate legal entity (Munshi Ram; V. Subramaniam). It is treated as a unit only for limited purposes such as tax law and suits in the firm name under Order XXX CPC." },
        { act: "ipa", topic: "Sec. 4 · Dulichand", q: "Can a firm, as such, become a partner in another firm?", o: ["No. A firm is not a 'person', but its partners may join the other firm individually (Dulichand Laxminarayan v. CIT, 1956)", "Yes, if it is registered", "Yes, always", "Only with the Registrar's sanction"], e: "As a firm is not a legal person, it cannot enter into partnership with another firm or with individuals. Its partners may do so individually." },
        { act: "ipa", topic: "Sec. 4", q: "Can a company incorporated under the Companies Act be a partner in a firm?", o: ["Yes, as a legal person competent to contract, if its objects permit", "No, never", "Only if all the other partners are companies", "Only in a particular partnership"], e: "A company is a 'person' under s. 3(42) of the General Clauses Act and may enter into a partnership within its objects." },
        { act: "ipa", topic: "Sec. 13(a) · Chidambaram Pillai", q: "In CIT v. R.M. Chidambaram Pillai (1977), the 'salary' a firm paid to a partner was held to be:", o: ["Not a salary at all but a mode of sharing profits, since a firm cannot employ its own partner", "Salary income taxable as such", "An admissible business expense", "A capital receipt"], e: "A person cannot be his own employer. A partner's 'salary' is an agreed allocation of profits and keeps the character of the firm's income." },
        { act: "ipa", topic: "Sec. 4 · Rashik Lal", q: "The Karta of an HUF joins a firm representing family funds. Who is the partner?", o: ["The Karta personally; the HUF as such cannot be a partner", "The HUF as an entity", "All coparceners jointly", "The eldest coparcener only"], e: "An HUF is not a 'person' capable of entering a partnership. The Karta becomes a partner in his individual capacity, though he may be accountable to the family (Rashik Lal & Co. v. CIT)." },
        { act: "ipa", topic: "Sec. 11(2)", q: "A clause in a partnership deed that a partner shall not carry on any other business while he is a partner is:", o: ["Valid, notwithstanding Section 27 of the Contract Act (s. 11(2))", "Void as a restraint of trade", "Valid only if limited to 5 km", "Valid only in a particular partnership"], e: "Section 11(2) expressly validates restraints operating during the partnership; Niranjan Shankar Golikari applies the same logic to restraints during employment." },
        { act: "ipa", topic: "Sec. 36(2)", q: "An outgoing partner agrees with the continuing partners not to carry on a similar business within the district for 2 years. The agreement is:", o: ["Valid, if the restrictions are reasonable (s. 36(2))", "Void under Section 27 of the Contract Act", "Valid only if registered with the Registrar", "Valid for any period, without limit"], e: "Section 36(2) permits reasonable restraints on an outgoing partner as to period or local limits." },
        { act: "ipa", topic: "Sec. 14", q: "Partner A buys a building with firm money but in his own name. Absent a contrary intention, the building is:", o: ["Firm property, since property bought with firm money is deemed bought for the firm (s. 14)", "A's personal property", "Owned jointly by A and the firm in equal halves", "Firm property only after registration"], e: "Section 14 presumes property acquired with firm money to be acquired for the firm; s. 15 then requires its exclusive use for the business." },
        { act: "ipa", topic: "Sec. 22 · Sitaram Padhye", q: "A partner signs a promissory note as 'X, Managing Proprietor' without using the firm name. Ordinarily the note binds:", o: ["Only X personally, since it is not signed in the firm name or in a way showing intent to bind the firm (s. 22)", "The firm, because X is a partner", "The firm and X jointly", "Nobody, as the note is void"], e: "Section 22 requires an act to be done in the firm name or in a manner expressing or implying an intention to bind the firm. A merely descriptive title does not suffice." },
        { act: "ipa", topic: "Sec. 32(3) · Scarf v. Jardine", q: "In Scarf v. Jardine (1882), a creditor who knew of a change in a firm's constitution:", o: ["Had to elect between suing the old firm (by holding out) and the new firm, and could not sue both", "Could sue both firms together", "Could sue only the retired partner", "Lost all remedies"], e: "Liability by holding out and liability of the new firm are alternative. Having elected to sue the new firm, the creditor could not then hold the retired partner liable." },
        { act: "ipa", topic: "Sec. 2(b), 4 · Smith v. Anderson", q: "In Smith v. Anderson, a trust holding investments passively for subscribers was held:", o: ["Not to be a partnership, since it carried on no business with mutual agency", "To be a partnership of the trustees", "To be a partnership of all subscribers", "To be an illegal association"], e: "A business implies a continuous series of commercial acts. Passive holding of investments under a trust deed, without mutual agency, is not carrying on a business." },
        { act: "ipa", topic: "Sec. 6 · Govind Nair v. Maga", q: "A and B jointly buy a tea shop, lease it to C, and share the rent equally. They are:", o: ["Co-owners, not partners, since there is no business carried on with mutual agency", "Partners at will", "Partners in a particular partnership", "Partners by holding out"], e: "Sharing returns from jointly owned property is not by itself partnership (s. 6, Expl. 1). There must be a business carried on by all or any of them acting for all." },
        { act: "ipa", topic: "Sec. 42(d), 34", q: "Subject to contract, the adjudication of one partner as insolvent:", o: ["Dissolves the firm (s. 42(d)), unless the partners have agreed otherwise", "Never affects the firm", "Compulsorily dissolves the firm irrespective of contract", "Dissolves the firm only if he was the managing partner"], e: "Section 42(d) applies subject to contract. Compulsory dissolution under s. 41(a) requires all, or all but one, partners to be insolvent." },
        { act: "ipa", topic: "Sec. 47", q: "After dissolution, can a partner bind the firm by completing a transaction begun but left unfinished before dissolution?", o: ["Yes, so far as necessary to wind up the affairs and complete unfinished transactions (s. 47)", "No, all authority ends on dissolution", "Only with the Registrar's permission", "Only if public notice is not yet given"], e: "Section 47 continues authority for winding up purposes, but the firm is not bound by the acts of a partner who has been adjudicated insolvent." },
        { act: "ipa", ar: true, topic: "Sec. 30", assertion: "A minor cannot be a partner in a firm.", reason: "A minor's agreement is void ab initio (Mohori Bibee v. Dharmodas Ghose).", a: 0, e: "Partnership arises from contract (s. 4, s. 5) and a minor cannot contract, so A follows from R. That is why s. 30 allows a minor only to be admitted to the benefits." },
        { act: "ipa", ar: true, topic: "Sec. 4, 6", assertion: "Sharing of profits is conclusive proof of partnership.", reason: "Mutual agency is the true test of partnership.", a: 3, e: "Under s. 6 and Cox v. Hickman, profit-sharing is only prima facie evidence, so A is false. R correctly states the test." },
        { act: "ipa", ar: true, topic: "Sec. 25, 31", assertion: "An incoming partner is automatically liable for firm debts incurred before he joined.", reason: "Every partner is liable jointly and severally for all acts of the firm done while he is a partner.", a: 3, e: "A is false (s. 31(2)). R is true (s. 25), and its words 'while he is a partner' are exactly why A fails." },
        { act: "ipa", ar: true, topic: "Sec. 69", assertion: "A third party can sue an unregistered firm to enforce a contract.", reason: "Section 69 bars only suits by or on behalf of an unregistered firm or its partners.", a: 0, e: "Both are true, and A follows directly from the limited scope of the bar described in R." },
        { act: "ipa", ar: true, topic: "Sec. 13(c)", assertion: "Interest on capital, where agreed, is payable even in a year of loss.", reason: "Under Section 13(c), interest on capital is payable only out of profits.", a: 3, e: "R states s. 13(c) correctly and shows that A is false." },
        { act: "ipa", ar: true, topic: "Sec. 5", assertion: "Members of a Hindu Undivided Family carrying on the family business are not partners.", reason: "Under the Indian Partnership Act, every partnership must be registered with the Registrar of Firms.", a: 2, e: "A is true (s. 5: the relation arises from status, not contract). R is false, since registration is optional." },

        /* ----------------------------- SOGA 1930 ---------------------------- */
        { act: "soga", topic: "Sec. 2(7)", q: "Which of the following is NOT 'goods' under Section 2(7)?", o: ["An actionable claim, such as a book debt", "Stock and shares", "Growing crops agreed to be severed before sale", "Grass"], e: "Section 2(7): goods means every kind of movable property other than actionable claims and money, and includes stock and shares, growing crops, grass and things attached to the land agreed to be severed before sale." },
        { act: "soga", topic: "Sec. 2(7)", q: "Rare old coins that are no longer legal tender, sold to a collector as curios, are:", o: ["Goods, since 'money' in s. 2(7) means current legal tender", "Money, and so outside the Act", "Actionable claims", "Immovable property"], e: "The exclusion of 'money' refers to money as currency. Coins sold as collectors' items are treated as goods." },
        { act: "soga", topic: "Sec. 4", q: "A exchanges his car for B's motorcycle, with no money passing. The transaction is:", o: ["A barter or exchange, not a sale, as there is no money price", "A sale of goods", "An agreement to sell", "A hire-purchase agreement"], e: "Section 4(1) requires a transfer of property for a 'price', and s. 2(10) defines price as the money consideration. A pure exchange is outside the Act." },
        { act: "soga", topic: "Sec. 4", q: "A sells his car to B for ₹2 lakh plus B's old scooter. The transaction is:", o: ["A contract of sale, since part of the consideration is money", "A barter, outside the Act", "Void for uncertainty of price", "A contract of exchange under the Transfer of Property Act"], e: "Where the consideration is partly money and partly goods, courts treat the transaction as a sale (Aldridge v. Johnson)." },
        { act: "soga", topic: "Sec. 4(4)", q: "An agreement to sell becomes a sale when:", o: ["The time elapses, or the conditions are fulfilled, subject to which the property is to be transferred", "The goods are delivered", "The price is paid", "The buyer takes possession"], e: "Section 4(4). Delivery and payment are not themselves decisive; passing of property is what matters." },
        { act: "soga", topic: "Sec. 4, 26", q: "Under an agreement to sell, the goods are accidentally destroyed while property is still with the seller. Ordinarily the loss falls on:", o: ["The seller, as risk prima facie passes with property (s. 26)", "The buyer", "Both equally", "The carrier"], e: "Unless otherwise agreed, goods remain at the seller's risk until property passes, whether or not delivery has been made." },
        { act: "soga", topic: "Sec. 6(3)", q: "A 'sells' today the mangoes his orchard will produce next season, describing it as a present sale. Legally it operates as:", o: ["An agreement to sell future goods (s. 6(3))", "A present sale", "A void contract", "A wagering agreement"], e: "Section 6(3): where a seller purports to effect a present sale of future goods, the contract operates as an agreement to sell." },
        { act: "soga", topic: "Sec. 6(2)", q: "A agrees to sell B a rare painting if he succeeds in buying it from its present owner. The painting is:", o: ["Contingent goods", "Specific goods owned by the seller", "Ascertained goods", "Existing goods"], e: "Section 6(2): the acquisition of contingent goods by the seller depends on a contingency that may or may not happen. They are a species of future goods." },
        { act: "soga", topic: "Sec. 7 · Couturier v. Hastie", q: "A sells B a specific horse that, unknown to A, had died an hour before the contract. The contract is:", o: ["Void (s. 7)", "Voidable at B's option", "Valid, with B bearing the loss", "Valid, with A bound to supply another horse"], e: "Section 7: a contract for specific goods that, without the seller's knowledge, have perished at the time of contract is void." },
        { act: "soga", topic: "Sec. 8", q: "A agrees to sell a specific car to B, with property to pass on payment next week. Before then, lightning destroys the car without fault of either party. The agreement is:", o: ["Avoided (s. 8)", "Enforceable, and B must pay", "Void ab initio", "Voidable at A's option"], e: "Section 8: an agreement to sell specific goods is avoided if, without fault of either party, the goods perish before risk passes to the buyer." },
        { act: "soga", topic: "Sec. 9(2)", q: "The parties agree on the sale of 100 quintals of wheat but fix no price and no way of fixing it, and there is no course of dealing. The buyer must pay:", o: ["A reasonable price (s. 9(2)), which is a question of fact", "The market price on the date of contract in every case", "Nothing, because the contract is void for uncertainty", "Whatever price the seller demands"], e: "Section 9(2): where the price is not determined, the buyer pays a reasonable price, which depends on the circumstances of each case." },
        { act: "soga", topic: "Sec. 10", q: "The price is to be fixed by valuer V, who dies before valuing. No goods have been delivered. The agreement:", o: ["Is avoided (s. 10(1))", "Continues, with the court fixing the price", "Continues, with the buyer paying a reasonable price", "Lets the seller fix the price"], e: "Section 10(1) avoids the agreement. If goods have been delivered and appropriated, the buyer must pay a reasonable price for them." },
        { act: "soga", topic: "Sec. 11", q: "Unless a different intention appears, a stipulation as to the time of PAYMENT is:", o: ["Not of the essence of the contract", "Always of the essence", "A condition", "Void"], e: "Section 11. Whether any other stipulation as to time, such as time of delivery, is of the essence depends on the terms of the contract." },
        { act: "soga", topic: "Sec. 11 · British Paints", q: "In a contract for sale of goods with fluctuating market prices, the time of delivery is ordinarily:", o: ["Of the essence, and an agreed extension fixes a new essential date", "Never of the essence", "Of the essence only if the price is paid in advance", "Irrelevant once the goods are ascertained"], e: "Mercantile contracts are construed to make delivery time essential (Orissa Textile Mills; British Paints v. Union of India). An extension fixes a new essential date." },
        { act: "soga", topic: "Sec. 12(4)", q: "Whether a stipulation is a condition or a warranty depends on:", o: ["The construction of the contract in each case; a stipulation may be a condition though called a warranty", "Only the word the parties used", "The value of the goods", "The seller's intention alone"], e: "Section 12(4): substance, not the label, determines the classification." },
        { act: "soga", topic: "Sec. 12", q: "For breach of a WARRANTY, the buyer may:", o: ["Claim damages only, not reject the goods", "Reject the goods and claim damages", "Treat the contract as repudiated", "Rescind the contract and recover the price"], e: "Section 12(3): breach of warranty gives a claim for damages but not a right to reject the goods. See also s. 59." },
        { act: "soga", topic: "Sec. 13(2)", q: "In a non-severable contract, B accepts the goods and then discovers a breach of condition. B can:", o: ["Only claim damages, since the breach must be treated as a breach of warranty (s. 13(2))", "Reject the goods and recover the price", "Rescind and claim damages", "Return the goods within 30 days"], e: "Section 13(2): where the contract is not severable and the buyer has accepted the goods or part of them, a breach of condition can be treated only as a breach of warranty, unless the contract provides otherwise." },
        { act: "soga", topic: "Sec. 14(a) · Rowland v. Divall", q: "B buys a car from S, uses it for 4 months, and then surrenders it to the true owner because S had no title. B can recover:", o: ["The full price, as there is a total failure of consideration", "The price less a deduction for 4 months' use", "Only damages for loss of quiet possession", "Nothing, because he used the car"], e: "Breach of the implied condition of title in s. 14(a). B bargained for ownership, not mere use, so he gets the full price back (Rowland v. Divall)." },
        { act: "soga", topic: "Sec. 14", q: "Which implied term under Section 14 is a CONDITION?", o: ["That the seller has a right to sell the goods", "That the buyer shall have quiet possession", "That the goods are free from undisclosed charges or encumbrances", "That the goods will be delivered at a reasonable hour"], e: "Section 14(a) implies a condition of right to sell; s. 14(b) and (c) imply warranties. The fourth option is a delivery rule under s. 36(4), not an implied term of title." },
        { act: "soga", topic: "Sec. 14 · Niblett", q: "Tins of milk sold to B bear labels infringing a third party's trade mark, and customs detain them. The seller breached:", o: ["The implied condition of right to sell (s. 14(a)) and the warranty of quiet possession (s. 14(b))", "Only the condition of merchantable quality", "Only the condition as to description (s. 15)", "Nothing, because the milk itself was sound"], e: "In Niblett v. Confectioners' Materials, a seller who could be restrained by injunction from selling had no 'right to sell'." },
        { act: "soga", topic: "Sec. 15 · Beale v. Taylor", q: "A car advertised as a '1961 Herald' is inspected and bought. It turns out to be two halves of different cars welded together. This breaches:", o: ["The implied condition that the goods correspond with the description (s. 15)", "Nothing, since the buyer inspected it", "Only a warranty", "Section 14(b) only"], e: "Inspection does not prevent a sale being a sale by description where the buyer relies on the description (Beale v. Taylor)." },
        { act: "soga", topic: "Sec. 15 · Arcos v. Ronaasen", q: "Staves were ordered ½ inch thick; most delivered are 9/16 inch but still commercially usable. The buyer:", o: ["May reject them, since goods must correspond strictly with the description", "Must accept, as the deviation is minor", "May only claim a price reduction", "Must accept, since they are fit for purpose"], e: "In Arcos v. Ronaasen, the House of Lords held that 'description' calls for strict compliance, not merely commercial equivalence." },
        { act: "soga", topic: "Sec. 15", q: "Where goods are sold by sample as well as by description:", o: ["The bulk must correspond with both the sample and the description", "Correspondence with the sample alone is enough", "Correspondence with the description alone is enough", "Neither is implied"], e: "Section 15, second limb. A sample cannot cure a mismatch with the description, and vice versa." },
        { act: "soga", topic: "Sec. 16", q: "The doctrine of caveat emptor as embodied in Section 16 means:", o: ["Subject to exceptions, there is no implied condition as to quality or fitness, so the buyer must take care", "The seller must disclose all defects", "The buyer can always reject defective goods", "The seller is liable for latent defects in every case"], e: "Section 16 opens with the general rule and then lists the exceptions: fitness for purpose, merchantable quality, trade usage, and express terms. Fraud by the seller also displaces it." },
        { act: "soga", topic: "Sec. 16(1) · Priest v. Last", q: "B asks a chemist for a 'hot-water bottle'. It bursts and scalds B's wife. The seller is liable under s. 16(1) because:", o: ["Where goods have only one obvious purpose, the buyer impliedly makes it known and relies on the seller's skill", "The chemist manufactured the bottle", "Of the condition of title", "The bottle was sold by sample"], e: "In Priest v. Last, asking for a single-purpose article by name sufficiently discloses the purpose." },
        { act: "soga", topic: "Sec. 16(1) proviso", q: "B, without relying on the dealer's skill or judgment, insists on a specific branded fan by its trade name. The implied condition of fitness for purpose:", o: ["Does not arise, because of the patent or trade name proviso", "Arises fully", "Arises only if the fan is defective", "Arises for one year only"], e: "The proviso excludes the fitness condition where goods are bought under a patent or trade name. Courts read it narrowly: if the buyer still relies on the seller's skill, the condition may arise (Baldry v. Marshall)." },
        { act: "soga", topic: "Sec. 16(1) · Jones v. Padgett", q: "B buys cloth fit for ordinary use but intends, without telling the seller, to make servants' liveries. It proves unsuitable. The seller is:", o: ["Not liable under s. 16(1), since the particular purpose was never disclosed", "Liable for breach of fitness for purpose", "Liable under s. 15", "Liable for breach of warranty"], e: "Section 16(1) requires the buyer to make the particular purpose known, expressly or by implication (Jones v. Padgett)." },
        { act: "soga", topic: "Sec. 16 · Kendall v. Lillico", q: "Groundnut meal is toxic to poultry but safe for cattle. It is sold generally as feed without poultry being specified. It is:", o: ["Merchantable, because it is saleable for at least one normal purpose, though fitness may fail if the poultry purpose was disclosed", "Unmerchantable in every case", "Fit for every purpose", "Outside the Act"], e: "Henry Kendall v. William Lillico: multi-purpose goods are merchantable if fit for some purpose for which goods of that description are commonly bought." },
        { act: "soga", topic: "Sec. 16(2) proviso", q: "B examined a bale of cloth and missed a defect that a reasonable examination would have revealed. Under s. 16(2), B:", o: ["Cannot complain of that defect as to merchantability", "Can reject the goods for unmerchantability", "Can claim damages under s. 16(2)", "Can sue under s. 17"], e: "Proviso to s. 16(2): if the buyer has examined the goods, there is no implied condition as regards defects that such examination ought to have revealed." },
        { act: "soga", topic: "Sec. 16 · Grant v. AKM", q: "Woollen underwear containing invisible chemical residue causes dermatitis. The buyer could not have discovered the defect. The retailer is liable for breach of:", o: ["Both fitness for purpose (s. 16(1)) and merchantable quality (s. 16(2))", "Only the implied condition of title", "Only description (s. 15)", "Nothing, since the defect was latent"], e: "In Grant v. Australian Knitting Mills, a latent defect is no defence. Underwear has an obvious purpose and was bought by description from a dealer." },
        { act: "soga", topic: "Sec. 16(2) · Bristol Tramways", q: "'Merchantable quality' was classically explained in Bristol Tramways v. Fiat Motors as goods that:", o: ["A reasonable buyer, after full examination, would accept under the contract", "Are of the best quality available", "Are fit for every conceivable purpose", "Carry a manufacturer's warranty"], e: "Farwell L.J.'s test asks whether the goods are in such a state that a reasonable buyer, after full examination, would accept them in performance of his offer to buy." },
        { act: "soga", topic: "Sec. 17", q: "Which is NOT an implied condition in a sale by sample under Section 17?", o: ["That the goods are fit for any purpose the buyer has in mind", "That the bulk corresponds with the sample in quality", "That the buyer has a reasonable opportunity of comparing the bulk with the sample", "That the goods are free from defects rendering them unmerchantable that would not be apparent on reasonable examination of the sample"], e: "Section 17(2)(a)–(c) imply these three conditions. Fitness for an undisclosed purpose is not implied." },
        { act: "soga", topic: "Sec. 18 · Re Wait", q: "B buys 100 bags of rice out of 1,000 identical bags in S's godown. None are set apart. A fire destroys the godown. Had property passed to B?", o: ["No. The goods were unascertained, so no property passed (s. 18)", "Yes, on the making of the contract", "Yes, in a 10% proportion", "Yes, on payment of the price"], e: "Property in unascertained goods cannot pass until they are ascertained. The loss falls on S, and B can recover any price paid." },
        { act: "soga", topic: "Sec. 20 · Tarling v. Baxter", q: "A specific haystack in a deliverable state is sold unconditionally, with payment and removal postponed. It burns down before removal, without fault. The loss falls on:", o: ["The buyer, since property, and so risk, passed when the contract was made (s. 20, s. 26)", "The seller, who still had possession", "Both equally", "The seller, since the price was unpaid"], e: "Section 20: in an unconditional contract for specific goods in a deliverable state, property passes on the contract even if payment or delivery is postponed." },
        { act: "soga", topic: "Sec. 21", q: "S sells a specific machine to B and agrees to fit a missing part before delivery. Property passes:", o: ["When the part is fitted and B has notice of it", "When the contract is made", "When B pays", "When the machine is delivered"], e: "Section 21: where the seller must do something to put specific goods into a deliverable state, property passes only when that is done and the buyer has notice of it." },
        { act: "soga", topic: "Sec. 22", q: "S sells B a specific heap of coal at ₹X per tonne and must weigh it to work out the price. Property passes:", o: ["When S has weighed it and B has notice", "When the contract is made", "When payment is made", "When delivery is made"], e: "Section 22 deals with specific goods in a deliverable state where the seller must weigh, measure or test them to ascertain the price." },
        { act: "soga", topic: "Sec. 23(2)", q: "Under a contract for unascertained goods, S delivers goods of the contract description to a railway for carriage to B, without reserving the right of disposal. This is:", o: ["Unconditional appropriation, so property passes to B", "Nothing until B receives the goods", "A reservation of the right of disposal", "Constructive delivery that does not pass property"], e: "Section 23(2) deems delivery to a carrier, without reserving the right of disposal, to be unconditional appropriation to the contract." },
        { act: "soga", topic: "Sec. 24", q: "Goods are sent 'on sale or return' for 7 days. B keeps them for 15 days without giving notice of rejection. Property:", o: ["Passed to B on the expiry of the 7 days", "Remains with S", "Passes only on payment", "Passes only on B's express approval"], e: "Section 24(b): retaining goods beyond the fixed time (or a reasonable time) without giving notice of rejection passes property." },
        { act: "soga", topic: "Sec. 24 · Kirkham v. Attenborough", q: "B, holding jewellery 'on sale or return', pledges it with a pawnbroker. The effect is:", o: ["B has done an act adopting the transaction, so property passed to B and the pledge is valid", "Property stays with the seller, who can recover from the pawnbroker", "The pledge is void", "The contract is automatically rescinded"], e: "Section 24(a): any act adopting the transaction, such as a pledge or resale, passes property to the buyer (Kirkham v. Attenborough)." },
        { act: "soga", topic: "Sec. 25(2)", q: "S ships goods to B, but the bill of lading makes them deliverable to S's own order. Prima facie:", o: ["S has reserved the right of disposal, so property has not passed", "Property has passed to B on shipment", "Property has passed to the carrier", "The goods are at B's risk"], e: "Section 25(2): taking the bill of lading to the seller's order is prima facie a reservation of the right of disposal." },
        { act: "soga", topic: "Sec. 25(3)", q: "S sends B a bill of exchange for acceptance together with the bill of lading. B keeps the bill of lading but does not honour the bill of exchange. Property:", o: ["Does not pass to B", "Passes to B", "Passes to the carrier", "Is shared between S and B"], e: "Section 25(3): if the buyer does not honour the bill of exchange, he must return the bill of lading, and if he wrongfully keeps it, property does not pass to him." },
        { act: "soga", topic: "Sec. 26", q: "Property in specific goods has passed to B, but they are still in S's warehouse awaiting collection. A fire, not S's fault, destroys them. The loss falls on:", o: ["B, as risk prima facie passes with property", "S, who had possession", "Both equally", "Only the insurer"], e: "Section 26: once property passes, the goods are at the buyer's risk whether or not delivery has been made. S remains liable as a bailee only for negligence." },
        { act: "soga", topic: "Sec. 26 proviso", q: "Delivery is delayed through B's fault, and the goods deteriorate during the delay. The loss is borne by:", o: ["B, as the party at fault", "S", "Both equally", "Whoever holds the property"], e: "Proviso to s. 26: where delivery is delayed through either party's fault, the goods are at that party's risk for any loss that might not have occurred but for the fault." },
        { act: "soga", topic: "Sec. 27", q: "T steals A's watch and sells it to B, a bona fide purchaser for value. A can:", o: ["Recover the watch from B, because a thief has no title to pass", "Not recover it, because B has good title", "Recover it only on repaying B", "Recover it only if B was negligent"], e: "This is nemo dat quod non habet (s. 27). None of the exceptions in ss. 27–30 protects a buyer from a thief." },
        { act: "soga", topic: "Sec. 27 (estoppel)", q: "Owner O stands by while S represents O's car as S's own and sells it to B. B acquires:", o: ["A good title, since O is precluded by his conduct from denying S's authority", "No title", "Title only after paying O", "Possessory title only"], e: "Section 27 itself excepts cases where the owner is, by his conduct, precluded from denying the seller's authority." },
        { act: "soga", topic: "Sec. 27 proviso", q: "Which is NOT a requirement for a buyer from a mercantile agent to get a good title under the proviso to Section 27?", o: ["The buyer must pay in cash", "The agent is in possession of the goods or documents of title with the owner's consent", "The agent sells in the ordinary course of business of a mercantile agent", "The buyer acts in good faith without notice of the agent's lack of authority"], e: "Payment in cash is not a requirement. The three real conditions are listed in the other options." },
        { act: "soga", topic: "Sec. 27 · Pearson v. Rose", q: "A mercantile agent has the owner's car with consent but obtains the registration book by a trick, and sells to an innocent buyer. The buyer:", o: ["Does not get a good title, since the car and its registration document must both be held with consent", "Gets a good title under the s. 27 proviso", "Gets a good title by estoppel", "Gets title only if he paid the market price"], e: "Pearson v. Rose & Young (1950). For a used car, sale without the registration book is not in the ordinary course of business." },
        { act: "soga", topic: "Sec. 27 · Folkes v. King", q: "A mercantile agent obtains a car with the owner's consent, secretly intending from the start to sell it and keep the money. He sells it to an innocent buyer. The buyer:", o: ["Gets a good title, since the owner's consent to possession is not vitiated by the agent's secret intent", "Gets no title, because the agent was dishonest", "Gets title only if the owner is negligent", "Gets a voidable title"], e: "Folkes v. King (1923): consent to possession is enough. The agent's undisclosed fraudulent intention does not negate it." },
        { act: "soga", topic: "Sec. 27 · Staffs Motor Guarantee", q: "A motor dealer holds a car as a hirer under a hire-purchase agreement and sells it. The buyer:", o: ["Is not protected by the s. 27 proviso, because the dealer did not hold the car in his capacity as a mercantile agent", "Is protected by the s. 27 proviso", "Gets title by estoppel", "Gets title under s. 30(1)"], e: "Staffs Motor Guarantee v. British Wagon: the possession must be given to the agent qua mercantile agent." },
        { act: "soga", topic: "Sec. 28", q: "A and B jointly own a car. With B's permission, A has sole possession. A sells it to C, who buys in good faith without notice. C acquires:", o: ["A good title (s. 28)", "Only A's half share", "No title", "Title subject to B's lien"], e: "Section 28: a joint owner in sole possession by permission of the co-owners can pass good title to a bona fide buyer without notice." },
        { act: "soga", topic: "Sec. 29 · Phillips v. Brooks", q: "R obtains a ring by fraud under a contract voidable under s. 19 of the Contract Act and, before the seller rescinds, sells it to B, who buys in good faith without notice. B acquires:", o: ["A good title (s. 29)", "No title", "Title only if he paid the market price", "Title only after rescission"], e: "Section 29 protects a bona fide buyer from a person holding under a voidable contract that has not yet been rescinded. Fraud face-to-face makes the contract voidable, not void." },
        { act: "soga", topic: "Sec. 30(1)", q: "S sells goods to B1 but keeps possession. He then sells and delivers the same goods to B2, who buys in good faith without notice of the first sale. B2:", o: ["Gets a good title, and B1's remedy is against S", "Gets no title", "Shares title with B1", "Must return the goods to B1"], e: "Section 30(1): a seller continuing in possession can pass good title to a bona fide transferee." },
        { act: "soga", topic: "Sec. 30(2) · Helby v. Matthews", q: "A hirer under a hire-purchase agreement, who may return the goods at any time, pledges them. The pledgee:", o: ["Gets no title, since the hirer has not 'agreed to buy' (Helby v. Matthews)", "Gets a good title under s. 30(2)", "Gets a good title under the s. 27 proviso", "Gets a good title if he paid value"], e: "Contrast Lee v. Butler. Where the 'hirer' is bound to buy, he is a buyer in possession under s. 30(2) and can pass good title." },
        { act: "soga", topic: "Sec. 30(2) · Lake v. Simmons", q: "A swindler obtains pearls by falsely claiming he will show them to named buyers, deceiving the owner as to identity. Did he obtain possession 'with consent' within s. 30(2)?", o: ["No. Deception as to identity negatives consent, so no good title can pass", "Yes, possession was voluntarily handed over", "Yes, but only for 24 hours", "Yes, if the pearls were insured"], e: "Lake v. Simmons and Central National Bank v. United Industrial Bank: 'consent' means real consensus ad idem." },
        { act: "soga", topic: "Sec. 32", q: "Unless otherwise agreed, delivery of goods and payment of the price are:", o: ["Concurrent conditions", "Independent promises", "Payment first, delivery later", "Delivery first, payment later"], e: "Section 32: the seller must be ready and willing to give possession in exchange for the price, and the buyer to pay in exchange for possession." },
        { act: "soga", topic: "Sec. 33", q: "Handing over the keys of a godown containing the goods sold is:", o: ["Symbolic delivery", "Actual delivery", "Constructive delivery by attornment", "No delivery"], e: "Section 33 recognises actual, symbolic and constructive delivery. Handing over the means of control, such as keys, is symbolic delivery." },
        { act: "soga", topic: "Sec. 36(3)", q: "Goods lie with warehouseman W. W acknowledges to buyer B that he now holds them on B's behalf. This is:", o: ["Constructive delivery by attornment", "Symbolic delivery", "Actual delivery", "No delivery until B collects"], e: "Section 36(3): where goods are held by a third person, there is no delivery until he acknowledges (attorns) to the buyer that he holds them on the buyer's behalf." },
        { act: "soga", topic: "Sec. 35", q: "Apart from any express contract, the seller is not bound to deliver the goods until:", o: ["The buyer applies for delivery", "The price is paid in full", "Thirty days have passed", "The seller has sent notice"], e: "Section 35." },
        { act: "soga", topic: "Sec. 36(1)", q: "A contract for specific goods is silent on the place of delivery. To both parties' knowledge, the goods were in Pune when the contract was made. The place of delivery is:", o: ["Pune, where the goods were at the time of the contract", "The buyer's place of business", "The seller's head office", "Anywhere the buyer chooses"], e: "Section 36(1): for specific goods, the place of delivery is where they are at the time of sale. Otherwise it is the seller's place of business." },
        { act: "soga", topic: "Sec. 36(5)", q: "Unless otherwise agreed, the expenses of putting the goods into a deliverable state are borne by:", o: ["The seller", "The buyer", "Both equally", "The carrier"], e: "Section 36(5)." },
        { act: "soga", topic: "Sec. 37(2)", q: "B ordered 100 bags; S delivers 120. B may:", o: ["Accept 100 and reject 20, reject all, or accept all 120 at the contract rate", "Only accept all 120", "Only reject all 120", "Accept all 120 but pay only for 100"], e: "Section 37(2) gives these three options for delivery of a larger quantity." },
        { act: "soga", topic: "Sec. 37(1)", q: "B ordered 100 bags; S delivers 80. B may:", o: ["Reject all, or accept the 80 and pay at the contract rate", "Must accept the 80 and wait for the rest", "Accept the 80 and pay at the market rate", "Only claim damages"], e: "Section 37(1) applies to delivery of a smaller quantity." },
        { act: "soga", topic: "Sec. 37(3)", q: "B ordered 100 bags of wheat; S delivers them mixed with 20 bags of rice. B may:", o: ["Accept the wheat and reject the rice, or reject the whole", "Must accept everything", "Must reject the whole", "Accept the rice and reject the wheat"], e: "Section 37(3) covers goods ordered mixed with goods of a different description." },
        { act: "soga", topic: "Sec. 38", q: "The contract is silent on instalments. S tenders half the goods now and half next month. B:", o: ["Is not bound to accept delivery by instalments", "Must accept both instalments", "Must accept but may pay later", "Must accept only the first instalment"], e: "Section 38(1): unless otherwise agreed, the buyer is not bound to accept delivery by instalments." },
        { act: "soga", topic: "Sec. 39(3)", q: "Goods are sent by sea in circumstances where it is usual to insure. The seller fails to give the buyer notice to enable him to insure. During sea transit, the goods are:", o: ["At the seller's risk", "At the buyer's risk", "At the carrier's risk", "At nobody's risk"], e: "Section 39(3)." },
        { act: "soga", topic: "Sec. 40", q: "S agrees to deliver at his own risk at the buyer's distant town. Goods deteriorate in a way that is necessarily incidental to the transit. This deterioration risk is on:", o: ["The buyer, unless otherwise agreed", "The seller, since he took the transit risk", "The carrier", "Both equally"], e: "Section 40." },
        { act: "soga", topic: "Sec. 41, 42", q: "Goods B had never examined arrive. A week later, without examining them, B resells and delivers them to C. B is:", o: ["Deemed to have accepted, as he did an act inconsistent with the seller's ownership (s. 42)", "Still entitled to reject, as he never examined them", "Deemed to have accepted only part", "Entitled to reject within a reasonable time"], e: "Section 42 lists three modes of acceptance: intimation, an act inconsistent with the seller's ownership, and retention beyond a reasonable time without intimating rejection." },
        { act: "soga", topic: "Sec. 43", q: "B lawfully rejects goods delivered to him. He:", o: ["Need not return them; it is enough to tell the seller he refuses to accept them", "Must return them at his own cost", "Must return them within 7 days", "Must sell them and remit the price"], e: "Section 43." },
        { act: "soga", topic: "Sec. 44", q: "S is ready to deliver and asks B to take delivery. B fails to do so within a reasonable time. B is liable for:", o: ["Any loss caused by his neglect, and a reasonable charge for care and custody of the goods", "Only the price", "Nothing until the contract date", "Damages only if the goods perish"], e: "Section 44." },
        { act: "soga", topic: "Sec. 45", q: "S receives a cheque for the full price, and the cheque is dishonoured. S is:", o: ["An unpaid seller (s. 45(1)(b))", "Not an unpaid seller, since he was paid", "An unpaid seller only if the buyer is insolvent", "Bound to sue on the cheque only"], e: "A negotiable instrument received as conditional payment that is dishonoured makes the seller 'unpaid'." },
        { act: "soga", topic: "Sec. 47", q: "S sells goods to B on 3 months' credit, and the goods remain with S. After 1 month, B, who is solvent, demands delivery without paying. S:", o: ["Must deliver, since there is no lien while the credit period runs", "May keep the goods under lien", "May resell the goods", "May stop them in transit"], e: "Section 47(1): lien arises only where there is no credit stipulation, where the credit term has expired, or where the buyer becomes insolvent." },
        { act: "soga", topic: "Sec. 47(1)(c)", q: "In the same facts, B becomes insolvent during the credit period. S:", o: ["May exercise his lien and retain the goods", "Must still deliver", "Must first obtain a decree", "Loses all his rights"], e: "Section 47(1)(c): the buyer's insolvency revives the lien even during the credit period." },
        { act: "soga", topic: "Sec. 49(2)", q: "An unpaid seller still holding the goods obtains a decree for the price. His lien:", o: ["Continues, since it is not lost merely by obtaining a decree", "Is lost", "Turns into a right of stoppage in transit", "Lapses after 30 days"], e: "Section 49(2)." },
        { act: "soga", topic: "Sec. 49(1)", q: "In which case does an unpaid seller LOSE his lien?", o: ["He delivers the goods to a carrier for transmission to the buyer without reserving the right of disposal", "He obtains a decree for the price", "He holds the goods as the buyer's bailee", "He makes a part delivery without any intention to waive the lien"], e: "Section 49(1) lists loss by delivery to a carrier without reservation, by the buyer lawfully obtaining possession, and by waiver. The other options are cases where the lien survives (ss. 47(2), 48, 49(2))." },
        { act: "soga", topic: "Sec. 50", q: "The right of stoppage in transit is available only when:", o: ["The buyer is insolvent, the seller has parted with possession, and the goods are in course of transit", "The buyer merely refuses to pay", "The seller is still in possession", "The seller has a decree for the price"], e: "Section 50. Insolvency is essential to stoppage but not to lien." },
        { act: "soga", topic: "Sec. 51(3)", q: "Goods reach their destination, and the carrier tells the buyer's agent it now holds them on the buyer's behalf. The seller then seeks to stop them. He is:", o: ["Too late, because transit ended on the attornment", "In time, since the buyer has not collected them", "In time with a court order", "In time if the buyer is insolvent"], e: "Section 51(3)." },
        { act: "soga", topic: "Sec. 51(4)", q: "The goods arrive, the buyer rejects them, and the carrier keeps them. The seller learns the buyer is insolvent. Transit:", o: ["Continues, even if the seller refuses to take them back, so stoppage is still possible", "Ended on arrival", "Ended on rejection", "Never began"], e: "Section 51(4)." },
        { act: "soga", topic: "Sec. 52", q: "An unpaid seller gives the carrier notice to stop the goods in transit. The carrier must redeliver them:", o: ["To or according to the seller's directions, at the seller's expense", "To the buyer", "At the carrier's expense", "Only after the buyer consents"], e: "Section 52. Stoppage is effected by taking actual possession or by notice to the carrier or its principal." },
        { act: "soga", topic: "Sec. 53 · Lickbarrow v. Mason", q: "B, the buyer, indorses the bill of lading to C, who takes it in good faith for value. S then tries to stop the goods in transit. S's right is:", o: ["Defeated, because the transfer of the document of title to a bona fide transferee for value defeats it", "Unaffected", "Suspended until payment", "Exercisable against C only for half"], e: "Proviso to s. 53(1). If the transfer was by way of pledge, the seller's rights are instead subject to the pledgee's rights." },
        { act: "soga", topic: "Sec. 54(2)", q: "An unpaid seller resells non-perishable goods WITHOUT giving the buyer notice of his intention, and suffers a loss of ₹10,000. S:", o: ["Cannot recover that loss from the buyer, and the buyer is entitled to any profit on the resale", "Can recover the loss", "Has made a void resale", "Must restore the goods"], e: "Section 54(2)." },
        { act: "soga", topic: "Sec. 54(3)", q: "An unpaid seller who has exercised his lien resells to C, without having given notice to the original buyer. C acquires:", o: ["A good title as against the original buyer", "No title", "A voidable title", "Title only after the original buyer consents"], e: "Section 54(3)." },
        { act: "soga", topic: "Sec. 55(1)", q: "Property in the goods has passed to B, who wrongfully refuses to pay. S's appropriate remedy is:", o: ["A suit for the price (s. 55(1))", "Only damages for non-acceptance", "Only resale", "Specific performance"], e: "When property has passed, the seller sues for the price itself, not merely for damages." },
        { act: "soga", topic: "Sec. 55(2)", q: "The contract says the price is payable on 1 March irrespective of delivery. Property has not passed. B does not pay on that date. S may:", o: ["Sue for the price (s. 55(2))", "Only sue for damages", "Only resell", "Do nothing until delivery"], e: "Section 55(2) allows a suit for the price where it is payable on a day certain irrespective of delivery, even though property has not passed." },
        { act: "soga", topic: "Sec. 57", q: "S agreed to sell at ₹100 per unit. On the delivery date the market price is ₹130, and S refuses to deliver. B's damages per unit, ordinarily, are:", o: ["₹30: market price minus contract price", "₹130", "₹100", "Nil, because B had not paid"], e: "Section 57 read with s. 73 of the Contract Act: the usual measure is the difference between market and contract price on the date fixed for delivery." },
        { act: "soga", topic: "Sec. 56", q: "B wrongfully refuses to accept goods. The contract price is ₹100 per unit and the market price on the date fixed is ₹80. S's damages per unit, ordinarily, are:", o: ["₹20", "₹100", "₹80", "₹180"], e: "Section 56: for non-acceptance, the measure is ordinarily contract price minus market price." },
        { act: "soga", topic: "Sec. 58", q: "Specific performance under Section 58 may be decreed in a contract to deliver:", o: ["Specific or ascertained goods", "Any unascertained goods", "Future goods only", "Money"], e: "Section 58 makes it discretionary and subject to the Specific Relief Act." },
        { act: "soga", topic: "Sec. 59", q: "For a breach of warranty, the buyer may:", o: ["Set up the breach in diminution or extinction of the price, or sue for damages", "Reject the goods", "Rescind the contract", "Only claim interest"], e: "Section 59(1). Under s. 59(2), setting up the breach against the price does not prevent a suit for further damage." },
        { act: "soga", topic: "Sec. 60", q: "In May, the seller repudiates a contract due for delivery in August. The buyer may:", o: ["Either treat the contract as subsisting until August, or treat it as rescinded and sue at once", "Only wait until August", "Only sue in August", "Neither, since there is no breach before August"], e: "Section 60 deals with anticipatory breach. If the buyer keeps the contract alive, it also stays alive for the seller's benefit." },
        { act: "soga", topic: "Sec. 62", q: "Implied rights, duties and liabilities under a contract of sale may be negatived or varied by:", o: ["Express agreement, the course of dealing between the parties, or usage binding both", "Only a registered agreement", "Only an order of the Court", "None of these, as they are mandatory"], e: "Section 62. Note Baldry v. Marshall: excluding 'warranties' does not exclude conditions." },
        { act: "soga", topic: "Sec. 63", q: "Under the Act, what is a 'reasonable time' is:", o: ["A question of fact", "A question of law", "Always 30 days", "Fixed by rules"], e: "Section 63." },
        { act: "soga", topic: "Sec. 64(2)", q: "At an auction, B bids and then withdraws the bid before the hammer falls. B:", o: ["May withdraw, since the sale is complete only on the fall of the hammer", "Is bound by the bid", "Must pay a 10% penalty", "May withdraw only with the auctioneer's consent"], e: "Section 64(2): the sale is complete on the fall of the hammer or in other customary manner, and until then any bidder may retract his bid." },
        { act: "soga", topic: "Sec. 64(6)", q: "The seller secretly plants a person to make fake bids and push up the price. The sale is:", o: ["Voidable at the buyer's option", "Void", "Valid", "Voidable at the seller's option"], e: "Section 64(6). Section 64(3)–(4) also requires a seller's right to bid to be expressly notified." },
        { act: "soga", topic: "Sec. 64-A", q: "After a contract is made, the GST rate on the goods rises before delivery. Absent a contrary intention, the seller may:", o: ["Add the increase to the contract price", "Not add anything, since the price is fixed", "Rescind the contract", "Claim the increase only from the Government"], e: "Section 64-A: a seller may add increased duties or taxes, and a buyer may deduct reductions, unless the contract shows a different intention." },
        { act: "soga", topic: "Sec. 4 · Gannon Dunkerley · Art. 366(29A)", q: "After Gannon Dunkerley (1958), States were enabled to tax the transfer of property in goods involved in works contracts by:", o: ["The Constitution (Forty-sixth Amendment) Act, 1982, inserting Art. 366(29A)", "The Constitution (Forty-second Amendment) Act, 1976", "An amendment to the Sale of Goods Act in 1963", "The Constitution (One Hundred and First Amendment) Act, 2016"], e: "Gannon Dunkerley held that an indivisible works contract is not a 'sale'. The 46th Amendment created the deemed-sale fiction in Art. 366(29A), including works contracts and supply of food in restaurants." },
        { act: "soga", topic: "Sec. 4 · Lee v. Griffin / Robinson v. Graves", q: "A dentist makes a custom set of dentures for a patient. Under Lee v. Griffin this is:", o: ["A sale of goods, as the end product is a chattel delivered to the buyer", "A contract for work and labour, since skill predominates", "A works contract", "A contract of service"], e: "Lee v. Griffin applied the 'end-product' test. Contrast Robinson v. Graves, where commissioning a portrait was held to be a contract for skill, with materials ancillary." },
        { act: "soga", topic: "Sec. 4 · Kone Elevators (2014)", q: "In Kone Elevators (2014), the Constitution Bench held that a contract to manufacture, supply and install a lift in a building is:", o: ["A composite works contract, not a sale", "A pure sale of goods", "A contract for services only", "A contract of hire"], e: "The 2014 Constitution Bench overruled the 2005 decision that had treated it as a sale." },
        { act: "soga", topic: "Sec. 2(4)", q: "Which of the following is NOT a 'document of title to goods' under Section 2(4)?", o: ["A cash memo or invoice", "A bill of lading", "A railway receipt", "A warehouse-keeper's certificate"], e: "Section 2(4) includes bills of lading, dock-warrants, warehouse-keeper's or wharfinger's certificates, railway receipts, multimodal transport documents, warrants or orders for delivery, and documents used in the ordinary course of business as proof of the possession or control of goods. An invoice does not transfer control of goods (see Morvi Mercantile Bank on railway receipts)." },
        { act: "soga", topic: "Sec. 2(11)", q: "'Property' in the Sale of Goods Act means:", o: ["The general property in goods, and not merely a special property", "Possession of goods", "Any interest, including a pledgee's special property", "Physical custody"], e: "Section 2(11). A pledge transfers only a special property, which is why it is not a sale." },
        { act: "soga", topic: "Sec. 1", q: "The Sale of Goods Act, 1930 came into force on:", o: ["1 July 1930", "1 October 1930", "1 January 1931", "15 March 1930"], e: "Section 1(3). Before that, sale of goods was governed by Chapter VII of the Indian Contract Act, 1872 (ss. 76–123)." },
        { act: "soga", topic: "Sec. 5(2)", q: "A contract of sale of goods may be made:", o: ["In writing, by word of mouth, partly in both, or implied from the parties' conduct", "Only in writing", "Only on stamp paper", "Only if registered"], e: "Section 5(2): no special form is required, subject to any other law." },
        { act: "soga", ar: true, topic: "Sec. 27", assertion: "A thief cannot pass a good title even to a bona fide purchaser for value.", reason: "No one can give a better title than he himself has (nemo dat quod non habet).", a: 0, e: "A thief has no title at all and none of the exceptions applies, so R directly explains A." },
        { act: "soga", ar: true, topic: "Sec. 18", assertion: "In a contract for the sale of unascertained goods, property passes when the contract is made.", reason: "Property in goods cannot pass until the goods are ascertained.", a: 3, e: "R (s. 18) is true and is exactly why A is false." },
        { act: "soga", ar: true, topic: "Sec. 13(2)", assertion: "A buyer who has accepted goods under a non-severable contract can only claim damages for a breach of condition.", reason: "Section 13(2) compels such a breach of condition to be treated as a breach of warranty.", a: 0, e: "Both are true, and R explains A." },
        { act: "soga", ar: true, topic: "Sec. 11", assertion: "A stipulation as to time of delivery is always of the essence of a contract of sale.", reason: "Unless a different intention appears, a stipulation as to time of payment is not of the essence.", a: 3, e: "Under s. 11, whether delivery time is essential depends on the terms of the contract, so A is false. R correctly states the rule on payment." },
        { act: "soga", ar: true, topic: "Sec. 50", assertion: "An unpaid seller can stop goods in transit when the buyer merely refuses to pay.", reason: "The right of stoppage in transit arises only on the buyer's insolvency.", a: 3, e: "R correctly states s. 50, which makes A false." },
        { act: "soga", ar: true, topic: "Sec. 47, 50", assertion: "An unpaid seller's lien depends on his being in possession of the goods.", reason: "The right of stoppage in transit can be exercised only while the seller is still in possession.", a: 2, e: "A is true. R is false, because stoppage presupposes that the seller has parted with possession (s. 50)." }
      ];


      /* Recall-mode rewrites for questions that only made sense with answer choices.

      const RECALL_OVERRIDES = [

ct of sale is made.\n(15) Words used but not defined here, and defined in the Indian Contract Act, 1872, have the meanings given in that Act.",
          "3": "The unrepealed provisions of the Indian Contract Act, 1872 continue to apply to contracts for the sale of goods, except so far as they are inconsistent with the express provisions of this Act.",
          "4": "(1) A contract of sale of goods is a contract by which the seller transfers, or agrees to transfer, the property in goods to the buyer for a price. There may be a contract of sale between one part-owner and another.\n(2) A contract of sale may be absolute or conditional.\n(3) Where, under the contract, the property is transferred from the seller to the buyer, it is called a 'sale'. Where the transfer is to take place at a future time, or subject to some condition to be fulfilled later, it is called an 'agreement to sell'.\n(4) An agreement to sell becomes a sale when the time elapses, or the conditions are fulfilled, subject to which the property is to be transferred.",
          "5": "(1) A contract of sale is made by an offer to buy or sell goods for a price and the acceptance of that offer. The contract may provide for immediate delivery, immediate payment or both; for delivery or payment by instalments; or for delivery, payment or both to be postponed.\n(2) Subject to any other law in force, it may be made in writing, by word of mouth, partly in each, or may be implied from the conduct of the parties.",
          "6": "(1) The goods forming the subject of a contract of sale may be existing goods (owned or possessed by the seller) or future goods.\n(2) There may be a contract for the sale of goods whose acquisition by the seller depends on a contingency that may or may not happen ('contingent goods').\n(3) Where the seller purports to effect a present sale of future goods, the contract operates as an agreement to sell those goods.",
          "7": "Where there is a contract for the sale of specific goods, the contract is void if the goods, without the seller's knowledge, had perished at the time the contract was made, or had become so damaged as no longer to answer to their description in the contract.",
          "8": "Where there is an agreement to sell specific goods, and afterwards the goods perish, or become so damaged as no longer to answer to their description in the agreement, without any fault of the seller or the buyer and before the risk passes to the buyer, the agreement is thereby avoided.",
          "9": "(1) The price may be (a) fixed by the contract, (b) left to be fixed in a manner agreed in the contract, or (c) determined by the course of dealing between the parties.\n(2) Where the price is not determined in any of these ways, the buyer must pay the seller a reasonable price. What is reasonable is a question of fact, depending on the circumstances of each case.",
          "10": "(1) Where there is an agreement to sell at a price to be fixed by a third party's valuation, and that party cannot or does not make the valuation, the agreement is avoided.\nProviso: if the goods, or any part of them, have been delivered to and appropriated by the buyer, he must pay a reasonable price for them.\n(2) Where the third party is prevented from valuing by the fault of the seller or the buyer, the party not at fault may sue the party at fault for damages.",
          "11": "Unless a different intention appears from the terms of the contract, stipulations as to the time of PAYMENT are not deemed to be of the essence of a contract of sale.\nWhether any other stipulation as to time (for example, time of delivery) is of the essence depends on the terms of the contract.",
          "12": "(1) A stipulation in a contract of sale about the goods may be a condition or a warranty.\n(2) A 'condition' is a stipulation essential to the main purpose of the contract. Its breach gives a right to treat the contract as repudiated.\n(3) A 'warranty' is a stipulation collateral to the main purpose of the contract. Its breach gives a claim for damages, but not a right to reject the goods and treat the contract as repudiated.\n(4) Whether a stipulation is a condition or a warranty depends in each case on the construction of the contract. A stipulation may be a condition even though it is called a warranty in the contract.",
          "13": "(1) Where a contract of sale is subject to a condition to be fulfilled by the seller, the buyer may waive the condition, or elect to treat its breach as a breach of warranty and not as a ground for treating the contract as repudiated.\n(2) Where the contract is not severable and the buyer has accepted the goods or part of them, a breach of a condition to be fulfilled by the seller can only be treated as a breach of warranty, and not as a ground for rejecting the goods and treating the contract as repudiated, unless there is a term of the contract, express or implied, to that effect.\n(3) Nothing in this section affects a condition or warranty whose fulfilment is excused by law because of impossibility or otherwise.",
          "14": "In a contract of sale, unless the circumstances show a different intention, there is:\n(a) an implied CONDITION on the seller's part that, in a sale, he has a right to sell the goods, and in an agreement to sell, he will have a right to sell them at the time the property is to pass;\n(b) an implied WARRANTY that the buyer shall have and enjoy quiet possession of the goods;\n(c) an implied WARRANTY that the goods shall be free from any charge or encumbrance in favour of a third party not declared or known to the buyer before or at the time the contract is made.",
          "15": "Where there is a contract for the sale of goods by description, there is an implied condition that the goods shall correspond with the description.\nIf the sale is by sample as well as by description, it is not enough that the bulk corresponds with the sample if the goods do not also correspond with the description.",
