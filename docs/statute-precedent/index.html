            <div class="font-medium text-[15px]">${esc(c.name)} <span class="font-normal" style="color: var(--ink-secondary);">${esc(c.cite)}</span></div>
            <div class="font-mono-code text-[11px] mb-1" style="color: var(--ink-muted);">${esc(c.sec)}</div>
            <p class="text-[15px] leading-relaxed" style="color: var(--ink-secondary);">${esc(c.holding)}</p>
          </div>`;
      }

      function renderCard() {
        const total = state.queue.length;
        if (!total) { showEmpty(); return; }
        $('qcard').classList.remove('hidden');
        $('controls-area').classList.remove('hidden');
        $('summary-card').classList.add('hidden');

        const c = state.queue[state.idx];
        const A = ACTS[c.act];
        $('card-act-tag').textContent = A.code;
        $('card-kind-tag').textContent = c.kind;
        $('card-topic-hint').textContent = state.flipped ? (c.topic || '') : '';

        const badge = $('card-status-badge');
        if (state.mastered.has(c.id)) {
          badge.textContent = 'Mastered'; badge.style.backgroundColor = 'var(--accent-sage-soft)'; badge.style.color = 'var(--accent-sage)'; badge.classList.remove('hidden');
        } else if (state.review.has(c.id)) {
          badge.textContent = 'In review'; badge.style.backgroundColor = 'var(--accent-terracotta-soft)'; badge.style.color = 'var(--accent-terracotta)'; badge.classList.remove('hidden');
        } else badge.classList.add('hidden');

        $('card-question').innerHTML = `
          <div class="animate-reveal">
            <h2 class="font-serif-editorial text-[19px] sm:text-[22px] font-medium leading-snug ${c.body ? 'mb-4' : ''}">${esc(c.q)}</h2>
            ${c.body ? `<div class="quote-block rounded-md px-4 py-3 font-serif-editorial text-[16px] sm:text-[17px] leading-relaxed">${esc(c.body)}</div>` : ''}
          </div>`;

        const ans = $('card-answer');
        if (state.flipped) {
          const relatedLabel = c.casesFull ? 'What each precedent decided' : (c.relatedLabel || 'Precedents on this section');
          ans.innerHTML = `
            <div class="animate-reveal mt-6">
              <div class="detail-label mb-2">Answer</div>
              <div class="answer-block rounded-md px-4 py-3 font-serif-editorial text-[17px] sm:text-[19px] leading-snug font-medium">${esc(c.answer)}</div>
              ${c.explain ? `${c.explainLabel ? `<div class="detail-label mt-5 mb-1">${esc(c.explainLabel)}</div>` : ''}<p class="${c.explainLabel ? 'mt-1' : 'mt-4'} text-[15px] sm:text-base leading-relaxed" style="white-space: pre-line;">${esc(c.explain)}</p>` : ''}
              ${c.sections.length ? `<div class="mt-6"><div class="detail-label mb-1">Statutory provision${c.sections.length > 1 ? 's' : ''}</div>${c.sections.map((s) => sectionHtml(A, s)).join('')}</div>` : ''}
              ${c.cases.length ? `<div class="mt-6"><div class="detail-label mb-1">${esc(relatedLabel)}</div>${c.cases.map(caseHtml).join('')}</div>` : ''}
              <p class="mt-5 font-mono-code text-[11px]" style="color: var(--ink-muted);">${esc(c.source)}</p>
            </div>`;
          ans.classList.remove('hidden');
          $('card-side-label').textContent = 'Answer';
          $('card-footer-hint').textContent = 'Rate your recall: 1 needs review · 2 got it';
          $('pre-controls').classList.add('hidden');
          $('post-controls').classList.remove('hidden');
        } else {
          ans.classList.add('hidden'); ans.innerHTML = '';
          $('card-side-label').textContent = 'Question';
          $('card-footer-hint').textContent = 'Recall your answer, then press Space to reveal';
          $('pre-controls').classList.remove('hidden');
          $('post-controls').classList.add('hidden');
          $('btn-prev').disabled = state.idx === 0;
        }
      }

      function showEmpty() {
        $('qcard').classList.add('hidden');
        $('controls-area').classList.add('hidden');
        const el = $('summary-card');
        el.classList.remove('hidden');
        el.innerHTML = `
          <h2 class="font-serif-editorial text-2xl font-medium mb-2">No cards here</h2>
          <p class="text-sm max-w-md mb-6" style="color: var(--ink-secondary);">${state.reviewOnly ? 'Nothing is marked for review under these filters.' : 'No cards match these filters.'}</p>
          <button id="btn-summary-all" type="button" class="px-4 py-2 rounded-lg text-sm font-medium border" style="border-color: var(--border-strong); background-color: var(--bg-card-subtle);">Back to all cards</button>`;
        $('btn-summary-all').addEventListener('click', () => { state.reviewOnly = false; buildQueue(); });
      }

      function renderAll() { updateStats(); renderCard(); }

      /* =======================================================================
         10. INTERACTION
         ======================================================================= */
      let noticeTimer = null;
      function flashNotice(msg) {
        const el = $('shuffle-notice');
        el.textContent = msg; el.style.opacity = '1';
        clearTimeout(noticeTimer);
        noticeTimer = setTimeout(() => { el.style.opacity = '0'; }, 1800);
      }

      function flip() { if (state.queue.length) { state.flipped = !state.flipped; renderCard(); } }
      function next() {
        if (!state.queue.length) return;
        if (state.idx < state.queue.length - 1) state.idx += 1;
        else { state.queue = shuffle(state.queue); state.idx = 0; flashNotice('Round complete · reshuffled'); }
        state.flipped = false; renderAll();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
      function prev() { if (state.idx > 0) { state.idx -= 1; state.flipped = false; renderAll(); } }
      function mark(status) {
        if (!state.queue.length || !state.flipped) return;
        const c = state.queue[state.idx];
        if (status === 'known') {
          state.mastered.add(c.id); state.review.delete(c.id); saveProgress();
          if (state.reviewOnly) {
            state.queue.splice(state.idx, 1);
            if (state.idx >= state.queue.length) state.idx = Math.max(0, state.queue.length - 1);
            state.flipped = false; renderAll(); return;
          }
        } else {
          state.review.add(c.id); state.mastered.delete(c.id); saveProgress();
          if (state.queue.length > 2) {   // bring it back 4–7 cards later in this session
            const at = Math.min(state.queue.length, state.idx + 4 + Math.floor(Math.random() * 4));
            state.queue.splice(at, 0, c);
          }
        }
        next();
      }

      $('qcard').addEventListener('click', (e) => { if (!e.target.closest('a,button')) flip(); });
      $('btn-reveal').addEventListener('click', flip);
      $('btn-skip').addEventListener('click', next);
      $('btn-next').addEventListener('click', next);
      $('btn-prev').addEventListener('click', prev);
      $('btn-mark-review').addEventListener('click', () => mark('review'));
      $('btn-mark-known').addEventListener('click', () => mark('known'));

      function wirePills(containerId, attr) {
        $(containerId).addEventListener('click', (e) => {
          const btn = e.target.closest(`button[data-${attr}]`);
          if (!btn) return;
          state[attr] = btn.dataset[attr];
          document.querySelectorAll(`#${containerId} button`).forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
          buildQueue();
        });
      }
      wirePills('act-filters', 'act');
      wirePills('bank-filters', 'bank');
      $('btn-review-filter').addEventListener('click', () => { state.reviewOnly = !state.reviewOnly; buildQueue(); });
      $('btn-shuffle').addEventListener('click', () => { buildQueue(); flashNotice('Deck reshuffled'); });

      document.addEventListener('keydown', (e) => {
        if (!$('index-modal').classList.contains('hidden')) { if (e.key === 'Escape') closeIndex(); return; }
        if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        if (typeof mode !== 'undefined' && mode !== 'cards') return;
        const k = e.key.toLowerCase();
        if (k === ' ' || k === 'enter') {
          if (document.activeElement.tagName === 'BUTTON' && k === 'enter') return;
          e.preventDefault(); flip();
        } else if (state.flipped && k === '1') { e.preventDefault(); mark('review'); }
        else if (state.flipped && k === '2') { e.preventDefault(); mark('known'); }
        else if (k === 'n' || k === 'arrowright') { e.preventDefault(); next(); }
        else if (k === 'arrowleft' || k === 'p') { e.preventDefault(); prev(); }
      });

      const elTheme = $('btn-theme-toggle');
      function applyTheme(ev) {
        document.documentElement.classList.toggle('evening-mode', ev);
        elTheme.textContent = ev ? 'Paper mode' : 'Evening mode';
      }
      try { applyTheme(localStorage.getItem(THEME_KEY) === 'evening'); } catch (e) { applyTheme(false); }
      elTheme.addEventListener('click', () => {
        const ev = !document.documentElement.classList.contains('evening-mode');
        applyTheme(ev);
        try { localStorage.setItem(THEME_KEY, ev ? 'evening' : 'paper'); } catch (e) { /* ignore */ }
      });

      $('btn-reset-ask').addEventListener('click', () => {
        $('reset-default-wrap').classList.add('hidden');
        $('reset-confirm-wrap').classList.remove('hidden'); $('reset-confirm-wrap').classList.add('flex');
      });
      $('btn-reset-cancel').addEventListener('click', () => {
        $('reset-confirm-wrap').classList.add('hidden'); $('reset-confirm-wrap').classList.remove('flex');
        $('reset-default-wrap').classList.remove('hidden');
      });
      $('btn-reset-confirm').addEventListener('click', () => {
        state.mastered.clear(); state.review.clear(); state.reviewOnly = false; saveProgress();
        $('reset-confirm-wrap').classList.add('hidden'); $('reset-confirm-wrap').classList.remove('flex');
        $('reset-default-wrap').classList.remove('hidden');
        buildQueue(); flashNotice('Progress cleared');
      });

      /* =======================================================================
         11. REFERENCE INDEX (sections now list the cases on them)
         ======================================================================= */
      const INDEX_ITEMS = [];
      Object.values(ACTS).forEach((A) => {
        A.sections.forEach((s) => {
          const cs = A.casesBySec.get(s.num) || [];
          INDEX_ITEMS.push({ cat: `${A.key}-sec`, badge: A.code, heading: `Section ${s.num} — ${s.title}`, meta: s.ch,
            body: gistOf(A, s), extra: cs.length ? `Cases: ${cs.map((c) => c.name).join('; ')}` : '' });
        });
      });
      Object.values(ACTS).forEach((A) => {
        A.cases.forEach((c) => {
          INDEX_ITEMS.push({ cat: `${A.key}-case`, badge: `${A.key === 'ipa' ? 'IPA' : 'SOGA'} Case`, heading: c.name, meta: `${c.cite} · ${c.sec}`,
            body: c.holding, extra: '' });
        });
      });
      const TABS = [['all', 'All', INDEX_ITEMS.length], ['ipa-sec', 'IPA Sections', IPA_SECTIONS.length], ['soga-sec', 'SOGA Sections', SOGA_SECTIONS.length],
        ['ipa-case', 'IPA Cases', IPA_CASES.length], ['soga-case', 'SOGA Cases', SOGA_CASES.length]];
      $('index-tabs').innerHTML = TABS.map(([k, l, n], i) =>
        `<button type="button" data-itab="${k}" class="filter-pill ${i === 0 ? 'active' : ''} px-2.5 py-1 rounded-full text-xs font-medium">${l} (${n})</button>`).join('');
      $('index-subtitle').textContent = `${IPA_SECTIONS.length + SOGA_SECTIONS.length} statutory sections · ${IPA_CASES.length + SOGA_CASES.length} judicial precedents`;

      let activeTab = 'all';
      function renderIndex() {
        const q = $('index-search').value.trim().toLowerCase();
        const items = INDEX_ITEMS.filter((it) => (activeTab === 'all' || it.cat === activeTab) &&
          (!q || [it.heading, it.meta, it.body, it.extra].some((f) => f.toLowerCase().includes(q))));
        $('index-list').innerHTML = items.length ? items.map((it) => `
          <div class="py-4" style="border-color: var(--border-stone);">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-1">
              <span class="font-serif-editorial text-base font-medium">${esc(it.heading)}</span>
              <span class="font-mono-code text-[11px] px-2 py-0.5 rounded shrink-0" style="background-color: var(--accent-slate-soft); color: var(--accent-slate);">${esc(it.badge)}</span>
            </div>
            <div class="font-mono-code text-[11px] mb-1.5" style="color: var(--ink-muted);">${esc(it.meta)}</div>
            <p class="text-sm leading-relaxed" style="color: var(--ink-secondary); white-space: pre-line;">${esc(it.body)}</p>
            ${it.extra ? `<p class="text-xs mt-1.5" style="color: var(--accent-sage);">${esc(it.extra)}</p>` : ''}
          </div>`).join('') : '<div class="py-12 text-center text-sm" style="color: var(--ink-secondary);">No matching sections or precedents found.</div>';
      }
      function openIndex() { $('index-modal').classList.remove('hidden'); renderIndex(); $('index-search').focus(); }
      function closeIndex() { $('index-modal').classList.add('hidden'); }
      $('btn-open-index').addEventListener('click', openIndex);
      $('btn-close-index').addEventListener('click', closeIndex);
      $('index-modal').addEventListener('click', (e) => { if (e.target === $('index-modal')) closeIndex(); });
      $('index-search').addEventListener('input', renderIndex);
      $('index-tabs').addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-itab]');
        if (!btn) return;
        activeTab = btn.dataset.itab;
        document.querySelectorAll('#index-tabs button').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        renderIndex();
      });


      /* =======================================================================
         STORY CHAIN VIEW
         ======================================================================= */
      const story = { act: 'soga', hideNums: false, hideHooks: false, hideBridges: false, hideGists: false, revealed: new Set() };

      function renderStory() {
        const A = ACTS[story.act];
        const S = CHAPTER_STORY[story.act];
        const anchorNums = new Set(S.anchors.map((a) => a[0]));
        const links = CHAIN[story.act];
        const mask = (on, key) => (on && !story.revealed.has(key) ? 'masked' : '');

        const technique = `
          <div class="study-card rounded-xl p-5 sm:p-6 mb-5">
            <div class="detail-label mb-2">How to learn the sections</div>
            <ol class="list-decimal pl-5 space-y-1.5 text-[15px] leading-relaxed">
              <li><b>Big picture first.</b> Say the one-line plot of the Act until it's automatic.</li>
              <li><b>Chapter ranges.</b> Learn the chapter boundaries as fence-posts (here: ${S.chapters.map((c) => c[1].split('–').pop()).join(' · ')}).</li>
              <li><b>Anchor sections</b> (in red) are the landmarks. Fix their numbers first; everything else sits between two anchors.</li>
              <li><b>Walk the chain.</b> Each section answers the question the previous one leaves open: “4 says sale; how is it made? → 5.” Read the links aloud as one story.</li>
              <li><b>Read the gist.</b> Under every link is the full gist of the section: every sub-section, clause, proviso and explanation. Say the gist aloud, then hide it and recall each limb.</li>
              <li><b>Test yourself.</b> Hide numbers, hooks, links or gists, then tap a blurred item to check. Then drill the “Story chain” flashcards (next / previous / chapter map).</li>
              <li><b>Spaced recall.</b> Walk one chapter from memory each day; mark misses in flashcards for review.</li>
            </ol>
          </div>`;

        const plot = `
          <div class="study-card rounded-xl p-5 sm:p-6 mb-5">
            <div class="detail-label mb-2">The plot of the ${esc(A.full)}</div>
            <p class="font-serif-editorial text-[18px] sm:text-[20px] leading-snug mb-4">${esc(S.big)}</p>
            <div class="detail-label mb-1">Chapter map</div>
            ${S.chapters.map(([ch, range, st]) => `
              <div class="detail-item py-2.5 grid grid-cols-[84px_1fr] gap-3">
                <span class="font-mono-code text-[13px] ${mask(story.hideNums, 'r' + ch)}" data-reveal="r${esc(ch)}" style="color: var(--accent-sage);">§ ${esc(range)}</span>
                <span class="text-[15px]"><b>${esc(ch)}</b><br><span style="color: var(--ink-secondary);">${esc(st)}</span></span>
              </div>`).join('')}
            <div class="detail-label mt-4 mb-1">Anchor sections</div>
            <div class="flex flex-wrap gap-1.5 mt-1">
              ${S.anchors.map(([n, why]) => `<span class="text-[13px] px-2 py-1 rounded border" style="border-color: var(--accent-terracotta); color: var(--accent-terracotta);">
                <span class="font-mono-code ${mask(story.hideNums, 'a' + n)}" data-reveal="a${esc(n)}">s. ${esc(n)}</span> · ${esc(why)}</span>`).join('')}
            </div>
          </div>`;

        let chainHtml = '';
        S.chapters.forEach(([ch, range]) => {
          const members = links.filter((l) => A.byNum.get(l[0]).ch === ch);
          chainHtml += `
            <div class="study-card rounded-xl p-5 sm:p-6 mb-4">
              <div class="flex items-baseline justify-between gap-2 mb-3">
                <h3 class="font-serif-editorial text-lg font-medium">${esc(ch)}</h3>
                <span class="font-mono-code text-[11px]" style="color: var(--ink-muted);">§ ${esc(range)}</span>
              </div>
              <div class="relative">
                <div class="chain-line"></div>
                ${members.map((l) => `
                  <div class="chain-row pb-4">
                    <div><div class="chain-num ${anchorNums.has(l[0]) ? 'anchor' : ''} ${mask(story.hideNums, 'n' + l[0])}" data-reveal="n${esc(l[0])}">${esc(l[0])}</div></div>
                    <div class="pt-0.5">
                      <div class="font-medium text-[15px] sm:text-base ${mask(story.hideHooks, 'h' + l[0])}" data-reveal="h${esc(l[0])}">${esc(l[1])}</div>
                      <div class="text-[14px] sm:text-[15px] leading-relaxed mt-0.5 ${mask(story.hideBridges, 'b' + l[0])}" data-reveal="b${esc(l[0])}" style="color: var(--ink-secondary);">${esc(l[2])}</div>
                      <div class="gist-block mt-2 rounded-md px-3 py-2.5 text-[14px] sm:text-[15px] leading-relaxed ${mask(story.hideGists, 'g' + l[0])}" data-reveal="g${esc(l[0])}">
                        <div class="detail-label mb-1">Gist${story.hideNums ? '' : ` · Section ${esc(l[0])}`} — ${esc(A.byNum.get(l[0]).title)}</div>${esc(gistOf(A, A.byNum.get(l[0])))}</div>
                    </div>
                  </div>`).join('')}
              </div>
            </div>`;
        });
        $('story-body').innerHTML = technique + plot + chainHtml;
        $('tg-nums').classList.toggle('active', story.hideNums);
        $('tg-hooks').classList.toggle('active', story.hideHooks);
        $('tg-bridges').classList.toggle('active', story.hideBridges);
        $('tg-gists').classList.toggle('active', story.hideGists);
      }

      $('story-body').addEventListener('click', (e) => {
        const el = e.target.closest('[data-reveal]');
        if (!el || !el.classList.contains('masked')) return;
        story.revealed.add(el.dataset.reveal);
        el.classList.remove('masked');
      });
      $('story-act').addEventListener('click', (e) => {
        const b = e.target.closest('button[data-sact]'); if (!b) return;
        story.act = b.dataset.sact; story.revealed.clear();
        document.querySelectorAll('#story-act button').forEach((x) => x.classList.toggle('active', x === b));
        renderStory();
      });
      [['tg-nums', 'hideNums'], ['tg-hooks', 'hideHooks'], ['tg-bridges', 'hideBridges'], ['tg-gists', 'hideGists']].forEach(([id, key]) => {
        $(id).addEventListener('click', () => { story[key] = !story[key]; story.revealed.clear(); renderStory(); });
      });

      let mode = 'cards';
      $('mode-filters').addEventListener('click', (e) => {
        const b = e.target.closest('button[data-mode]'); if (!b) return;
        mode = b.dataset.mode;
        document.querySelectorAll('#mode-filters button').forEach((x) => x.classList.toggle('active', x === b));
        $('story-view').classList.toggle('hidden', mode !== 'story');
        $('cards-view').classList.toggle('hidden', mode !== 'cards');
        if (mode === 'story') renderStory();
      });

      /* =======================================================================
         12. INIT
         ======================================================================= */
      $('hdr-total').textContent = BANK.length;
      window.__CARDS__ = { BANK, ACTS, CHAIN, CHAPTER_STORY, GIST };   // for self-checks
      loadProgress();
      buildQueue();
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () { /* offline mode unavailable */ });
      });
    }
  </script>
</body>
</html>
