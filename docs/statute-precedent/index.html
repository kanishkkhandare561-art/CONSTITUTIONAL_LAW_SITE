  <style>
    :root {
      --bg-page: #F5F2EB; --bg-card: #FCFBF7; --bg-card-subtle: #F2EEE5;
      --bg-pill-active: #26231F; --text-pill-active: #FCFBF7;
      --border-stone: #E2DCD0; --border-strong: #CEC6B6;
      --ink-primary: #26231F; --ink-secondary: #6E685F; --ink-muted: #8E877C;
      --accent-sage: #4B6354; --accent-sage-soft: rgba(75, 99, 84, 0.10);
      --accent-terracotta: #A65C47; --accent-terracotta-soft: rgba(166, 92, 71, 0.10);
      --accent-slate: #5A665E; --accent-slate-soft: rgba(90, 102, 94, 0.09);
      --card-shadow: 0 1px 2px rgba(38, 35, 31, 0.04), 0 6px 20px rgba(38, 35, 31, 0.035);
    }
    html.evening-mode {
      --bg-page: #1E1D1A; --bg-card: #282622; --bg-card-subtle: #22201C;
      --bg-pill-active: #E7E2D8; --text-pill-active: #1E1D1A;
      --border-stone: #39362F; --border-strong: #4C483F;
      --ink-primary: #E7E2D8; --ink-secondary: #A9A295; --ink-muted: #7F796E;
      --accent-sage: #8AA392; --accent-sage-soft: rgba(138, 163, 146, 0.14);
      --accent-terracotta: #CC806B; --accent-terracotta-soft: rgba(204, 128, 107, 0.14);
      --accent-slate: #97A69C; --accent-slate-soft: rgba(151, 166, 156, 0.12);
      --card-shadow: 0 2px 6px rgba(0, 0, 0, 0.22), 0 10px 26px rgba(0, 0, 0, 0.16);
    }
    .font-serif-editorial { font-family: 'Newsreader', Georgia, 'Times New Roman', serif; }
    .font-mono-code { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace; }
    body {
      background-color: var(--bg-page); color: var(--ink-primary);
      font-family: 'Source Sans 3', -apple-system, BlinkMacSystemFont, sans-serif;
      transition: background-color 240ms ease, color 240ms ease;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    }
    .study-card { background-color: var(--bg-card); border: 1px solid var(--border-stone); box-shadow: var(--card-shadow); }
    @keyframes gentleReveal { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .animate-reveal { animation: gentleReveal 220ms cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .filter-pill { border: 1px solid var(--border-stone); color: var(--ink-secondary); background-color: transparent; transition: all 150ms ease; }
    .filter-pill:hover { border-color: var(--border-strong); color: var(--ink-primary); background-color: var(--bg-card-subtle); }
    .filter-pill.active { background-color: var(--bg-pill-active); color: var(--text-pill-active); border-color: var(--bg-pill-active); }
    .quote-block { border-left: 3px solid var(--border-strong); background-color: var(--bg-card-subtle); white-space: pre-line; }
    .answer-block { border-left: 3px solid var(--accent-sage); background-color: var(--accent-sage-soft); white-space: pre-line; }
    .detail-label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); }
    .detail-item { border-top: 1px solid var(--border-stone); }
    .quiet-scroll::-webkit-scrollbar { width: 6px; }
    .quiet-scroll::-webkit-scrollbar-thumb { background-color: var(--border-strong); border-radius: 3px; }
    .chain-row { display: grid; grid-template-columns: 64px 1fr; gap: 14px; position: relative; }
    .chain-num { font-family: 'IBM Plex Mono', monospace; font-size: 13px; text-align: center; border: 1px solid var(--border-strong);
      border-radius: 8px; padding: 6px 0; background: var(--bg-card); cursor: pointer; user-select: none; position: relative; z-index: 1; }
    .chain-num.anchor { border-color: var(--accent-terracotta); color: var(--accent-terracotta); font-weight: 500; }
    .chain-line { position: absolute; left: 31px; top: 0; bottom: 0; width: 1px; background: var(--border-stone); }
    .masked { filter: blur(5px); }
    .gist-block { background-color: var(--bg-card-subtle); border: 1px solid var(--border-stone); white-space: pre-line; color: var(--ink-primary); }
    .masked:hover { filter: blur(3px); }
    .hidden { display: none !important; }
    .relative { position: relative; }   /* fallback if the Tailwind CDN is unavailable */
    .no-select-tap { -webkit-tap-highlight-color: transparent; }
  </style>
</head>

<body class="min-h-screen flex flex-col">
  <header class="w-full border-b" style="border-color: var(--border-stone);">
    <div class="max-w-[760px] mx-auto px-4 sm:px-6 py-4 flex items-center justify-between gap-4">
      <div class="min-w-0">
        <h1 class="font-serif-editorial text-xl sm:text-2xl font-medium tracking-tight truncate">Statute &amp; Precedent</h1>
        <p class="text-xs sm:text-sm truncate" style="color: var(--ink-secondary);">
          IPA 1932 &middot; SOGA 1930 &middot; <span id="hdr-total">0</span> recall cards
        </p>
      </div>
      <div class="flex items-center gap-3 sm:gap-4 shrink-0 text-sm">
        <button id="btn-open-index" type="button" class="py-1.5 px-2 rounded-md hover:underline underline-offset-4" style="color: var(--ink-secondary);">Reference index</button>
        <button id="btn-theme-toggle" type="button" class="py-1.5 px-2.5 rounded-md border text-xs sm:text-sm" style="border-color: var(--border-stone); background-color: var(--bg-card);">Evening mode</button>
      </div>
    </div>
  </header>

  <main class="flex-1 w-full max-w-[760px] mx-auto px-4 sm:px-6 py-6 sm:py-8 flex flex-col">
    <section aria-label="Mode" class="mb-5 flex flex-wrap items-center gap-1.5" id="mode-filters">
      <span class="text-[11px] font-mono-code uppercase tracking-wider mr-1" style="color: var(--ink-muted);">Mode</span>
      <button type="button" data-mode="cards" class="filter-pill active px-3 py-1.5 rounded-full text-xs sm:text-sm font-medium">Flashcards</button>
      <button type="button" data-mode="story" class="filter-pill px-3 py-1.5 rounded-full text-xs sm:text-sm font-medium">Story chain (learn the sequence)</button>
    </section>

    <section id="story-view" class="hidden">
      <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
        <div class="flex flex-wrap items-center gap-1.5" id="story-act">
          <button type="button" data-sact="soga" class="filter-pill active px-3 py-1.5 rounded-full text-xs sm:text-sm font-medium">Sale of Goods Act</button>
          <button type="button" data-sact="ipa" class="filter-pill px-3 py-1.5 rounded-full text-xs sm:text-sm font-medium">Partnership Act</button>
        </div>
        <div class="flex flex-wrap items-center gap-1.5">
          <button type="button" id="tg-nums" class="filter-pill px-2.5 py-1 rounded-full text-xs font-medium">Hide numbers</button>
          <button type="button" id="tg-hooks" class="filter-pill px-2.5 py-1 rounded-full text-xs font-medium">Hide hooks</button>
          <button type="button" id="tg-bridges" class="filter-pill px-2.5 py-1 rounded-full text-xs font-medium">Hide links</button>
          <button type="button" id="tg-gists" class="filter-pill px-2.5 py-1 rounded-full text-xs font-medium">Hide gists</button>
        </div>
      </div>
      <div id="story-body"></div>
    </section>

    <div id="cards-view" class="flex-1 flex flex-col">
    <section aria-label="Card filters" class="mb-5 space-y-2.5">
      <div class="flex flex-wrap items-center gap-1.5" id="act-filters">
        <span class="text-[11px] font-mono-code uppercase tracking-wider mr-1" style="color: var(--ink-muted);">Act</span>

  <script>
    (function () {
      'use strict';

      /* =======================================================================
         1. INDIAN PARTNERSHIP ACT, 1932 — ALL 74 SECTIONS (1 TO 74)
         ======================================================================= */
      const IPA_SECTIONS = [
        { num: "1", ch: "Ch. I — Preliminary", title: "Short title, extent and commencement", rule: "Came into force on 1 October 1932 (except Section 69, which commenced on 1 October 1933); extends to the whole of India." },
        { num: "2", ch: "Ch. I — Preliminary", title: "Definitions", rule: "Defines 'act of a firm' (cl. a), 'business' including every trade, occupation and profession (cl. b), 'prescribed' (cl. c), 'third party' (cl. d), and incorporates Indian Contract Act definitions (cl. e)." },
        { num: "3", ch: "Ch. I — Preliminary", title: "Application of provisions of Act 9 of 1872", rule: "The unrepealed provisions of the Indian Contract Act, 1872 continue to apply to firms so far as they are not inconsistent with the express provisions of the Indian Partnership Act." },
        { num: "4", ch: "Ch. II — Nature of Partnership", title: "Definition of 'partnership', 'partner', 'firm' and 'firm name'", rule: "Partnership is the relation between persons who have agreed to share the profits of a business carried on by all or any of them acting for all. Persons are individually 'partners', collectively a 'firm', and the name is the 'firm name'." },
        { num: "5", ch: "Ch. II — Nature of Partnership", title: "Partnership not created by status", rule: "The relation of partnership arises from contract and not from status. In particular, members of a Hindu Undivided Family carrying on a family business, or a Burmese Buddhist husband and wife, are not partners." },
        { num: "6", ch: "Ch. II — Nature of Partnership", title: "Mode of determining existence of partnership", rule: "Regard shall be had to the real relation between the parties as shown by all relevant facts taken together. Sharing of profits or gross returns does not by itself make a person a partner (Expl. 1 & 2: lender, servant/agent, widow/child of deceased partner, seller of goodwill)." },
        { num: "7", ch: "Ch. II — Nature of Partnership", title: "Partnership at will", rule: "Where no provision is made by contract between the partners for the duration of their partnership, or for the determination of their partnership, the partnership is a 'partnership at will'." },
        { num: "8", ch: "Ch. II — Nature of Partnership", title: "Particular partnership", rule: "A person may become a partner with another person in particular adventures or undertakings." },
        { num: "9", ch: "Ch. III — Relations Inter Se", title: "General duties of partners", rule: "Partners are bound to carry on the business of the firm to the greatest common advantage, to be just and faithful to each other, and to render true accounts and full information of all things affecting the firm." },
        { num: "10", ch: "Ch. III — Relations Inter Se", title: "Duty to indemnify for loss caused by fraud", rule: "Every partner shall indemnify the firm for any loss caused to it by his fraud in the conduct of the business of the firm." },
        { num: "11", ch: "Ch. III — Relations Inter Se", title: "Determination of rights and duties of partners by contract", rule: "Mutual rights and duties may be determined by express or implied contract and varied by consent of all partners. Sub-section (2) validates agreements restraining a partner from carrying on any other business while he is a partner, notwithstanding Section 27 of the Contract Act." },
        { num: "12", ch: "Ch. III — Relations Inter Se", title: "The conduct of the business", rule: "Subject to contract: every partner has a right to take part in the business, is bound to attend diligently, ordinary differences are decided by majority (no change in nature of business without consent of all), and every partner has a right to access, inspect, and copy firm books." },
        { num: "13", ch: "Ch. III — Relations Inter Se", title: "Mutual rights and liabilities", rule: "Subject to contract: (a) no remuneration; (b) equal share in profits and losses; (c) interest on capital payable only out of profits; (d) 6% p.a. interest on advances beyond capital; (e) firm indemnifies partner for ordinary/emergency payments; (f) partner indemnifies firm for wilful neglect." },
        { num: "14", ch: "Ch. III — Relations Inter Se", title: "The property of the firm", rule: "Subject to contract, firm property includes all property, rights, and interests originally brought into firm stock, acquired by purchase or otherwise for the firm, and the goodwill of the business. Property acquired with firm money is presumed to belong to the firm." },
        { num: "15", ch: "Ch. III — Relations Inter Se", title: "Application of the property of the firm", rule: "Subject to contract between the partners, the property of the firm shall be held and used by the partners exclusively for the purposes of the business." },
        { num: "16", ch: "Ch. III — Relations Inter Se", title: "Personal profits earned by partners", rule: "Subject to contract: (a) a partner must account for and pay to the firm any private profit derived from a firm transaction, property, business connection, or firm name; (b) must account for profits from any competing business of the same nature." },
        { num: "17", ch: "Ch. III — Relations Inter Se", title: "Rights and duties of partners after a change in the firm", rule: "Subject to contract, mutual rights and duties remain the same as far as possible after a change in the firm's constitution, after the expiry of a fixed term if continued, or when carrying out additional adventures/undertakings." },
        { num: "18", ch: "Ch. IV — Relations to Third Parties", title: "Partner to be agent of the firm", rule: "Subject to the provisions of this Act, a partner is the agent of the firm for the purposes of the business of the firm." },
        { num: "19", ch: "Ch. IV — Relations to Third Parties", title: "Implied authority of partner as agent of the firm", rule: "An act done to carry on in the usual way business of the kind carried on by the firm binds the firm. Sub-section (2) excludes 8 acts from implied authority: submitting disputes to arbitration, opening a bank account in own name, compromising/relinquishing a claim, withdrawing a suit, admitting liability in a suit, acquiring immovable property, transferring immovable property, and entering into a partnership on the firm's behalf." },
        { num: "20", ch: "Ch. IV — Relations to Third Parties", title: "Extension and restriction of partner's implied authority", rule: "Partners may by contract extend or restrict a partner's implied authority; notwithstanding any restriction, any act within implied authority binds the firm unless the third party knows of the restriction or does not know/believe him to be a partner." },
        { num: "21", ch: "Ch. IV — Relations to Third Parties", title: "Partner's authority in an emergency", rule: "A partner has authority, in an emergency, to do all such acts for the purpose of protecting the firm from loss as would be done by a person of ordinary prudence, in his own case, acting under similar circumstances." },
        { num: "22", ch: "Ch. IV — Relations to Third Parties", title: "Mode of doing act to bind firm", rule: "In order to bind a firm, an act or instrument done or executed by a partner or other person on behalf of the firm shall be done or executed in the firm name, or in any other manner expressing or implying an intention to bind the firm." },
        { num: "23", ch: "Ch. IV — Relations to Third Parties", title: "Effect of admissions by a partner", rule: "An admission or representation made by a partner concerning the affairs of the firm is evidence against the firm, if it is made in the ordinary course of business." },
        { num: "24", ch: "Ch. IV — Relations to Third Parties", title: "Effect of notice to acting partner", rule: "Notice to a partner who habitually acts in the business of the firm of any matter relating to the affairs of the firm operates as notice to the firm, except in the case of a fraud on the firm committed by or with the consent of that partner." },
        { num: "25", ch: "Ch. IV — Relations to Third Parties", title: "Liability of a partner for acts of the firm", rule: "Every partner is liable, jointly with all the other partners and also severally, for all acts of the firm done while he is a partner." },
        { num: "26", ch: "Ch. IV — Relations to Third Parties", title: "Liability of the firm for wrongful acts of a partner", rule: "Where by the wrongful act or omission of a partner acting in the ordinary course of business, or with the authority of his partners, loss or injury is caused to any third party or any penalty is incurred, the firm is liable to the same extent as the partner." },
        { num: "27", ch: "Ch. IV — Relations to Third Parties", title: "Liability of firm for misapplication by partners", rule: "The firm is liable to make good the loss where: (a) a partner acting within apparent authority receives money or property from a third party and misapplies it, or (b) the firm in the course of business receives money or property and any partner misapplies it while in firm custody." },
        { num: "28", ch: "Ch. IV — Relations to Third Parties", title: "Holding out", rule: "Anyone who by words or conduct represents himself, or knowingly permits himself to be represented, as a partner is liable as a partner to anyone who gives credit to the firm on the faith of that representation. Sub-section (2) exempts a deceased partner's estate from liability for continued use of the firm name." },
        { num: "29", ch: "Ch. IV — Relations to Third Parties", title: "Rights of transferee of a partner's interest", rule: "A transferee of a partner's interest cannot interfere in management, require accounts, or inspect firm books during the firm's continuance; he is entitled only to receive the transferring partner's share of profits, and on dissolution, the share of assets and accounts from the date of dissolution." },
        { num: "30", ch: "Ch. IV — Relations to Third Parties", title: "Minors admitted to the benefits of partnership", rule: "A minor cannot be a partner, but with the consent of all partners may be admitted to the benefits of partnership. His share is liable but he has no personal liability. Within 6 months of attaining majority (or knowing of admission), he must give public notice electing to become or not become a partner; failure to do so makes him a partner." },
        { num: "31", ch: "Ch. V — Incoming & Outgoing Partners", title: "Introduction of a partner", rule: "Subject to contract and Section 30, no person shall be introduced as a partner without the consent of all existing partners. Under sub-section (2), an incoming partner does not thereby become liable for any act of the firm done before he became a partner." },
        { num: "32", ch: "Ch. V — Incoming & Outgoing Partners", title: "Retirement of a partner", rule: "A partner may retire with consent of all partners, under an express agreement, or (in a partnership at will) by written notice to all partners. He remains liable for prior acts unless discharged by tripartite agreement, and for subsequent acts until public notice is given (except a dormant partner unknown to the third party)." },
        { num: "33", ch: "Ch. V — Incoming & Outgoing Partners", title: "Expulsion of a partner", rule: "A partner may not be expelled from a firm by any majority of the partners, save in the exercise in good faith of powers conferred by contract between the partners." },
        { num: "34", ch: "Ch. V — Incoming & Outgoing Partners", title: "Insolvency of a partner", rule: "Where a partner is adjudicated an insolvent, he ceases to be a partner on the date the adjudication order is made. His estate is not liable for subsequent acts of the firm, nor is the firm liable for subsequent acts of the insolvent." },
        { num: "35", ch: "Ch. V — Incoming & Outgoing Partners", title: "Liability of estate of deceased partner", rule: "Where under a contract between the partners the firm is not dissolved by the death of a partner, the estate of a deceased partner is not liable for any act of the firm done after his death." },
        { num: "36", ch: "Ch. V — Incoming & Outgoing Partners", title: "Rights of outgoing partner to carry on competing business", rule: "An outgoing partner may carry on a competing business and advertise it, but (subject to contract) may not use the firm name, represent himself as carrying on the firm's business, or solicit old customers. Sub-section (2) validates reasonable non-compete covenants notwithstanding Section 27 of the Contract Act." },
        { num: "37", ch: "Ch. V — Incoming & Outgoing Partners", title: "Right of outgoing partner in certain cases to share subsequent profits", rule: "Where a partner dies or ceases to be a partner and the surviving/continuing partners carry on business with firm property without a final settlement of accounts, the outgoing partner or his estate may opt for the attributable share of profits OR interest at 6% per annum on his share of firm property." },
        { num: "38", ch: "Ch. V — Incoming & Outgoing Partners", title: "Revocation of continuing guarantee by change in firm", rule: "A continuing guarantee given to a firm, or to a third party in respect of the transactions of a firm, is, in the absence of agreement to the contrary, revoked as to future transactions from the date of any change in the constitution of the firm." },
        { num: "39", ch: "Ch. VI — Dissolution of a Firm", title: "Dissolution of a firm", rule: "The dissolution of partnership between all the partners of a firm is called the 'dissolution of the firm'." },
        { num: "40", ch: "Ch. VI — Dissolution of a Firm", title: "Dissolution by agreement", rule: "A firm may be dissolved with the consent of all the partners or in accordance with a contract between the partners." },
        { num: "41", ch: "Ch. VI — Dissolution of a Firm", title: "Compulsory dissolution", rule: "A firm is compulsorily dissolved (a) by the adjudication of all the partners or of all the partners but one as insolvent, or (b) by the happening of any event which makes it unlawful for the business of the firm to be carried on in partnership." },
        { num: "42", ch: "Ch. VI — Dissolution of a Firm", title: "Dissolution on the happening of certain contingencies", rule: "Subject to contract between the partners, a firm is dissolved: (a) on expiry of a fixed term; (b) on completion of one or more adventures or undertakings; (c) by the death of a partner; or (d) by the adjudication of a partner as an insolvent." },
        { num: "43", ch: "Ch. VI — Dissolution of a Firm", title: "Dissolution by notice of partnership at will", rule: "Where the partnership is at will, the firm may be dissolved by any partner giving notice in writing to all the other partners of his intention to dissolve the firm; it dissolves from the date mentioned in the notice, or if none, from the date of communication." },
        { num: "44", ch: "Ch. VI — Dissolution of a Firm", title: "Dissolution by the Court", rule: "At the suit of a partner, the Court may dissolve a firm on 7 grounds: (a) unsound mind, (b) permanent incapacity, (c) misconduct prejudicial to business, (d) wilful or persistent breach of agreement, (e) transfer of whole interest to a third party, (f) business can only be carried on at a loss, or (g) any other just and equitable ground." },
        { num: "45", ch: "Ch. VI — Dissolution of a Firm", title: "Liability for acts of partners done after dissolution", rule: "Partners continue to be liable as such to third parties for any act done by any of them after dissolution until public notice is given of the dissolution (proviso: estate of a deceased, insolvent, or dormant partner is not liable)." },
        { num: "46", ch: "Ch. VI — Dissolution of a Firm", title: "Right of partners to have business wound up after dissolution", rule: "On the dissolution of a firm, every partner or his representative is entitled, as against all other partners, to have the property of the firm applied in payment of the debts and liabilities of the firm, and to have the surplus distributed among the partners." },
        { num: "47", ch: "Ch. VI — Dissolution of a Firm", title: "Continuing authority of partners for purposes of winding up", rule: "After dissolution, the authority of each partner to bind the firm and their mutual rights and obligations continue so far as necessary to wind up the affairs and complete unfinished transactions (except the firm is not bound by acts of an insolvent partner)." },
        { num: "48", ch: "Ch. VI — Dissolution of a Firm", title: "Mode of settlement of accounts between partners", rule: "Losses (including capital deficiencies) are paid first out of undivided profits, next out of capital, and lastly by partners individually in profit-sharing proportions. Assets are applied: (1) outside creditors, (2) partner advances/loans rateably, (3) partner capital rateably, and (4) residue in profit-sharing ratio." },
        { num: "49", ch: "Ch. VI — Dissolution of a Firm", title: "Payment of firm debts and of separate debts", rule: "Where there are joint debts due from the firm and separate debts due from any partner, firm property pays firm debts first (surplus to separate debts), and a partner's separate property pays his separate debts first (surplus to firm debts)." },
        { num: "50", ch: "Ch. VI — Dissolution of a Firm", title: "Personal profits earned after dissolution", rule: "Extends the Section 16(a) duty to account for personal profits past dissolution until winding up is complete (including after a partner's death), subject to contract and the right of a goodwill buyer to use the firm name." },
        { num: "51", ch: "Ch. VI — Dissolution of a Firm", title: "Return of premium on premature dissolution", rule: "A partner who paid a premium to join a firm for a fixed term is entitled to a reasonable refund if the firm is dissolved early, except where dissolution is caused by death, is mainly due to his own misconduct, or is under an agreement containing no provision for return of premium." },
        { num: "52", ch: "Ch. VI — Dissolution of a Firm", title: "Rights where partnership contract is rescinded for fraud or misrepresentation", rule: "A partner rescinding the partnership contract for fraud or misrepresentation gets three protections: (a) a lien on surplus firm assets for purchase money and capital, (b) creditor status for firm debts he paid, and (c) indemnity from the guilty partner(s)." },
        { num: "53", ch: "Ch. VI — Dissolution of a Firm", title: "Right to restrain from use of firm name or firm property", rule: "After dissolution and until winding up is complete, any partner or his representative may restrain any other partner from carrying on a similar business in the firm name or from using firm property for his own benefit (subject to contract and goodwill buyer's rights)." },
        { num: "54", ch: "Ch. VI — Dissolution of a Firm", title: "Agreements in restraint of trade (on dissolution)", rule: "Partners may, upon or in anticipation of the dissolution of the firm, make an agreement that some or all of them will not carry on a business similar to that of the firm within a specified period or local limits; valid if reasonable despite Section 27 of the Contract Act." },
        { num: "55", ch: "Ch. VI — Dissolution of a Firm", title: "Sale of goodwill after dissolution", rule: "Goodwill is included in firm assets on settlement. After sale of goodwill, a partner may carry on a competing business and advertise it, but may not use the firm name, represent himself as carrying on the firm's business, or solicit old customers; reasonable non-compete covenants with the buyer are valid." },
        { num: "56", ch: "Ch. VII — Registration of Firms", title: "Power to exempt from application of Chapter VII", rule: "The State Government of any State may, by notification in the Official Gazette, direct that the provisions of the registration Chapter (Chapter VII) shall not apply to that State or to any part thereof." },
        { num: "57", ch: "Ch. VII — Registration of Firms", title: "Appointment of Registrars", rule: "The State Government may appoint Registrars of Firms and define the areas within which they exercise powers. Every Registrar is deemed to be a public servant within the meaning of Section 21 of the IPC (BNS 2023)." },
        { num: "58", ch: "Ch. VII — Registration of Firms", title: "Application for registration", rule: "Registration is applied for by sending a prescribed statement with fee giving 6 particulars (firm name, principal place, other places, joining dates, partners' full names & permanent addresses, duration), signed and verified by all partners. Names containing Crown, Royal, Imperial, etc. are barred without State Government consent." },
        { num: "59", ch: "Ch. VII — Registration of Firms", title: "Registration", rule: "When the Registrar is satisfied that the provisions of Section 58 have been duly complied with, he shall record an entry of the statement in the Register of Firms and file the statement." },
        { num: "60", ch: "Ch. VII — Registration of Firms", title: "Recording of alterations in firm name and principal place of business", rule: "When an alteration is made in the firm name or in the location of the principal place of business of a registered firm, a signed and verified statement with fee may be sent to the Registrar to amend the entry." },
        { num: "61", ch: "Ch. VII — Registration of Firms", title: "Noting of closing and opening of branches", rule: "When a registered firm discontinues business at any place or begins to carry on business at any place (not being its principal place), any partner or agent may send intimation to the Registrar to note it in the Register." },
        { num: "62", ch: "Ch. VII — Registration of Firms", title: "Noting of changes in names and addresses of partners", rule: "When any partner in a registered firm alters his name or permanent address, an intimation of the alteration may be sent by any partner or agent to the Registrar." },
        { num: "63", ch: "Ch. VII — Registration of Firms", title: "Recording of changes in and dissolution of a firm & minor's election", rule: "Sub-section (1): Notice to the Registrar when a change occurs in the constitution of a registered firm or it is dissolved. Sub-section (2): Notice by a former minor (or agent) upon attaining majority electing to become or not become a partner." },
        { num: "64", ch: "Ch. VII — Registration of Firms", title: "Rectification of mistakes", rule: "Sub-section (1): The Registrar has power at all times to rectify any mistake to bring the Register into conformity with filed documents. Sub-section (2): Mistakes in filed documents themselves can be rectified only on application by all parties who signed that document." },
        { num: "65", ch: "Ch. VII — Registration of Firms", title: "Amendment of Register by order of Court", rule: "A Court deciding any matter relating to a registered firm may direct that the Registrar shall make any amendment in the entry in the Register of Firms relating to such firm which is consequential upon its decision." },
        { num: "66", ch: "Ch. VII — Registration of Firms", title: "Inspection of Register and filed documents", rule: "The Register of Firms shall be open to inspection by any person on payment of such fee as may be prescribed; filed statements, notices, and intimations are also open to inspection subject to prescribed conditions and fee." },
        { num: "67", ch: "Ch. VII — Registration of Firms", title: "Grant of copies", rule: "The Registrar shall on application furnish to any person, on payment of the prescribed fee, a copy, certified under his hand, of any entry or portion thereof in the Register of Firms." },
        { num: "68", ch: "Ch. VII — Registration of Firms", title: "Rules of evidence", rule: "Sub-section (1): Any statement, intimation, or notice recorded in the Register is conclusive proof of any fact therein stated against any person by whom or on whose behalf it was signed. Sub-section (2): A certified copy proves registration and contents." },
        { num: "69", ch: "Ch. VII — Registration of Firms", title: "Effect of non-registration", rule: "Bars suits by an unregistered firm or its partners to enforce rights arising from a contract or this Act (partner vs firm, firm vs third party, set-off/other proceedings). Exceptions: suits for dissolution, accounts/property of a dissolved firm, insolvency receiver, claims of Rs. 100 or less, non-contract/statutory rights, and suits by outsiders against the firm." },
        { num: "70", ch: "Ch. VII — Registration of Firms", title: "Penalty for furnishing false particulars", rule: "Signing any statement, amending statement, notice, or intimation under Chapter VII knowing it to be false or incomplete is punishable with imprisonment up to 3 months, or fine, or both (Maharashtra amendment: up to 1 year and minimum Rs. 1,000 fine)." },
        { num: "71", ch: "Ch. VII — Registration of Firms", title: "Power to make rules", rule: "The State Government may make rules prescribing filing/inspection/copying fees (within Schedule I maximums), forms of statements and notices, Register maintenance, dispute procedure, and destruction of old records (subject to previous publication and laying before the Legislature)." },
        { num: "72", ch: "Ch. VIII — Supplemental", title: "Mode of giving public notice", rule: "Public notice is given by publication in the Official Gazette and in at least one vernacular newspaper circulating in the district of the firm's principal place of business; for retirement, expulsion, dissolution, or a minor's election in a registered firm, notice to the Registrar under Section 63 is also required." },
        { num: "73", ch: "Ch. VIII — Supplemental", title: "Repeals", rule: "Omitted section — originally listed the older statutory enactments repealed when the Indian Partnership Act, 1932 was enacted." },
        { num: "74", ch: "Ch. VIII — Supplemental", title: "Savings", rule: "Neither the Act nor any repeal made by it affects rights, titles, obligations, or liabilities acquired before commencement, pending legal proceedings, unrepealed partnership laws, insolvency rules relating to partnerships, or any consistent rule of law." }
      ];

      /* =======================================================================
         2. SALE OF GOODS ACT, 1930 — ALL 67 SECTIONS (1 TO 66, INCLUDING 64-A)
         ======================================================================= */
      const SOGA_SECTIONS = [
        { num: "1", ch: "Ch. I — Preliminary", title: "Short title, extent and commencement", rule: "Called the Sale of Goods Act, 1930; applies across India and came into force on 1 July 1930." },
        { num: "2", ch: "Ch. I — Preliminary", title: "Definitions", rule: "Defines key terms including buyer, seller, delivery, deliverable state, document of title (cl. 4), future goods (cl. 6), goods (cl. 7: every movable property except actionable claims and money), insolvent, mercantile agent, price, property, quality, specific goods (cl. 14), and fault." },
        { num: "3", ch: "Ch. I — Preliminary", title: "Application of provisions of Act 9 of 1872", rule: "The unrepealed provisions of the Indian Contract Act, 1872 continue to apply to contracts for the sale of goods so far as they are not inconsistent with the express provisions of the Sale of Goods Act." },
        { num: "4", ch: "Ch. II — Formation of Contract", title: "Sale and agreement to sell", rule: "A contract of sale transfers or agrees to transfer property in goods to the buyer for a price. Immediate transfer of ownership is a 'sale' (executed); transfer at a future time or subject to a condition is an 'agreement to sell' (executory)." },
        { num: "5", ch: "Ch. II — Formation of Contract", title: "Contract of sale how made", rule: "Made by an offer to buy or sell goods for a price and its acceptance; may provide for immediate or postponed delivery/payment or instalments; requires no special form (written, oral, partly both, or implied from conduct)." },
        { num: "6", ch: "Ch. II — Formation of Contract", title: "Existing or future goods", rule: "The goods forming the subject of a contract of sale may be existing goods, future goods, or contingent goods. Where a seller purports to effect a present sale of future goods, the contract operates as an agreement to sell." },
        { num: "7", ch: "Ch. II — Formation of Contract", title: "Goods perishing before making of contract", rule: "Where there is a contract for the sale of specific goods, the contract is void if the goods, without the knowledge of the seller, have already perished or become so damaged as no longer to answer to their description at the time the contract was made." },
        { num: "8", ch: "Ch. II — Formation of Contract", title: "Goods perishing before sale but after agreement to sell", rule: "Where there is an agreement to sell specific goods and subsequently the goods, without any fault on the part of the seller or buyer, perish or become so damaged as no longer to answer to their description before risk passes to the buyer, the agreement is avoided." },
        { num: "9", ch: "Ch. II — Formation of Contract", title: "Ascertainment of price", rule: "The price may be fixed by the contract, left to be fixed in an agreed manner, or determined by the course of dealing between the parties. Where not so determined, the buyer must pay a reasonable price." },
        { num: "10", ch: "Ch. II — Formation of Contract", title: "Agreement to sell at valuation", rule: "Where price is to be fixed by the valuation of a third party who cannot or does not make such valuation, the agreement is avoided (buyer pays a reasonable price for goods already appropriated; if prevented by one party's fault, the other may sue for damages)." },
        { num: "11", ch: "Ch. II — Formation of Contract", title: "Stipulations as to time", rule: "Unless a different intention appears from the terms of the contract, stipulations as to time of payment are not deemed to be of the essence of a contract of sale. Whether any other stipulation as to time (e.g., delivery) is of the essence depends on the contract terms." },
        { num: "12", ch: "Ch. II — Formation of Contract", title: "Condition and warranty", rule: "A condition is a stipulation essential to the main purpose of the contract (breach gives a right to treat the contract as repudiated plus damages). A warranty is collateral (breach gives damages only). Substance, not the label used, determines classification." },
        { num: "13", ch: "Ch. II — Formation of Contract", title: "When condition to be treated as warranty", rule: "The buyer may voluntarily waive a condition or elect to treat its breach as a breach of warranty. Compulsorily treated as warranty where the contract is not severable and the buyer has accepted the goods or part thereof." },
        { num: "14", ch: "Ch. II — Formation of Contract", title: "Implied undertaking as to title, etc.", rule: "Unless circumstances show a different intention, every sale implies: (a) a condition that the seller has a right to sell; (b) a warranty that the buyer shall enjoy quiet possession; and (c) a warranty that goods are free from any undisclosed charge or encumbrance." },
        { num: "15", ch: "Ch. II — Formation of Contract", title: "Sale by description", rule: "Where there is a contract for the sale of goods by description, there is an implied condition that the goods shall correspond with the description; if the sale is by sample as well as by description, the bulk must correspond with both." },
        { num: "16", ch: "Ch. II — Formation of Contract", title: "Implied conditions as to quality or fitness (Caveat Emptor)", rule: "General rule is caveat emptor (no implied quality/fitness), subject to exceptions: (1) fitness for disclosed particular purpose relying on seller's skill (excluding patent/trade name purchases); (2) merchantable quality when bought by description from a dealer (except defects discoverable on examination); (3) trade usage; (4) express terms do not negative implied ones unless inconsistent." },
        { num: "17", ch: "Ch. II — Formation of Contract", title: "Sale by sample", rule: "In a contract for sale by sample, three conditions are implied: (1) the bulk shall correspond with the sample in quality; (2) the buyer shall have a reasonable opportunity of comparing the bulk with the sample; and (3) the goods shall be free from any latent defect rendering them unmerchantable." },
        { num: "18", ch: "Ch. III — Effects of Contract", title: "Goods must be ascertained", rule: "Where there is a contract for the sale of unascertained goods, no property in the goods is transferred to the buyer unless and until the goods are ascertained." },
        { num: "19", ch: "Ch. III — Effects of Contract", title: "Property passes when intended to pass", rule: "Where there is a contract for the sale of specific or ascertained goods, property in them is transferred to the buyer at such time as the parties intend it to be transferred, ascertained from contract terms, conduct, and circumstances (default rules in Secs. 20–24 apply if unclear)." },
        { num: "20", ch: "Ch. III — Effects of Contract", title: "Specific goods in a deliverable state", rule: "Where there is an unconditional contract for the sale of specific goods in a deliverable state, the property in the goods passes to the buyer when the contract is made, even if the time of payment or delivery (or both) is postponed." },
        { num: "21", ch: "Ch. III — Effects of Contract", title: "Specific goods to be put into a deliverable state", rule: "Where there is a contract for the sale of specific goods and the seller is bound to do something to the goods to put them into a deliverable state, property does not pass until such thing is done and the buyer has notice thereof." },
        { num: "22", ch: "Ch. III — Effects of Contract", title: "Specific goods in a deliverable state, when seller has to ascertain price", rule: "Where there is a contract for specific goods in a deliverable state, but the seller is bound to weigh, measure, test, or do some other act to ascertain the price, property does not pass until such act is done and the buyer has notice thereof." },
        { num: "23", ch: "Ch. III — Effects of Contract", title: "Sale of unascertained goods and appropriation", rule: "Property in unascertained or future goods sold by description passes when goods of that description in a deliverable state are unconditionally appropriated to the contract by one party with the other's assent. Delivery to a carrier without reserving disposal is deemed unconditional appropriation (sub-sec. 2)." },
        { num: "24", ch: "Ch. III — Effects of Contract", title: "Goods sent on approval or 'on sale or return'", rule: "When goods are delivered to the buyer on approval or 'on sale or return', property passes when the buyer signifies approval/acceptance, does any act adopting the transaction, or retains the goods beyond the fixed or a reasonable time without giving notice of rejection." },
        { num: "25", ch: "Ch. III — Effects of Contract", title: "Reservation of right of disposal", rule: "The seller may reserve the right of disposal until certain conditions are fulfilled, preventing property from passing despite delivery to buyer or carrier. Presumed where the bill of lading is to the seller's order or sent with a bill of exchange that the buyer fails to honour." },
        { num: "26", ch: "Ch. III — Effects of Contract", title: "Risk prima facie passes with property", rule: "Unless otherwise agreed, goods remain at the seller's risk until property is transferred to the buyer, after which they are at the buyer's risk whether delivery has been made or not. A party at fault for delivery delay bears resulting loss, and bailee duties remain unaffected." },
        { num: "27", ch: "Ch. III — Effects of Contract", title: "Sale by person not the owner (Nemo dat quod non habet)", rule: "Where goods are sold by a person who is not the owner and lacks authority, the buyer acquires no better title than the seller had, unless the owner is precluded by conduct (estoppel) or the sale falls under the mercantile agent proviso (possession with owner's consent, ordinary course of business, good-faith buyer without notice)." },
        { num: "28", ch: "Ch. III — Effects of Contract", title: "Sale by one of joint owners", rule: "If one of several joint owners of goods has the sole possession of them by permission of the co-owners, property in the goods is transferred to any person who buys them from him in good faith and without notice that the seller has no authority to sell." },
        { num: "29", ch: "Ch. III — Effects of Contract", title: "Sale by person in possession under voidable contract", rule: "When the seller has obtained possession of goods under a contract voidable under Section 19 or 19A of the Contract Act, but the contract has not been rescinded at the time of the sale, the buyer acquires good title if he buys in good faith and without notice of the defect." },
        { num: "30", ch: "Ch. III — Effects of Contract", title: "Seller or buyer in possession after sale", rule: "Sub-section (1): A seller continuing in possession of goods/documents after sale passes good title on resale or pledge to a good-faith recipient without notice. Sub-section (2): A person who has bought or agreed to buy and obtains possession with the seller's consent passes good title to a good-faith purchaser/pledgee." },
        { num: "31", ch: "Ch. IV — Performance of Contract", title: "Duties of seller and buyer", rule: "It is the duty of the seller to deliver the goods and of the buyer to accept and pay for them, in accordance with the terms of the contract of sale." },
        { num: "32", ch: "Ch. IV — Performance of Contract", title: "Payment and delivery are concurrent conditions", rule: "Unless otherwise agreed, delivery of the goods and payment of the price are concurrent conditions — the seller must be ready and willing to give possession in exchange for the price, and the buyer ready and willing to pay in exchange for possession." },
        { num: "33", ch: "Ch. IV — Performance of Contract", title: "Delivery", rule: "Delivery of goods sold may be made by doing anything which the parties agree shall be treated as delivery or which has the effect of putting the goods in the possession of the buyer or of any person authorised to hold them on his behalf (actual, symbolic, or constructive)." },
        { num: "34", ch: "Ch. IV — Performance of Contract", title: "Effect of part delivery", rule: "A delivery of part of goods, in progress of the delivery of the whole, has the same effect for the purpose of passing the property in such goods as a delivery of the whole; but part delivery with an intention of severing it from the whole does not operate as delivery of the remainder." },
        { num: "35", ch: "Ch. IV — Performance of Contract", title: "Buyer to apply for delivery", rule: "Apart from any express contract, the seller of goods is not bound to deliver them until the buyer applies for delivery." },
        { num: "36", ch: "Ch. IV — Performance of Contract", title: "Rules as to delivery", rule: "Covers five delivery rules: (1) place is where goods are at sale/agreement/production; (2) reasonable time if unfixed; (3) third-party attornment required for goods held by a third party; (4) demand or tender must be at a reasonable hour; (5) expenses of putting goods into deliverable state are borne by the seller." },
        { num: "37", ch: "Ch. IV — Performance of Contract", title: "Delivery of wrong quantity", rule: "Less than contracted: buyer may reject all or accept and pay at contract rate. More than contracted: accept ordered and reject rest, reject all, or accept all at contract rate. Mixed with other goods: accept ordered and reject rest, or reject all." },
        { num: "38", ch: "Ch. IV — Performance of Contract", title: "Instalment deliveries", rule: "Unless otherwise agreed, the buyer is not bound to accept delivery by instalments. Where separate instalments are paid for separately, whether a defective delivery or non-payment repudiates the whole contract or is a severable breach depends on the terms and circumstances." },
        { num: "39", ch: "Ch. IV — Performance of Contract", title: "Delivery to carrier or wharfinger", rule: "Delivery to a carrier or wharfinger for transmission is prima facie delivery to the buyer. The seller must make a reasonable contract with the carrier; for sea transit where insurance is usual, the seller must notify the buyer so he may insure, or goods stay at the seller's risk." },
        { num: "40", ch: "Ch. IV — Performance of Contract", title: "Risk where goods are delivered at distant place", rule: "Where the seller of goods agrees to deliver them at his own risk at a place other than where they are when sold, the buyer shall nevertheless, unless otherwise agreed, take any risk of deterioration in the goods necessarily incident to the course of transit." },
        { num: "41", ch: "Ch. IV — Performance of Contract", title: "Buyer's right of examining the goods", rule: "Where goods are delivered to the buyer which he has not previously examined, he is not deemed to have accepted them unless and until he has had a reasonable opportunity of examining them to ascertain conformity with the contract." },
        { num: "42", ch: "Ch. IV — Performance of Contract", title: "Acceptance", rule: "The buyer is deemed to have accepted the goods when he intimates to the seller that he has accepted them, when he does any act in relation to them inconsistent with the seller's ownership, or when after a reasonable time he retains them without intimating rejection." },
        { num: "43", ch: "Ch. IV — Performance of Contract", title: "Buyer not bound to return rejected goods", rule: "Unless otherwise agreed, where goods are delivered to the buyer and he refuses to accept them, having the right so to do, he is not bound to return them to the seller; it is sufficient if he intimates to the seller that he refuses to accept them." },
        { num: "44", ch: "Ch. IV — Performance of Contract", title: "Liability of buyer for neglecting or refusing delivery of goods", rule: "When the seller is ready and willing to deliver and requests the buyer to take delivery, and the buyer fails to do so within a reasonable time, the buyer is liable for any loss occasioned by his neglect/refusal and for a reasonable charge for the care and custody of the goods." },
        { num: "45", ch: "Ch. V — Rights of Unpaid Seller", title: "'Unpaid seller' defined", rule: "A seller is deemed an 'unpaid seller' when the whole of the price has not been paid or tendered, or when a bill of exchange or other negotiable instrument received as conditional payment has been dishonoured." },
        { num: "46", ch: "Ch. V — Rights of Unpaid Seller", title: "Unpaid seller's rights", rule: "Notwithstanding that property has passed to the buyer, an unpaid seller has: (a) a lien on the goods while in possession; (b) right of stoppage in transit if the buyer becomes insolvent; and (c) a right of resale. Where property has not passed, he has a co-extensive right of withholding delivery." },
        { num: "47", ch: "Ch. V — Rights of Unpaid Seller", title: "Seller's lien", rule: "An unpaid seller in possession may retain goods until payment where: (a) sold without stipulation as to credit, (b) sold on credit whose term has expired, or (c) buyer becomes insolvent. Applies even if he holds goods as the buyer's agent or bailee." },
        { num: "48", ch: "Ch. V — Rights of Unpaid Seller", title: "Part delivery (and lien)", rule: "Where an unpaid seller has made part delivery of the goods, he may exercise his right of lien on the remainder, unless such part delivery has been made under such circumstances as to show an agreement to waive the lien." },
        { num: "49", ch: "Ch. V — Rights of Unpaid Seller", title: "Termination of lien", rule: "The unpaid seller loses his lien when he delivers goods to a carrier without reserving right of disposal, when the buyer or his agent lawfully obtains possession, or by waiver. He does NOT lose his lien merely by obtaining a court decree for the price." },
        { num: "50", ch: "Ch. V — Rights of Unpaid Seller", title: "Right of stoppage in transit", rule: "When the buyer of goods becomes insolvent, the unpaid seller who has parted with possession of the goods has the right of stopping them in transit — resuming possession as long as they are in course of transit and retaining them until payment." },
        { num: "51", ch: "Ch. V — Rights of Unpaid Seller", title: "Duration of transit", rule: "Transit runs from delivery to a carrier until the buyer or his agent takes delivery. It ends early if the buyer intercepts delivery before destination, the carrier attorns to the buyer after arrival, or the carrier wrongfully refuses delivery; it continues if the buyer rejects the goods." },
        { num: "52", ch: "Ch. V — Rights of Unpaid Seller", title: "How stoppage in transit is effected", rule: "Effected either by taking actual possession of the goods or by giving notice of claim to the carrier (or his principal in time to stop delivery). Upon notice, the carrier must redeliver the goods to the seller at the seller's expense." },
        { num: "53", ch: "Ch. V — Rights of Unpaid Seller", title: "Effect of sub-sale or pledge by buyer", rule: "The unpaid seller's lien or stoppage in transit is not affected by any sale or disposition by the buyer unless the seller assented. However, if a document of title transferred to the buyer is transferred for value in good faith, a sub-sale defeats the seller's rights completely and a pledge subjects them to the pledgee's rights." },
        { num: "54", ch: "Ch. V — Rights of Unpaid Seller", title: "Sale not generally rescinded by lien or stoppage (Right of resale)", rule: "Lien or stoppage does not rescind the contract. The seller may resell perishable goods or any goods after notice to the buyer (recovering loss and keeping profit; without notice, he cannot claim loss and buyer gets any profit). The resale buyer gets good title even without notice (sub-sec. 3)." },
        { num: "55", ch: "Ch. VI — Suits for Breach", title: "Suit for price", rule: "The seller may sue the buyer for the price where: (1) property in the goods has passed and the buyer wrongfully neglects or refuses to pay, or (2) the price is payable on a certain day irrespective of delivery and the buyer wrongfully fails to pay." },
        { num: "56", ch: "Ch. VI — Suits for Breach", title: "Damages for non-acceptance", rule: "Where the buyer wrongfully neglects or refuses to accept and pay for the goods, the seller may sue him for damages for non-acceptance (typically the difference between contract price and market price)." },
        { num: "57", ch: "Ch. VI — Suits for Breach", title: "Damages for non-delivery", rule: "Where the seller wrongfully neglects or refuses to deliver the goods to the buyer, the buyer may sue the seller for damages for non-delivery (typically the difference between market price and contract price)." },
        { num: "58", ch: "Ch. VI — Suits for Breach", title: "Specific performance", rule: "Subject to the Specific Relief Act, in any suit for breach of contract to deliver specific or ascertained goods, the Court may, on the plaintiff's application, discretionarily direct specific performance (delivery of the actual goods) on such terms as it thinks fit." },
        { num: "59", ch: "Ch. VI — Suits for Breach", title: "Remedy for breach of warranty", rule: "Where there is a breach of warranty (or a condition treated as a warranty), the buyer is not entitled to reject the goods, but may set up the breach in diminution or extinction of the price, or sue the seller for damages (and may still sue for further damage)." },
        { num: "60", ch: "Ch. VI — Suits for Breach", title: "Repudiation of contract before due date (Anticipatory breach)", rule: "Where either party repudiates the contract before the date of delivery, the other may either treat the contract as subsisting and wait till the date of delivery, or treat the contract as rescinded and sue immediately for damages for the breach." },
        { num: "61", ch: "Ch. VI — Suits for Breach", title: "Interest by way of damages and special damages", rule: "Preserves the right of seller or buyer to recover interest or special damages where recoverable by law. In the absence of a contract to the contrary, the Court may award interest on the price from the date of tender of goods or when payment was due." },
        { num: "62", ch: "Ch. VII — Miscellaneous", title: "Exclusion of implied terms and conditions", rule: "Where any right, duty, or liability would arise under a contract of sale by implication of law, it may be negatived or varied by express agreement, by the course of dealing between the parties, or by usage binding both parties." },
        { num: "63", ch: "Ch. VII — Miscellaneous", title: "Reasonable time a question of fact", rule: "Where in this Act any reference is made to a 'reasonable time', the question of what is a reasonable time is a question of fact." },
        { num: "64", ch: "Ch. VII — Miscellaneous", title: "Auction sale", rule: "Each lot is prima facie a separate contract; sale is complete on the fall of the hammer (bids withdrawable until then); seller's right to bid must be expressly notified; sale may be subject to a reserve price; pretended bidding by seller makes the sale voidable." },
        { num: "64-A", ch: "Ch. VII — Miscellaneous", title: "Amount of increased or decreased taxes to be added or deducted", rule: "Unless a different intention appears, if after a contract of sale is made any customs or excise duty or tax on sale/purchase is imposed, increased, reduced, or remitted, the seller may add the increase to the price and the buyer may deduct the decrease." },
        { num: "65", ch: "Ch. VII — Miscellaneous", title: "Repeal", rule: "Repealed by the Repealing Act, 1938; nothing remains operative under this section." },
        { num: "66", ch: "Ch. VII — Miscellaneous", title: "Savings", rule: "Does not affect rights, titles, obligations, or proceedings acquired or commenced before the Act came into force, unrepealed enactments relating to sale of goods, consistent rules of law, or rules of insolvency relating to contracts of sale." }
      ];

      /* =======================================================================
         3. INDIAN PARTNERSHIP ACT, 1932 — ALL 42 CASES
         ======================================================================= */
      const IPA_CASES = [
        { name: "Smith v. Anderson", cite: "(1880) 15 Ch D 247 (CA)", sec: "Sec. 2(b), 4", holding: "Defines 'business' as a continuous or repeated series of commercial acts for profit; holding investments passively through a trust deed without mutual agency is not carrying on a business or partnership." },
        { name: "K.T. Abdul Badsha Saheb v. Century Wood Industries", cite: "AIR 1954 Mys 33", sec: "Sec. 4, 5, 6, 69", holding: "Co-owners who sell inherited joint property and invest proceeds in a new active business managed by both act as mutual agents, establishing an implied partnership by contract (Sec. 5); an unregistered firm cannot sue under Sec. 69(2)." },
        { name: "Cox v. Hickman", cite: "(1860) 8 HLC 268 (HL)", sec: "Sec. 4, 6", holding: "Landmark authority establishing that profit-sharing is only prima facie evidence; mutual agency (business carried on by persons acting as agents for one another) is the true, conclusive test of partnership." },
        { name: "K.D. Kamath and Co. v. CIT", cite: "(1971) 2 SCC 873", sec: "Sec. 4, 12, 18", holding: "Vesting absolute management control in a single managing partner does not destroy mutual agency if the business is carried on on behalf of all partners and they bind the firm in daily affairs." },
        { name: "Badeley v. Consolidated Bank", cite: "(1888) 38 Ch D 238 (CA)", sec: "Sec. 6", holding: "Applies the Real Relation Test: receiving a share of profits or fixed interest in exchange for a business advance does not per se convert a money-lender into a secret partner." },
        { name: "Govind Nair v. Maga", cite: "AIR 1933 Rang 120 / 1948 Mad HC", sec: "Sec. 4, 6 Expl. 1", holding: "Jointly purchasing a tea shop and equipment, leasing it out, and dividing rent equally constitutes co-ownership, not a partnership business, due to the absence of mutual agency." },
        { name: "M/s. Mohan Lal Daulat Ram v. CIT, Bombay", cite: "AIR 1991 SC 479", sec: "Sec. 4, 5", holding: "Partnership arises strictly from contract, not status; clumsy deed drafting describing a widow as 'representing the family' does not invalidate a valid partnership between two distinct, competent individuals." },
        { name: "Pratibha Rani v. Suraj Kumar", cite: "(1985) 2 SCC 370", sec: "Sec. 4, 5", holding: "Marriage does not create a business partnership; a wife entrusting Stridhan to her husband retains exclusive ownership, and dishonest misappropriation by the husband is punishable under Sec. 406 IPC." },

        { name: "British Homes Assurance Corp. v. Paterson", cite: "[1902] 2 Ch 404", sec: "Sec. 26, 31", holding: "Where a client receives notice of a new partner but continues paying the original sole practitioner individually, he elects to hold only the individual liable and cannot sue the new partner for fraud." },
        { name: "Bagel v. Miller", cite: "[1903] 2 KB 212", sec: "Sec. 25, 35, 42(c)", holding: "A deceased partner's estate is not liable for the price of goods ordered during his lifetime but delivered after his death, because the debt for the price arises only upon delivery." },

        { name: "British Paints (India) Ltd. v. Union of India", cite: "(1970 Cal HC)", sec: "Sec. 11, 55", holding: "Time as Essence in Tenders: delivery time in military paint tenders is prima facie of the essence; extending delivery to a specific date fixes a new essential deadline justifying immediate cancellation on default." },

        { name: "Orissa Textile Mills Ltd. v. Ganesh Das Ramkishun", cite: "(1960 Pat HC)", sec: "Sec. 11", holding: "Market Fluctuation & Time: delivery timelines for marketable commodities with fluctuating prices are of the essence; mutually extending delivery establishes a new essential deadline." },

        { act: "ipa", topic: "Sec. 7", q: "A, B and C form a firm. The deed is silent both on its duration and on how it may be determined. The partnership is:", o: ["A partnership at will (s. 7)", "A particular partnership (s. 8)", "A partnership for a fixed term of 5 years", "Void for uncertainty"], e: "Where the contract makes no provision for duration or for determination, s. 7 makes it a partnership at will. It may be dissolved by written notice under s. 43." },
        { act: "ipa", topic: "Sec. 8, 42(b)", q: "A and B agree to buy one consignment of 500 bales of cotton, resell it and share the profit. Their partnership:", o: ["Is a particular partnership, dissolved (subject to contract) on completion of the venture", "Is a partnership at will that continues until notice", "Is mere co-ownership, not partnership", "Is void, because a partnership must be for a continuing business"], e: "Section 8 allows a partnership for particular adventures or undertakings. Under s. 42(b), subject to contract, it is dissolved on completing the adventure." },
        { act: "ipa", topic: "Sec. 13(a)", q: "The deed is silent on remuneration. A working partner who devotes his full time to the business is entitled to:", o: ["No remuneration (s. 13(a))", "Reasonable remuneration fixed by the majority", "A salary equal to what a manager would be paid", "A 5% commission on net profits"], e: "Section 13(a): subject to contract, a partner is not entitled to remuneration for taking part in the conduct of the business. Any 'salary' must be agreed (and is really an allocation of profits; see CIT v. R.M. Chidambaram Pillai)." },
        { act: "ipa", topic: "Sec. 13(b)", q: "A contributed ₹6 lakh and B ₹2 lakh as capital. The deed is silent on profit sharing. A profit of ₹80,000 will be shared:", o: ["₹40,000 each, i.e. equally (s. 13(b))", "₹60,000 and ₹20,000, in capital ratio", "In proportion to the time each devotes", "As decided by the partner with greater capital"], e: "Section 13(b): subject to contract, partners share profits equally and contribute equally to losses, irrespective of capital contributed." },
        { act: "ipa", topic: "Sec. 13(c)", q: "The deed allows 8% interest on capital. This year the firm makes a loss. Interest on capital is:", o: ["Not payable, because it is payable only out of profits (s. 13(c))", "Payable out of capital", "Payable and debited to the partners' current accounts", "Payable, but at 6% instead of 8%"], e: "Section 13(c): where partners are entitled to interest on capital, it is payable only out of profits. No profits means no interest on capital." },
        { act: "ipa", topic: "Sec. 13(d)", q: "A partner advances money to the firm over and above his agreed capital. In the absence of agreement, he is entitled to interest at:", o: ["6% per annum (s. 13(d))", "9% per annum", "12% per annum", "No interest, as partners are not lenders"], e: "Section 13(d): a partner making an advance beyond the agreed capital gets interest at 6% p.a. Unlike interest on capital, this is not restricted to profits." },
        { act: "ipa", topic: "Sec. 12(c)", q: "Four out of five partners of a textile firm vote to switch the firm's business to real estate. Absent any contrary agreement, the change is:", o: ["Not valid: a change in the nature of the business needs the consent of all partners (s. 12(c))", "Valid, because ordinary matters are decided by majority", "Valid if a three-fourths majority approves", "Valid if the managing partner approves"], e: "Section 12(c): ordinary differences are decided by majority, but no change may be made in the nature of the business without the consent of all the partners." },
        { act: "ipa", topic: "Sec. 12(d)", q: "A sleeping partner asks to inspect the firm's books. The working partners refuse, saying he takes no part in the business. Who is right?", o: ["The sleeping partner: every partner has a right to access, inspect and copy the books (s. 12(d))", "The working partners: only active partners may inspect", "Neither: only the firm's auditor may inspect", "The sleeping partner, but only after dissolution"], e: "Section 12(d) gives every partner, active or not, the right to have access to and to inspect and copy any of the books of the firm, subject to contract." },
        { act: "ipa", topic: "Sec. 16(a)", q: "A, a partner in a car dealership, secretly takes a ₹50,000 commission from a supplier on a purchase made for the firm. A must:", o: ["Account for the commission and pay it to the firm (s. 16(a))", "Keep it, since it was paid to him personally", "Share it only with the partners who knew of it", "Return it to the supplier"], e: "Section 16(a): a partner must account for and pay to the firm any profit derived from a transaction of the firm or from use of its property, business connection or name. This is a facet of the fiduciary duty in s. 9." },
        { act: "ipa", topic: "Sec. 16(b)", q: "Without his partners' consent, B secretly runs a business of the same nature that competes with the firm. Subject to contract, B must:", o: ["Account for and pay to the firm all profits made in that competing business (s. 16(b))", "Pay only damages for any customers proven to be lost", "Be automatically expelled", "Pay the firm interest at 6% on those profits"], e: "Section 16(b): a partner carrying on a competing business of the same nature must account for and pay to the firm all profits made in it." },
        { act: "ipa", topic: "Sec. 19", q: "Which of the following falls WITHIN the implied authority of a partner in a trading firm?", o: ["Buying goods on credit for the firm's business in the usual way", "Submitting a dispute of the firm to arbitration", "Opening a bank account for the firm in his own name", "Transferring immovable property belonging to the firm"], e: "Section 19(1) covers acts done to carry on, in the usual way, business of the kind the firm does, which in a trading firm includes buying on credit. The other three are expressly excluded by s. 19(2)(a), (b) and (g)." },
        { act: "ipa", topic: "Sec. 19(2)", q: "Which act is NOT excluded from a partner's implied authority by Section 19(2)?", o: ["Receiving payment of debts due to the firm and giving receipts", "Compromising or relinquishing a claim of the firm", "Withdrawing a suit filed on behalf of the firm", "Entering into partnership on behalf of the firm"], e: "Section 19(2) lists eight excluded acts: (a) arbitration, (b) bank account in own name, (c) compromise or relinquishment, (d) withdrawing a suit, (e) admitting liability in a suit, (f) acquiring and (g) transferring immovable property, (h) entering into partnership. Receiving debts is part of ordinary trade." },
        { act: "ipa", topic: "Sec. 20", q: "The deed forbids partner P to buy goods worth more than ₹1 lakh. In the usual course, P buys goods worth ₹3 lakh from T, who knows nothing of the limit. The firm is:", o: ["Bound, because T neither knew of the restriction nor doubted that P was a partner (s. 20)", "Not bound, because the restriction is in the deed", "Bound only up to ₹1 lakh", "Not bound unless the deed was registered"], e: "Section 20: restrictions on implied authority bind outsiders only if they know of the restriction, or do not know or believe the person to be a partner." },
        { act: "ipa", topic: "Sec. 21", q: "During a sudden flood, a partner sells the firm's perishable stock cheaply without consulting the others, to avoid total loss. The sale binds the firm because:", o: ["In an emergency a partner may do what a person of ordinary prudence would do in his own case to protect the firm from loss (s. 21)", "Every sale by any partner always binds the firm", "The other partners will be deemed to have ratified it", "It was made in the firm name"], e: "Section 21 gives emergency authority measured by the standard of a person of ordinary prudence acting in his own case under similar circumstances." },
        { act: "ipa", topic: "Sec. 24", q: "Notice to a partner who habitually acts in the firm's business does NOT operate as notice to the firm where:", o: ["A fraud on the firm is committed by, or with the consent of, that partner", "The partner is the most junior partner", "The notice was given orally", "The partner retires a month later"], e: "Section 24 makes notice to an acting partner notice to the firm, except in the case of a fraud on the firm committed by or with the consent of that partner." },
        { act: "ipa", topic: "Sec. 25", q: "A firm of A, B and C owes a creditor ₹9 lakh. The creditor may recover:", o: ["The whole ₹9 lakh from any one partner, as liability is joint and several (s. 25)", "Only ₹3 lakh from each partner", "Only from firm assets, never from personal property", "Only from the partner who made the contract"], e: "Section 25: every partner is liable jointly with the others and also severally for all acts of the firm done while he is a partner. A paying partner can claim contribution from the others." },
        { act: "ipa", topic: "Sec. 26 · Hamlyn v. John Houston", q: "To win business for the firm, a partner bribes a rival's clerk to disclose confidential information. The rival sues the firm. The firm is:", o: ["Liable, because the partner pursued the firm's ordinary business, though by wrongful means (Hamlyn v. John Houston & Co.)", "Not liable, because bribery is never part of a firm's business", "Liable only if the other partners knew of the bribe", "Not liable, since only the clerk committed a wrong"], e: "Under s. 26 the firm is liable for a partner's wrongful act done in the ordinary course of business. In Hamlyn, gathering trade information was within the business even though the means used were illegal." },
        { act: "ipa", topic: "Sec. 26 · Tendring Hundred", q: "A partner in a firm secretly mortgages a client's land for his own purposes, wholly outside the firm's business. The firm is:", o: ["Not liable, because the act was outside the ordinary course of the firm's business (Tendring Hundred Waterworks v. Jones)", "Liable, as every partner's fraud binds the firm", "Liable to the extent of the partner's capital", "Liable if the client was a firm customer"], e: "Section 26 liability is confined to acts in the ordinary course of business or with the partners' authority. A private fraud outside the business does not bind the firm." },
        { act: "ipa", topic: "Sec. 27 · Plummer v. Gregory", q: "A partner in a solicitors' firm receives a client's money for a specific mortgage the firm is handling, and misapplies it. The firm is:", o: ["Liable, as the money was received within the partner's apparent authority (s. 27(a))", "Not liable, because the partner committed a fraud", "Liable only if the firm profited", "Liable only to the extent of the defaulting partner's share"], e: "Section 27(a): the firm makes good the loss where a partner, acting within his apparent authority, receives money from a third party and misapplies it. Plummer v. Gregory contrasts money for a specific transaction (bound) with money for general investment (not bound)." },
        { act: "ipa", topic: "Sec. 28", q: "Z, who is not a partner, lets himself be introduced to T as a partner of firm F. Relying on this, T supplies goods to F on credit. Z is:", o: ["Liable to T as if he were a partner (holding out, s. 28)", "Not liable, because he is not a partner", "Liable only if he shared profits", "Liable only for half the debt"], e: "Section 28: a person who represents himself, or knowingly permits himself to be represented, as a partner is liable as a partner to anyone who gives credit to the firm on the faith of that representation. He does not become a partner for other purposes." },
        { act: "ipa", topic: "Sec. 28(2)", q: "After a partner's death, the survivors carry on business under the old firm name, which includes the deceased's name. The deceased's estate is:", o: ["Not liable for acts of the firm done after his death (s. 28(2))", "Liable, by holding out", "Liable until public notice is given in the Gazette", "Liable for debts incurred within one year of death"], e: "Section 28(2): continued use of the old firm name, or of a deceased partner's name in it, does not make his legal representative or estate liable for acts done after his death." },
        { act: "ipa", topic: "Sec. 29", q: "A partner assigns his entire interest in the firm to T. While the firm continues, T is entitled to:", o: ["Receive the transferring partner's share of profits, accepting the profits as agreed by the partners", "Inspect the firm's books", "Take part in management", "Demand an audit of past accounts"], e: "Section 29(1): a transferee cannot interfere in management, require accounts or inspect the books during the firm's continuance. He receives only the share of profits and must accept the account of profits agreed by the partners." },
        { act: "ipa", topic: "Sec. 30", q: "A minor admitted to the benefits of partnership is:", o: ["Liable only to the extent of his share in the firm's property and profits, not personally", "Personally liable for all firm debts", "Not liable at all, even to the extent of his share", "Personally liable only for debts above ₹1 lakh"], e: "Section 30(3): the minor's share is liable for acts of the firm, but he is not personally liable for any such act." },
        { act: "ipa", topic: "Sec. 30(5)", q: "M was admitted to the benefits of a firm as a minor. He attains majority, knows of his admission and gives no public notice at all. M becomes a partner:", o: ["On the expiry of six months from attaining majority (or from learning of the admission, if later)", "Immediately on attaining majority", "Never, unless he signs a fresh deed", "After one year from attaining majority"], e: "Section 30(5): within six months the former minor must give public notice of his election. If he fails to do so, he becomes a partner on the expiry of that period." },
        { act: "ipa", topic: "Sec. 30(7)(a)", q: "When a former minor becomes a partner (by election or by default), he is personally liable to third parties for all acts of the firm done:", o: ["Since he was first admitted to the benefits of partnership", "Only after he became a partner", "Only after he gave public notice", "Only during the six-month election period"], e: "Section 30(7)(a) makes the former minor personally liable for all acts of the firm done since he was admitted to its benefits. That is why the election under s. 30(5) matters so much." },
        { act: "ipa", topic: "Sec. 30(8)", q: "On attaining majority, M gives public notice that he elects NOT to become a partner. Thereafter:", o: ["His rights and liabilities remain those of a minor up to the date of the notice, and his share is not liable for later acts of the firm", "He becomes personally liable for all past acts", "He forfeits his share in the firm's property", "He remains a beneficiary indefinitely"], e: "Section 30(8): his position stays that of a minor up to the notice; his share is not liable for acts after the notice; and he may sue the partners for his share of property and profits." },
        { act: "ipa", topic: "Sec. 30(4)", q: "While still a minor, M wants to sue the partners for his share of the profits but continue with the firm. He:", o: ["Cannot, except when severing his connection with the firm (s. 30(4))", "Can sue at any time, like a partner", "Can sue only through the Registrar", "Can sue only for dissolution"], e: "Section 30(4): a minor admitted to benefits may not sue the partners for accounts or payment of his share, except when severing his connection with the firm." },
        { act: "ipa", topic: "Sec. 31(2)", q: "N joins an existing firm. A creditor tries to recover from N a debt the firm incurred before N joined. N is:", o: ["Not liable, unless he has agreed to assume it (e.g. by a novation)", "Liable jointly and severally like the others", "Liable to the extent of his capital", "Liable if the firm is registered"], e: "Section 31(2): an incoming partner is not liable for acts of the firm done before he became a partner. He may become bound by novation or undertaking (Meenakshi Achi; B.M. Devaiah v. Canara Bank)." },
        { act: "ipa", topic: "Sec. 32(3)", q: "A retires, but no public notice is given. The firm then buys goods on credit from T, an old supplier who knew A as a partner. A is:", o: ["Liable to T, because a retired partner remains liable to third parties until public notice of retirement is given", "Not liable, since he had already retired", "Liable only if he signed the purchase order", "Liable only to new suppliers"], e: "Section 32(3): the retired partner and the continuing partners remain liable as partners for acts done before public notice of the retirement. Compare Scarf v. Jardine." },
        { act: "ipa", topic: "Sec. 32(3) proviso", q: "A dormant partner retires without public notice. A supplier who never knew he was a partner later supplies goods to the firm. The retired partner is:", o: ["Not liable to that supplier", "Liable, because retirement was not notified", "Liable for half the amount", "Liable only if the firm is registered"], e: "Proviso to s. 32(3): a retired partner is not liable to a third party who deals with the firm without knowing that he was a partner." },
