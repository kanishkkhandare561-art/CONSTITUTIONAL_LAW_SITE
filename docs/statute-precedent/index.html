          "16": "General rule (caveat emptor): subject to this Act and any other law, there is no implied warranty or condition as to the quality of goods, or their fitness for any particular purpose, except as follows.\n(1) Fitness for purpose: where the buyer, expressly or by implication, makes known to the seller the particular purpose for which the goods are required, so as to show that he relies on the seller's skill or judgment, and the goods are of a description which it is in the course of the seller's business to supply (whether or not he is the manufacturer or producer), there is an implied condition that the goods shall be reasonably fit for that purpose.\nProviso: in a contract for the sale of a specified article under its patent or other trade name, there is no implied condition as to its fitness for any particular purpose.\n(2) Merchantable quality: where goods are bought by description from a seller who deals in goods of that description (whether or not he is the manufacturer or producer), there is an implied condition that the goods shall be of merchantable quality.\nProviso: if the buyer has examined the goods, there is no implied condition as regards defects which that examination ought to have revealed.\n(3) Usage of trade: an implied warranty or condition as to quality or fitness for a particular purpose may be annexed by the usage of trade.\n(4) An express warranty or condition does not negative a warranty or condition implied by this Act, unless it is inconsistent with it.",
          "17": "(1) A contract of sale is a contract for sale by sample where there is a term in the contract, express or implied, to that effect.\n(2) In a contract for sale by sample there is an implied condition:\n(a) that the bulk shall correspond with the sample in quality;\n(b) that the buyer shall have a reasonable opportunity of comparing the bulk with the sample;\n(c) that the goods shall be free from any defect rendering them unmerchantable which would not be apparent on reasonable examination of the sample.",
          "18": "Where there is a contract for the sale of unascertained goods, no property in the goods is transferred to the buyer unless and until the goods are ascertained.",
          "19": "(1) Where there is a contract for the sale of specific or ascertained goods, the property in them is transferred to the buyer at such time as the parties intend it to be transferred.\n(2) To ascertain the parties' intention, regard is had to the terms of the contract, the conduct of the parties and the circumstances of the case.\n(3) Unless a different intention appears, the rules in sections 20 to 24 are the rules for ascertaining the parties' intention as to when the property passes.",
          "20": "Where there is an unconditional contract for the sale of specific goods in a deliverable state, the property passes to the buyer when the contract is made. It does not matter whether the time of payment of the price, the time of delivery, or both, is postponed.",
          "21": "Where there is a contract for the sale of specific goods and the seller is bound to do something to the goods to put them into a deliverable state, the property does not pass until that thing is done and the buyer has notice of it.",
          "22": "Where there is a contract for the sale of specific goods in a deliverable state, but the seller is bound to weigh, measure, test, or do some other act or thing with reference to the goods for the purpose of ascertaining the price, the property does not pass until that act or thing is done and the buyer has notice of it.",
          "23": "(1) Where there is a contract for the sale of unascertained or future goods by description, and goods of that description and in a deliverable state are unconditionally appropriated to the contract, either by the seller with the buyer's assent or by the buyer with the seller's assent, the property in the goods passes to the buyer. The assent may be express or implied, and may be given before or after the appropriation.\n(2) Delivery to carrier: where, under the contract, the seller delivers the goods to the buyer, or to a carrier or other bailee (whether named by the buyer or not) for transmission to the buyer, and does not reserve the right of disposal, he is deemed to have unconditionally appropriated the goods to the contract.",
          "24": "When goods are delivered to the buyer on approval, 'on sale or return', or other similar terms, the property passes to the buyer:\n(a) when he signifies his approval or acceptance to the seller, or does any other act adopting the transaction;\n(b) if he does not signify approval or acceptance but retains the goods without giving notice of rejection, then on the expiry of the time fixed for return, or, if no time is fixed, on the expiry of a reasonable time.",
          "25": "(1) Where there is a contract for the sale of specific goods, or goods are later appropriated to the contract, the seller may, by the terms of the contract or appropriation, reserve the right of disposal until certain conditions are fulfilled. In that case, even if the goods are delivered to the buyer or to a carrier or other bailee for transmission to the buyer, the property does not pass until the seller's conditions are fulfilled.\n(2) Where goods are shipped or delivered to a railway administration for carriage, and by the bill of lading or railway receipt they are deliverable to the order of the seller or his agent, the seller is prima facie deemed to have reserved the right of disposal.\n(3) Where the seller draws on the buyer for the price and sends the bill of exchange together with the bill of lading or railway receipt to secure acceptance or payment, the buyer must return the bill of lading or railway receipt if he does not honour the bill of exchange. If he wrongfully retains it, the property in the goods does not pass to him.",
          "26": "Unless otherwise agreed, the goods remain at the seller's risk until the property in them is transferred to the buyer. Once the property is transferred to the buyer, the goods are at the buyer's risk whether or not delivery has been made.\nProviso 1: where delivery has been delayed through the fault of either the buyer or the seller, the goods are at the risk of the party at fault as regards any loss which might not have occurred but for that fault.\nProviso 2: nothing in this section affects the duties or liabilities of either the seller or the buyer as a bailee of the goods of the other party.",
          "27": "Subject to this Act and any other law in force, where goods are sold by a person who is not their owner, and who does not sell them under the authority or with the consent of the owner, the buyer acquires no better title to the goods than the seller had. The exception is where the owner is, by his conduct, precluded from denying the seller's authority to sell (estoppel).\nProviso (mercantile agent): where a mercantile agent is, with the consent of the owner, in possession of the goods or of a document of title to them, any sale made by him when acting in the ordinary course of business of a mercantile agent is as valid as if he had been expressly authorised by the owner. This applies only if the buyer acts in good faith and, at the time of the contract of sale, has no notice that the seller lacks authority to sell.",
          "28": "If one of several joint owners of goods has the sole possession of them by the permission of the co-owners, the property in the goods is transferred to any person who buys them from that joint owner in good faith and has no notice, at the time of the contract of sale, that the seller lacks authority to sell.",
          "29": "When the seller has obtained possession of the goods under a contract voidable under section 19 or 19A of the Indian Contract Act, 1872 (coercion, fraud, misrepresentation, undue influence), but the contract has not been rescinded at the time of the sale, the buyer acquires a good title to the goods, provided he buys them in good faith and without notice of the seller's defect of title.",
          "30": "(1) Seller in possession: where a person who has sold goods continues or is in possession of the goods or of the documents of title, the delivery or transfer by him (or by a mercantile agent acting for him) of the goods or documents under any sale, pledge or other disposition, to any person receiving them in good faith and without notice of the previous sale, has the same effect as if he had been expressly authorised by the owner to make it.\n(2) Buyer in possession: where a person who has bought or agreed to buy goods obtains possession of the goods or documents of title with the seller's consent, the delivery or transfer by him (or by a mercantile agent acting for him) of the goods or documents under any sale, pledge or other disposition, to any person receiving them in good faith and without notice of any lien or other right of the original seller in respect of the goods, has effect as if that lien or right did not exist.",
          "31": "It is the duty of the seller to deliver the goods, and of the buyer to accept and pay for them, in accordance with the terms of the contract of sale.",
          "32": "Unless otherwise agreed, delivery of the goods and payment of the price are concurrent conditions. The seller must be ready and willing to give possession of the goods to the buyer in exchange for the price, and the buyer must be ready and willing to pay the price in exchange for possession of the goods.",
          "33": "Delivery of goods sold may be made by doing anything which the parties agree shall be treated as delivery, or which has the effect of putting the goods in the possession of the buyer or of any person authorised to hold them on his behalf.",
          "34": "A delivery of part of the goods, in progress of the delivery of the whole, has the same effect, for the purpose of passing the property in the goods, as a delivery of the whole.\nBut a delivery of part of the goods with an intention of severing it from the whole does not operate as a delivery of the remainder.",
          "35": "Apart from any express contract, the seller of goods is not bound to deliver them until the buyer applies for delivery.",
          "36": "(1) Whether it is for the buyer to take possession of the goods or for the seller to send them depends in each case on the contract, express or implied. Apart from any such contract, goods sold are to be delivered at the place where they are at the time of the sale. Goods agreed to be sold are to be delivered at the place where they are at the time of the agreement to sell or, if not then in existence, at the place where they are manufactured or produced.\n(2) Where the seller is bound to send the goods but no time is fixed, he must send them within a reasonable time.\n(3) Where, at the time of sale, the goods are in the possession of a third person, there is no delivery by the seller to the buyer unless and until that third person acknowledges to the buyer that he holds the goods on his behalf (attornment). Proviso: this does not affect the issue or transfer of any document of title to goods.\n(4) A demand or tender of delivery may be treated as ineffectual unless made at a reasonable hour. What is a reasonable hour is a question of fact.\n(5) Unless otherwise agreed, the expenses of and incidental to putting the goods into a deliverable state are borne by the seller.",
          "37": "(1) Where the seller delivers a quantity LESS than he contracted to sell, the buyer may reject the goods. If he accepts them, he must pay for them at the contract rate.\n(2) Where the seller delivers a quantity LARGER than he contracted to sell, the buyer may accept the contracted quantity and reject the rest, or reject the whole. If he accepts the whole, he must pay for them at the contract rate.\n(3) Where the seller delivers the goods contracted for MIXED with goods of a different description not included in the contract, the buyer may accept the goods that accord with the contract and reject the rest, or reject the whole.\n(4) This section is subject to any usage of trade, special agreement or course of dealing between the parties.",
          "38": "(1) Unless otherwise agreed, the buyer is not bound to accept delivery of the goods by instalments.\n(2) Where there is a contract for the sale of goods to be delivered by stated instalments, each to be separately paid for, and either the seller makes no delivery or a defective delivery of one or more instalments, or the buyer neglects or refuses to take delivery of or pay for one or more instalments, it depends in each case on the terms of the contract and the circumstances whether the breach is a repudiation of the whole contract, or a severable breach giving a claim for compensation but not a right to treat the whole contract as repudiated.",
          "39": "(1) Where, under the contract, the seller is authorised or required to send the goods to the buyer, delivery to a carrier (whether named by the buyer or not) for transmission to the buyer, or delivery to a wharfinger for safe custody, is prima facie deemed to be delivery to the buyer.\n(2) Unless otherwise authorised by the buyer, the seller must make such contract with the carrier or wharfinger on the buyer's behalf as is reasonable, having regard to the nature of the goods and the other circumstances. If he fails to do so and the goods are lost or damaged in transit or in the wharfinger's custody, the buyer may decline to treat the delivery to the carrier or wharfinger as delivery to himself, or may hold the seller responsible in damages.\n(3) Unless otherwise agreed, where goods are sent by a route involving sea transit, in circumstances in which it is usual to insure, the seller must give the buyer such notice as will enable him to insure them during the sea transit. If he fails to do so, the goods are deemed to be at the seller's risk during the sea transit.",
          "40": "Where the seller agrees to deliver the goods at his own risk at a place other than where they are when sold, the buyer must nevertheless, unless otherwise agreed, take any risk of deterioration in the goods necessarily incident to the course of transit.",
          "41": "(1) Where goods are delivered to the buyer which he has not previously examined, he is not deemed to have accepted them unless and until he has had a reasonable opportunity of examining them to ascertain whether they conform to the contract.\n(2) Unless otherwise agreed, when the seller tenders delivery, he is bound, on request, to give the buyer a reasonable opportunity of examining the goods to ascertain whether they conform to the contract.",
          "42": "The buyer is deemed to have accepted the goods:\n(i) when he intimates to the seller that he has accepted them;\n(ii) when the goods have been delivered to him and he does any act in relation to them which is inconsistent with the ownership of the seller;\n(iii) when, after the lapse of a reasonable time, he retains the goods without intimating to the seller that he has rejected them.",
          "43": "Unless otherwise agreed, where goods are delivered to the buyer and he refuses to accept them, having the right to do so, he is not bound to return them to the seller. It is enough if he intimates to the seller that he refuses to accept them.",
          "44": "When the seller is ready and willing to deliver the goods and requests the buyer to take delivery, and the buyer does not take delivery within a reasonable time after the request, the buyer is liable to the seller for any loss caused by his neglect or refusal to take delivery, and also for a reasonable charge for the care and custody of the goods.\nProviso: nothing in this section affects the seller's rights where the buyer's neglect or refusal amounts to a repudiation of the contract.",
          "45": "(1) The seller of goods is an 'unpaid seller':\n(a) when the whole of the price has not been paid or tendered;\n(b) when a bill of exchange or other negotiable instrument has been received as conditional payment, and the condition on which it was received has not been fulfilled because of its dishonour or otherwise.\n(2) In this Chapter, 'seller' includes any person in the position of a seller, for example an agent of the seller to whom the bill of lading has been endorsed, or a consignor or agent who has himself paid, or is directly responsible for, the price.",
          "46": "(1) Subject to this Act and any other law, even though the property in the goods may have passed to the buyer, the unpaid seller, as such, has by implication of law:\n(a) a lien on the goods for the price while he is in possession of them;\n(b) if the buyer becomes insolvent, a right of stopping the goods in transit after he has parted with possession of them;\n(c) a right of re-sale, as limited by this Act.\n(2) Where the property in the goods has not passed to the buyer, the unpaid seller has, in addition to his other remedies, a right of withholding delivery similar to and co-extensive with his rights of lien and stoppage in transit where the property has passed.",
          "47": "(1) Subject to this Act, an unpaid seller in possession of the goods is entitled to retain possession of them until payment or tender of the price:\n(a) where the goods have been sold without any stipulation as to credit;\n(b) where the goods have been sold on credit, but the term of credit has expired;\n(c) where the buyer becomes insolvent.\n(2) The seller may exercise his lien even though he is in possession of the goods as agent or bailee for the buyer.",
          "48": "Where an unpaid seller has made part delivery of the goods, he may exercise his right of lien on the remainder, unless the part delivery was made in circumstances showing an agreement to waive the lien.",
          "49": "(1) The unpaid seller loses his lien:\n(a) when he delivers the goods to a carrier or other bailee for transmission to the buyer without reserving the right of disposal;\n(b) when the buyer or his agent lawfully obtains possession of the goods;\n(c) by waiver of the lien.\n(2) An unpaid seller who has a lien does not lose it merely because he has obtained a decree for the price of the goods.",
          "50": "Subject to this Act, when the buyer becomes insolvent, the unpaid seller who has parted with possession of the goods has the right of stopping them in transit. He may resume possession of the goods as long as they are in the course of transit, and may retain them until payment or tender of the price.",
          "51": "(1) Goods are deemed to be in the course of transit from the time they are delivered to a carrier or other bailee for transmission to the buyer, until the buyer or his agent takes delivery of them from the carrier or bailee.\n(2) If the buyer or his agent obtains delivery before the goods arrive at the appointed destination, the transit is at an end.\n(3) If, after the goods arrive at the appointed destination, the carrier or bailee acknowledges to the buyer or his agent that he holds the goods on his behalf and continues in possession as bailee for the buyer, the transit is at an end, even if the buyer has indicated a further destination.\n(4) If the buyer rejects the goods and the carrier or bailee continues in possession of them, the transit is not at an end, even if the seller has refused to take them back.\n(5) When goods are delivered to a ship chartered by the buyer, whether they are in the master's possession as carrier or as the buyer's agent depends on the circumstances of the case.\n(6) Where the carrier or bailee wrongfully refuses to deliver the goods to the buyer or his agent, the transit is deemed to be at an end.\n(7) Where part delivery has been made to the buyer or his agent, the remainder may be stopped in transit, unless the part delivery was made in circumstances showing an agreement to give up possession of the whole.",
          "52": "(1) The unpaid seller may exercise the right of stoppage in transit either by taking actual possession of the goods, or by giving notice of his claim to the carrier or other bailee in whose possession the goods are. The notice may be given to the person in actual possession or to his principal. If given to the principal, it is effective only if given at such time and in such circumstances that the principal, using reasonable diligence, can communicate it to his servant or agent in time to prevent delivery to the buyer.\n(2) When notice of stoppage is given, the carrier or bailee must re-deliver the goods to, or according to the directions of, the seller. The seller bears the expenses of re-delivery.",
          "53": "(1) Subject to this Act, the unpaid seller's right of lien or stoppage in transit is not affected by any sale or other disposition of the goods which the buyer may have made, unless the seller has assented to it.\nProviso: where a document of title to goods has been issued or lawfully transferred to a person as buyer or owner, and that person transfers the document to someone who takes it in good faith and for consideration, then (i) if that last transfer was by way of sale, the unpaid seller's right of lien or stoppage in transit is defeated; and (ii) if it was by way of pledge or other disposition for value, the unpaid seller's right can be exercised only subject to the transferee's rights.\n(2) Where the transfer is by way of pledge, the unpaid seller may require the pledgee to have the amount secured satisfied, so far as possible, out of any other goods or securities of the pledgor available to the pledgee.",
          "54": "(1) Subject to this Section, a contract of sale is not rescinded merely because the unpaid seller exercises his right of lien or stoppage in transit.\n(2) Where the goods are of a perishable nature, or where the unpaid seller who has exercised his lien or stoppage gives the buyer notice of his intention to re-sell, and the buyer does not pay or tender the price within a reasonable time, the seller may, within a reasonable time, re-sell the goods and recover from the original buyer damages for any loss caused by his breach. If no such notice is given, the seller cannot recover those damages, and the buyer is entitled to any profit made on the re-sale.\n(3) Where an unpaid seller who has exercised his lien or stoppage re-sells the goods, the buyer acquires a good title as against the original buyer, even though notice of re-sale has not been given.\n(4) Where the seller expressly reserves a right of re-sale in case the buyer defaults, and on default re-sells the goods, the original contract is rescinded, without prejudice to any claim the seller may have for damages.",
          "55": "(1) Where the property in the goods has passed to the buyer, and the buyer wrongfully neglects or refuses to pay for them according to the contract, the seller may sue him for the price.\n(2) Where the price is payable on a day certain irrespective of delivery, and the buyer wrongfully neglects or refuses to pay it, the seller may sue him for the price even though the property has not passed and the goods have not been appropriated to the contract.",
          "56": "Where the buyer wrongfully neglects or refuses to accept and pay for the goods, the seller may sue him for damages for non-acceptance. (The measure is ordinarily contract price minus market price, under s. 73 of the Contract Act.)",
          "57": "Where the seller wrongfully neglects or refuses to deliver the goods to the buyer, the buyer may sue the seller for damages for non-delivery. (The measure is ordinarily market price minus contract price.)",
          "58": "Subject to the Specific Relief Act, in any suit for breach of contract to deliver specific or ascertained goods, the Court may, if it thinks fit and on the plaintiff's application, direct by its decree that the contract be performed specifically, without giving the defendant the option of retaining the goods on payment of damages. The decree may be unconditional, or on such terms and conditions as to damages, payment of the price or otherwise as the Court thinks just.",
          "59": "(1) Where there is a breach of warranty by the seller, or where the buyer elects or is compelled to treat a breach of condition as a breach of warranty, the buyer is not, because of that breach alone, entitled to reject the goods. But he may:\n(a) set up the breach of warranty against the seller in diminution or extinction of the price; or\n(b) sue the seller for damages for the breach of warranty.\n(2) Setting up the breach in diminution or extinction of the price does not prevent the buyer from suing for the same breach if he has suffered further damage.",
          "60": "Where either party to a contract of sale repudiates the contract before the date of delivery, the other party may either treat the contract as subsisting and wait until the date of delivery, or treat the contract as rescinded and sue for damages for the breach.",
          "61": "(1) Nothing in this Act affects the right of the seller or the buyer to recover interest or special damages where by law they are recoverable, or to recover money paid where the consideration for the payment has failed.\n(2) In the absence of a contract to the contrary, the Court may award interest at such rate as it thinks fit on the amount of the price:\n(a) to the seller, in a suit by him for the price, from the date of tender of the goods or from the date on which the price was payable;\n(b) to the buyer, in a suit by him for refund of the price in a case of breach of contract by the seller, from the date on which the payment was made.",
          "62": "Where any right, duty or liability would arise under a contract of sale by implication of law, it may be negatived or varied by express agreement, by the course of dealing between the parties, or by usage, if the usage is such as to bind both parties to the contract.",
          "63": "Where this Act refers to a reasonable time, what is a reasonable time is a question of fact.",
          "64": "In a sale by auction:\n(1) where goods are put up for sale in lots, each lot is prima facie deemed to be the subject of a separate contract of sale;\n(2) the sale is complete when the auctioneer announces its completion by the fall of the hammer or in another customary manner, and until then any bidder may retract his bid;\n(3) a right to bid may be reserved expressly by or on behalf of the seller. Where it is expressly so reserved, but not otherwise, the seller or any one person on his behalf may bid at the auction;\n(4) where the sale is not notified to be subject to a right to bid on behalf of the seller, it is unlawful for the seller to bid himself or employ anyone to bid, or for the auctioneer knowingly to take any bid from the seller or such person, and any sale contravening this rule may be treated as fraudulent by the buyer;\n(5) the sale may be notified to be subject to a reserved or upset price;\n(6) if the seller makes use of pretended bidding to raise the price, the sale is voidable at the buyer's option.",
          "64-A": "(1) Unless a different intention appears from the contract, if, after a contract for the sale or purchase of goods is made, any tax of the kind described in sub-section (2) is imposed, increased, decreased or remitted on those goods, then, where the contract made no stipulation about payment of the tax (and the tax was not chargeable when the contract was made), or the sale was 'tax-paid' (and the tax was chargeable then):\n(a) if an imposition or increase takes effect so that the tax or increased tax is paid or payable, the seller may add the equivalent amount to the contract price, and may sue for and recover that addition;\n(b) if a decrease or remission takes effect so that a decreased tax, or no tax, is paid or payable, the buyer may deduct the equivalent amount from the contract price, and cannot be sued for that deduction.\n(2) The taxes covered are (a) any duty of customs or excise on goods, and (b) any tax on the sale or purchase of goods.",
          "65": "Repealed by the Repealing Act, 1938. (It originally repealed ss. 76–123, Chapter VII of the Indian Contract Act, 1872, which had governed sale of goods until 1930.)",
          "66": "(1) Nothing in this Act, or in any repeal it effects, affects:\n(a) any right, title, interest, obligation or liability already acquired, accrued or incurred before its commencement;\n(b) any legal proceeding or remedy in respect of any such right, title, interest, obligation or liability;\n(c) anything done or suffered before its commencement;\n(d) any enactment relating to the sale of goods which is not expressly repealed by this Act;\n(e) any rule of law not inconsistent with this Act.\n(2) The rules in insolvency relating to contracts for the sale of goods continue to apply to them, notwithstanding anything in this Act."
        },
        ipa: {
          "1": "(1) Short title: the Indian Partnership Act, 1932.\n(2) Extent: the whole of India.\n(3) Commencement: 1 October 1932, except section 69, which came into force on 1 October 1933.",
          "2": "Definitions (unless there is anything repugnant in the subject or context):\n(a) 'Act of a firm': any act or omission by all the partners, or by any partner or agent of the firm, which gives rise to a right enforceable by or against the firm.\n(b) 'Business': includes every trade, occupation and profession.\n(c) 'Prescribed': prescribed by rules made under this Act.\n(d) 'Third party', used in relation to a firm or a partner: any person who is not a partner in the firm.\n(e) Expressions used but not defined in this Act, and defined in the Indian Contract Act, 1872, have the meanings given in that Act.",
          "3": "The unrepealed provisions of the Indian Contract Act, 1872 continue to apply to firms, except so far as they are inconsistent with the express provisions of this Act.",
          "4": "'Partnership' is the relation between persons who have agreed to share the profits of a business carried on by all or any of them acting for all.\nPersons who have entered into partnership with one another are called individually 'partners' and collectively 'a firm'. The name under which their business is carried on is called the 'firm name'.\nElements: (1) agreement, (2) business, (3) sharing of profits, (4) mutual agency.",
          "5": "The relation of partnership arises from contract and not from status. In particular, members of a Hindu undivided family carrying on a family business as such, or a Burmese Buddhist husband and wife carrying on business as such, are not partners in that business.",
          "6": "In determining whether a group of persons is or is not a firm, or whether a person is or is not a partner in a firm, regard is to be had to the real relation between the parties, as shown by all relevant facts taken together.\nExplanation 1: the sharing of profits or gross returns arising from property, by persons holding a joint or common interest in that property, does not of itself make them partners.\nExplanation 2: receiving a share of the profits of a business, or a payment contingent on or varying with the profits, does not of itself make the receiver a partner with those carrying on the business. In particular, receipt of such a share or payment does not of itself make the receiver a partner where it is received:\n(a) by a lender of money to persons engaged or about to engage in a business;\n(b) by a servant or agent as remuneration;\n(c) by the widow or child of a deceased partner, as annuity;\n(d) by a previous owner or part-owner of the business, as consideration for the sale of its goodwill or share in it.",
          "7": "Where no provision is made by contract between the partners for the duration of their partnership, or for the determination of their partnership, the partnership is a 'partnership at will'.",
          "8": "A person may become a partner with another person in particular adventures or undertakings ('particular partnership').",
          "9": "Partners are bound:\n(i) to carry on the business of the firm to the greatest common advantage;\n(ii) to be just and faithful to each other;\n(iii) to render true accounts and full information of all things affecting the firm to any partner or his legal representative.",
          "10": "Every partner must indemnify the firm for any loss caused to it by his fraud in the conduct of the business of the firm.",
          "11": "(1) Subject to this Act, the mutual rights and duties of the partners may be determined by contract between them. The contract may be express or implied by a course of dealing, and may be varied by the consent of all the partners, express or implied by a course of dealing.\n(2) Notwithstanding s. 27 of the Contract Act, such a contract may provide that a partner shall not carry on any business other than that of the firm while he is a partner.",
          "12": "Subject to contract between the partners:\n(a) every partner has a right to take part in the conduct of the business;\n(b) every partner is bound to attend diligently to his duties in the conduct of the business;\n(c) any difference arising as to ordinary matters connected with the business may be decided by a majority of the partners, and every partner has the right to express his opinion before the matter is decided. But no change may be made in the nature of the business without the consent of all the partners;\n(d) every partner has a right to have access to, and to inspect and copy, any of the books of the firm.",
          "13": "Subject to contract between the partners:\n(a) a partner is not entitled to receive remuneration for taking part in the conduct of the business;\n(b) the partners are entitled to share equally in the profits earned, and must contribute equally to the losses sustained by the firm;\n(c) where a partner is entitled to interest on the capital subscribed by him, that interest is payable only out of profits;\n(d) a partner who makes, for the purposes of the business, any payment or advance beyond the capital he agreed to subscribe is entitled to interest on it at 6% per annum;\n(e) the firm must indemnify a partner for payments made and liabilities incurred by him (i) in the ordinary and proper conduct of the business, and (ii) in doing such act, in an emergency, to protect the firm from loss, as a person of ordinary prudence would do in his own case in similar circumstances;\n(f) a partner must indemnify the firm for any loss caused to it by his wilful neglect in the conduct of the business.",
          "14": "Subject to contract between the partners, the property of the firm includes all property, and rights and interests in property, originally brought into the stock of the firm, or acquired by purchase or otherwise by or for the firm, or for the purposes and in the course of the business of the firm. It also includes the goodwill of the business.\nUnless a contrary intention appears, property and rights and interests in property acquired with money belonging to the firm are deemed to have been acquired for the firm.",
          "15": "Subject to contract between the partners, the property of the firm must be held and used by the partners exclusively for the purposes of the business.",
          "16": "Subject to contract between the partners:\n(a) if a partner derives any profit for himself from any transaction of the firm, or from the use of the property or business connection of the firm or the firm name, he must account for that profit and pay it to the firm;\n(b) if a partner carries on any business of the same nature as, and competing with, that of the firm, he must account for and pay to the firm all profits made by him in that business.",
          "17": "Subject to contract between the partners:\n(a) where a change occurs in the constitution of a firm, the mutual rights and duties of the partners in the reconstituted firm remain, so far as may be, the same as they were immediately before the change;\n(b) where a firm constituted for a fixed term continues to carry on business after the term expires, the mutual rights and duties remain the same as before the expiry, so far as consistent with the incidents of a partnership at will;\n(c) where a firm constituted to carry out one or more adventures or undertakings carries out other adventures or undertakings, the mutual rights and duties for the other adventures are the same as for the original ones.",
          "18": "Subject to the provisions of this Act, a partner is the agent of the firm for the purposes of the business of the firm.",
          "19": "(1) Subject to s. 22, the act of a partner which is done to carry on, in the usual way, business of the kind carried on by the firm, binds the firm. This authority is called the partner's 'implied authority'.\n(2) In the absence of any usage or custom of trade to the contrary, implied authority does NOT empower a partner to:\n(a) submit a dispute relating to the business of the firm to arbitration;\n(b) open a banking account on behalf of the firm in his own name;\n(c) compromise or relinquish any claim or portion of a claim by the firm;\n(d) withdraw a suit or proceeding filed on behalf of the firm;\n(e) admit any liability in a suit or proceeding against the firm;\n(f) acquire immovable property on behalf of the firm;\n(g) transfer immovable property belonging to the firm;\n(h) enter into partnership on behalf of the firm.",
          "20": "The partners may, by contract, extend or restrict the implied authority of any partner.\nNotwithstanding any such restriction, any act done by a partner on behalf of the firm which falls within his implied authority binds the firm, unless the person with whom he is dealing knows of the restriction, or does not know or believe that partner to be a partner.",
          "21": "A partner has authority, in an emergency, to do all such acts for the purpose of protecting the firm from loss as would be done by a person of ordinary prudence, in his own case, acting under similar circumstances. Such acts bind the firm.",
          "22": "To bind a firm, an act or instrument done or executed by a partner or other person on behalf of the firm must be done or executed in the firm name, or in any other manner expressing or implying an intention to bind the firm.",
          "23": "An admission or representation made by a partner concerning the affairs of the firm is evidence against the firm, if it is made in the ordinary course of business.",
          "24": "Notice to a partner who habitually acts in the business of the firm, of any matter relating to the affairs of the firm, operates as notice to the firm, except in the case of a fraud on the firm committed by or with the consent of that partner.",
          "25": "Every partner is liable, jointly with all the other partners and also severally, for all acts of the firm done while he is a partner.",
          "26": "Where, by the wrongful act or omission of a partner acting in the ordinary course of the business of the firm, or with the authority of his partners, loss or injury is caused to any third party, or any penalty is incurred, the firm is liable for it to the same extent as the partner.",
          "27": "The firm is liable to make good the loss where:\n(a) a partner, acting within his apparent authority, receives money or property from a third party and misapplies it; or\n(b) the firm, in the course of its business, receives money or property from a third party, and the money or property is misapplied by any of the partners while it is in the custody of the firm.",
          "28": "(1) Anyone who, by words spoken or written or by conduct, represents himself, or knowingly permits himself to be represented, to be a partner in a firm, is liable as a partner in that firm to anyone who has, on the faith of that representation, given credit to the firm. This applies whether or not the person represented knows that the representation has reached the person giving credit.\n(2) Where, after a partner's death, the business is continued in the old firm name, the continued use of that name, or of the deceased partner's name as part of it, does not of itself make his legal representative or his estate liable for any act of the firm done after his death.",
          "29": "(1) A transfer by a partner of his interest in the firm, whether absolute or by mortgage, or by creating a charge on it, does not entitle the transferee, during the continuance of the firm, to interfere in the conduct of the business, to require accounts, or to inspect the books of the firm. It entitles the transferee only to receive the transferring partner's share of profits, and he must accept the account of profits agreed to by the partners.\n(2) If the firm is dissolved, or the transferring partner ceases to be a partner, the transferee is entitled, as against the remaining partners, to receive the share of the assets of the firm to which the transferring partner is entitled, and, to ascertain that share, to an account as from the date of dissolution.",
          "30": "(1) A person who is a minor under the law to which he is subject may not be a partner in a firm, but, with the consent of all the partners for the time being, he may be admitted to the benefits of partnership.\n(2) Such a minor has a right to such share of the property and profits of the firm as may be agreed, and may have access to, inspect and copy any of the accounts of the firm.\n(3) His share is liable for the acts of the firm, but he is not personally liable for any such act.\n(4) He may not sue the partners for an account or payment of his share of the property or profits, except when severing his connection with the firm. In that case his share is determined by a valuation made, as far as possible, in accordance with the rules in s. 48.\nProviso: all the partners acting together, or any partner entitled to dissolve the firm on notice, may elect in that suit to dissolve the firm. The Court then proceeds with the suit as one for dissolution and settlement of accounts, and the minor's share is determined along with the partners' shares.\n(5) Within six months of attaining majority, or of obtaining knowledge that he had been admitted to the benefits of partnership, whichever date is later, he may give public notice that he has elected to become, or not to become, a partner. That notice determines his position.\nProviso: if he fails to give such notice, he becomes a partner on the expiry of those six months.\n(6) Where a person has been admitted to benefits as a minor, the burden of proving that he had no knowledge of the admission until a particular date after six months from attaining majority lies on the persons asserting that fact.\n(7) Where he becomes a partner:\n(a) his rights and liabilities as a minor continue up to the date he becomes a partner, but he also becomes personally liable to third parties for all acts of the firm done since he was admitted to the benefits of partnership;\n(b) his share in the property and profits is the share to which he was entitled as a minor.\n(8) Where he elects not to become a partner:\n(a) his rights and liabilities continue to be those of a minor under this section up to the date of his public notice;\n(b) his share is not liable for any acts of the firm done after the date of the notice;\n(c) he is entitled to sue the partners for his share of the property and profits in accordance with sub-section (4).\n(9) Nothing in sub-sections (7) and (8) affects s. 28 (holding out).",
          "31": "(1) Subject to contract between the partners and to s. 30, no person may be introduced as a partner into a firm without the consent of all the existing partners.\n(2) Subject to s. 30, a person introduced as a partner does not thereby become liable for any act of the firm done before he became a partner.",
          "32": "(1) A partner may retire:\n(a) with the consent of all the other partners;\n(b) in accordance with an express agreement by the partners; or\n(c) where the partnership is at will, by giving notice in writing to all the other partners of his intention to retire.\n(2) A retiring partner may be discharged from liability to a third party for acts of the firm done before his retirement by an agreement between himself, that third party and the partners of the reconstituted firm. Such an agreement may be implied from the course of dealing between the third party and the reconstituted firm after the third party knew of the retirement.\n(3) Despite retirement, the retired partner and the partners continue to be liable as partners to third parties for any act done by any of them which would have been an act of the firm if done before the retirement, until public notice of the retirement is given.\nProviso: a retired partner is not liable to a third party who deals with the firm without knowing that he was a partner.\n(4) Notices under sub-section (3) may be given by the retired partner or by any partner of the reconstituted firm.",
          "33": "(1) A partner may not be expelled from a firm by any majority of the partners, except in the exercise, in good faith, of powers conferred by contract between the partners.\n(2) Sub-sections (2), (3) and (4) of s. 32 apply to an expelled partner as if he were a retired partner.",
          "34": "(1) Where a partner is adjudicated an insolvent, he ceases to be a partner on the date of the order of adjudication, whether or not the firm is thereby dissolved.\n(2) Where, under a contract between the partners, the firm is not dissolved by the adjudication, the estate of the insolvent partner is not liable for any act of the firm, and the firm is not liable for any act of the insolvent, done after the date of the order.",
          "35": "Where, under a contract between the partners, the firm is not dissolved by the death of a partner, the estate of the deceased partner is not liable for any act of the firm done after his death.",
          "36": "(1) An outgoing partner may carry on a business competing with that of the firm, and may advertise it. But, subject to contract to the contrary, he may not:\n(a) use the firm name;\n(b) represent himself as carrying on the business of the firm;\n(c) solicit the custom of persons who were dealing with the firm before he ceased to be a partner.\n(2) A partner may agree with his partners that, on ceasing to be a partner, he will not carry on any business similar to that of the firm within a specified period or within specified local limits. Notwithstanding s. 27 of the Contract Act, the agreement is valid if the restrictions are reasonable.",
          "37": "Where a partner has died or otherwise ceased to be a partner, and the surviving or continuing partners carry on the business with the property of the firm without any final settlement of accounts with the outgoing partner or his estate, then, absent a contract to the contrary, the outgoing partner or his estate is entitled, at his or its option, to either:\n(i) such share of the profits made since he ceased to be a partner as is attributable to the use of his share of the property of the firm; or\n(ii) interest at 6% per annum on the amount of his share in the property of the firm.\nProviso: where the partnership contract gives the surviving or continuing partners an option to purchase the outgoing or deceased partner's interest, and the option is duly exercised, the outgoing partner or estate is not entitled to any further share of profits. But a partner who claims to exercise the option without complying with its terms in all material respects is liable to account under this section.",
          "38": "A continuing guarantee given to a firm, or to a third party in respect of the transactions of a firm, is, in the absence of agreement to the contrary, revoked as to future transactions from the date of any change in the constitution of the firm.",
          "39": "The dissolution of partnership between all the partners of a firm is called the 'dissolution of the firm'.",
          "40": "A firm may be dissolved with the consent of all the partners, or in accordance with a contract between the partners.",
          "41": "A firm is dissolved:\n(a) by the adjudication of all the partners, or of all the partners but one, as insolvent; or\n(b) by the happening of any event which makes it unlawful for the business of the firm to be carried on, or for the partners to carry it on in partnership.\nProviso: where the firm carries on more than one separate adventure or undertaking, the illegality of one or more of them does not of itself dissolve the firm in respect of its lawful adventures and undertakings.",
          "42": "Subject to contract between the partners, a firm is dissolved:\n(a) if constituted for a fixed term, by the expiry of that term;\n(b) if constituted to carry out one or more adventures or undertakings, by their completion;\n(c) by the death of a partner;\n(d) by the adjudication of a partner as an insolvent.",
          "43": "(1) Where the partnership is at will, the firm may be dissolved by any partner giving notice in writing to all the other partners of his intention to dissolve it.\n(2) The firm is dissolved as from the date mentioned in the notice as the date of dissolution or, if no date is mentioned, as from the date of communication of the notice.",
          "44": "At the suit of a partner, the Court may dissolve a firm on any of these grounds:\n(a) a partner has become of unsound mind. Here the suit may be brought by the next friend of that partner as well as by any other partner;\n(b) a partner, other than the one suing, has become in any way permanently incapable of performing his duties as partner;\n(c) a partner, other than the one suing, is guilty of conduct likely to affect prejudicially the carrying on of the business, regard being had to its nature;\n(d) a partner, other than the one suing, wilfully or persistently commits breach of agreements relating to the management of the firm's affairs or the conduct of its business, or otherwise so conducts himself in business matters that it is not reasonably practicable for the others to carry on in partnership with him;\n(e) a partner, other than the one suing, has in any way transferred the whole of his interest in the firm to a third party, or allowed his share to be charged under Order XXI rule 49 CPC, or sold in recovery of arrears of land revenue or dues recoverable as such;\n(f) the business of the firm cannot be carried on except at a loss;\n(g) any other ground which renders it just and equitable that the firm should be dissolved.",
          "45": "(1) Notwithstanding the dissolution of a firm, the partners continue to be liable as such to third parties for any act done by any of them which would have been an act of the firm if done before the dissolution, until public notice of the dissolution is given.\nProviso: the estate of a partner who dies, or who is adjudicated an insolvent, or of a partner who retires without having been known as a partner to the person dealing with the firm, is not liable under this section for acts done after the date on which he ceases to be a partner.\n(2) Notices under sub-section (1) may be given by any partner.",
          "46": "On the dissolution of a firm, every partner or his representative is entitled, as against all the other partners or their representatives, to have the property of the firm applied in payment of the debts and liabilities of the firm, and to have the surplus distributed among the partners or their representatives according to their rights.",
          "47": "After the dissolution of a firm, the authority of each partner to bind the firm, and the other mutual rights and obligations of the partners, continue despite the dissolution, so far as may be necessary to wind up the affairs of the firm and to complete transactions begun but unfinished at the time of dissolution, but not otherwise.\nProviso: the firm is in no case bound by the acts of a partner who has been adjudicated insolvent. But this does not affect the liability of a person who, after the adjudication, has represented himself or knowingly permitted himself to be represented as a partner of the insolvent.",
          "48": "In settling the accounts of a firm after dissolution, the following rules apply, subject to agreement by the partners:\n(a) Losses, including deficiencies of capital, are paid first out of profits, next out of capital, and lastly, if necessary, by the partners individually in the proportions in which they were entitled to share profits.\n(b) The assets of the firm, including any sums contributed by the partners to make up deficiencies of capital, are applied in this order:\n(i) in paying the debts of the firm to third parties;\n(ii) in paying to each partner rateably what is due to him from the firm for advances, as distinguished from capital;\n(iii) in paying to each partner rateably what is due to him on account of capital;\n(iv) the residue, if any, is divided among the partners in the proportions in which they were entitled to share profits.",
          "49": "Where there are joint debts due from the firm and also separate debts due from any partner:\n(i) the property of the firm is applied first in payment of the debts of the firm, and any surplus share of each partner is applied in payment of his separate debts or paid to him;\n(ii) the separate property of any partner is applied first in payment of his separate debts, and any surplus in payment of the debts of the firm.",
          "50": "Subject to contract between the partners, s. 16(a) (duty to account for personal profits) applies to transactions by any surviving partner, or by the representatives of a deceased partner, undertaken after the firm is dissolved on account of a partner's death and before its affairs have been completely wound up.\nProviso: where any partner or his representative has bought the goodwill of the firm, nothing in this section affects his right to use the firm name.",
          "51": "Where a partner has paid a premium on entering into a partnership for a fixed term, and the firm is dissolved before that term expires otherwise than by the death of a partner, he is entitled to repayment of the premium, or of such part of it as is reasonable, having regard to the terms on which he became a partner and the length of time he was a partner. This does not apply where:\n(a) the dissolution is mainly due to his own misconduct; or\n(b) the dissolution is in pursuance of an agreement containing no provision for the return of the premium or any part of it.",
          "52": "Where a contract creating a partnership is rescinded on the ground of the fraud or misrepresentation of any party to it, the party entitled to rescind is, without prejudice to any other right, entitled:\n(a) to a lien on, or right of retention of, the surplus of the assets of the firm remaining after its debts are paid, for any sum he paid to purchase a share in the firm and for any capital he contributed;\n(b) to rank as a creditor of the firm for any payment he made towards the debts of the firm;\n(c) to be indemnified by the partner or partners guilty of the fraud or misrepresentation against all the debts of the firm.",
          "53": "After a firm is dissolved, every partner or his representative may, absent a contract to the contrary, restrain any other partner or his representative from carrying on a similar business in the firm name, or from using any of the property of the firm for his own benefit, until the affairs of the firm have been completely wound up.\nProviso: where any partner or his representative has bought the goodwill of the firm, nothing in this section affects his right to use the firm name.",
          "54": "Partners may, on or in anticipation of the dissolution of the firm, agree that some or all of them will not carry on a business similar to that of the firm within a specified period or within specified local limits. Notwithstanding s. 27 of the Contract Act, the agreement is valid if the restrictions are reasonable.",
          "55": "(1) In settling the accounts of a firm after dissolution, the goodwill is, subject to contract between the partners, included in the assets. It may be sold separately or along with other property of the firm.\n(2) Where the goodwill is sold after dissolution, a partner may carry on a business competing with that of the buyer and may advertise it, but, subject to agreement between him and the buyer, he may not:\n(a) use the firm name;\n(b) represent himself as carrying on the business of the firm;\n(c) solicit the custom of persons who were dealing with the firm before its dissolution.\n(3) Any partner may, on the sale of the goodwill, agree with the buyer not to carry on any business similar to that of the firm within a specified period or within specified local limits. Notwithstanding s. 27 of the Contract Act, the agreement is valid if the restrictions are reasonable.",
          "56": "The State Government may, by notification in the Official Gazette, direct that the provisions of this Chapter (registration) shall not apply to that State, or to any part of it specified in the notification.",
          "57": "(1) The State Government may appoint Registrars of Firms for the purposes of this Act, and may define the areas within which they exercise their powers and perform their duties.\n(2) Every Registrar is deemed to be a public servant within the meaning of s. 21 of the Indian Penal Code (now the corresponding provision of the BNS, 2023).",
          "58": "(1) Registration of a firm may be effected AT ANY TIME by sending by post, or delivering, to the Registrar of the area in which any place of business of the firm is situated or proposed to be situated, a statement in the prescribed form with the prescribed fee, stating:\n(a) the firm name;\n(b) the place or principal place of business of the firm;\n(c) the names of any other places where the firm carries on business;\n(d) the date when each partner joined the firm;\n(e) the names in full and permanent addresses of the partners;\n(f) the duration of the firm.\nThe statement must be signed by all the partners, or by their agents specially authorised in this behalf.\n(2) Each person signing the statement must also verify it in the prescribed manner.\n(3) A firm name must not contain the words 'Crown', 'Emperor', 'Empress', 'Empire', 'Imperial', 'King', 'Queen', 'Royal', or words expressing or implying the sanction, approval or patronage of Government, except where the State Government consents to their use by order in writing.\n(Several States, including Maharashtra, have amended this section.)",
          "59": "When the Registrar is satisfied that s. 58 has been duly complied with, he records an entry of the statement in a register called the Register of Firms, and files the statement.",
          "60": "(1) When an alteration is made in the firm name, or in the location of the principal place of business of a registered firm, a statement may be sent to the Registrar with the prescribed fee, specifying the alteration and signed and verified in the manner required under s. 58.\n(2) When the Registrar is satisfied that sub-section (1) has been complied with, he amends the entry relating to the firm in the Register of Firms in accordance with the statement, and files it with the statement filed under s. 59.",
          "61": "When a registered firm discontinues business at any place, or begins to carry on business at any place, not being its principal place of business, any partner or agent of the firm may send intimation of it to the Registrar. The Registrar makes a note of it in the entry relating to the firm in the Register of Firms, and files the intimation with the statement filed under s. 59.",
          "62": "When any partner in a registered firm alters his name or permanent address, an intimation of the alteration may be sent by any partner or agent of the firm to the Registrar, who deals with it in the manner provided in s. 61.",
          "63": "(1) When a change occurs in the constitution of a registered firm, any incoming, continuing or outgoing partner, and when a registered firm is dissolved, any person who was a partner immediately before the dissolution, or the agent of any such partner or person specially authorised in this behalf, may give notice to the Registrar of the change or dissolution, specifying its date. The Registrar records the notice in the entry relating to the firm in the Register of Firms, and files it with the statement filed under s. 59.\n(2) When a minor who has been admitted to the benefits of partnership attains majority and elects to become, or not to become, a partner, and the firm is then a registered firm, he or his specially authorised agent may give notice to the Registrar that he has or has not become a partner. The Registrar deals with the notice as provided in sub-section (1).",
          "64": "(1) The Registrar has power at all times to rectify any mistake in order to bring the entry in the Register of Firms relating to any firm into conformity with the documents relating to that firm filed under this Chapter.\n(2) On application made by all the parties who have signed any document relating to a firm filed under this Chapter, the Registrar may rectify any mistake in that document, or in the record or note of it made in the Register of Firms.",
          "65": "A Court deciding any matter relating to a registered firm may direct that the Registrar make any amendment in the entry relating to that firm in the Register of Firms which is consequential on its decision, and the Registrar amends the entry accordingly.",
          "66": "(1) The Register of Firms is open to inspection by any person on payment of the prescribed fee.\n(2) All statements, notices and intimations filed under this Chapter are open to inspection, subject to the prescribed conditions and on payment of the prescribed fee.",
          "67": "The Registrar must, on application and on payment of the prescribed fee, furnish to any person a copy, certified under his hand, of any entry or portion of an entry in the Register of Firms.",
          "68": "(1) Any statement, intimation or notice recorded or noted in the Register of Firms is, as against any person by whom or on whose behalf it was signed, conclusive proof of any fact stated in it.\n(2) A certified copy of an entry relating to a firm in the Register of Firms may be produced in proof of the fact of the registration of the firm and of the contents of any statement, intimation or notice recorded or noted in it.",
          "69": "(1) Partner v. firm or partners: no suit to enforce a right arising from a contract, or conferred by this Act, may be instituted in any Court by or on behalf of any person suing as a partner in a firm against the firm or any person alleged to be or have been a partner in it, unless the firm is registered and the person suing is or has been shown in the Register of Firms as a partner.\n(2) Firm v. third party: no suit to enforce a right arising from a contract may be instituted in any Court by or on behalf of a firm against any third party unless the firm is registered and the persons suing are or have been shown in the Register of Firms as partners.\n(3) Sub-sections (1) and (2) also apply to a claim of set-off or other proceeding to enforce a right arising from a contract, but do not affect:\n(a) the enforcement of any right to sue for the dissolution of a firm or for accounts of a dissolved firm, or any right or power to realise the property of a dissolved firm; or\n(b) the powers of an official assignee, receiver or Court under the insolvency Acts to realise the property of an insolvent partner.\n(4) This section does not apply:\n(a) to firms, or partners in firms, which have no place of business in the territories to which this Act extends, or whose places of business there are in areas to which this Chapter does not apply by notification under s. 56; or\n(b) to any suit or claim of set-off not exceeding ₹100 in value which, in the presidency-towns, is not of a kind specified in s. 19 of the Presidency Small Cause Courts Act, 1882, or, outside them, is not of a kind specified in the Second Schedule to the Provincial Small Cause Courts Act, 1887, or to any proceeding in execution or other proceeding incidental to or arising from any such suit or claim.\n(The Maharashtra-added s. 69(2A) was struck down in V. Subramaniam v. Rajesh Raghuvandra Rao, 2009.)",
          "70": "Any person who signs any statement, amending statement, notice or intimation under this Chapter which contains a particular he knows to be false or does not believe to be true, or which contains particulars he knows to be incomplete or does not believe to be complete, is punishable with imprisonment up to three months, or with fine, or with both. (Some States, such as Maharashtra, have enhanced the punishment.)",
          "71": "(1) The State Government may, by notification in the Official Gazette, prescribe the fees payable for filing documents with the Registrar, for inspection of documents, and for copies from the Register of Firms, provided the fees do not exceed the maximums in Schedule I.\n(2) The State Government may also make rules prescribing the form of the s. 58 statement and its verification; the form of statements, notices and intimations under ss. 60–63; the form of the Register of Firms and how entries are made, amended or noted in it; the procedure of the Registrar when disputes arise; the filing of documents; the conditions for inspection of original documents; the grant of copies; the preservation and destruction of documents; and generally for carrying out the purposes of this Chapter.\n(3) All rules made under this section are subject to the condition of previous publication.\n(4) Every rule made under this section must be laid, as soon as may be after it is made, before the State Legislature.",
          "72": "Public notice under this Act is given:\n(a) where it relates to the retirement or expulsion of a partner from a registered firm, the dissolution of a registered firm, or the election to become or not to become a partner by a person who was admitted to benefits as a minor: by notice to the Registrar of Firms under s. 63, AND by publication in the Official Gazette and in at least one vernacular newspaper circulating in the district where the firm has its place or principal place of business;\n(b) in any other case: by publication in the Official Gazette and in at least one vernacular newspaper circulating in the district where the firm has its place or principal place of business.",
          "73": "Repealed by the Repealing Act, 1938. (It originally repealed the provisions of the Indian Contract Act, 1872 on partnership, i.e. Chapter XI, ss. 239–266, which the 1932 Act replaced.)",
          "74": "Nothing in this Act, or in any repeal it effects, affects or is deemed to affect:\n(a) any right, title, interest, obligation or liability already acquired, accrued or incurred before its commencement;\n(b) any legal proceeding or remedy in respect of any such right, title, interest, obligation or liability;\n(c) anything done or omitted before its commencement;\n(d) any enactment relating to partnerships not expressly repealed by this Act;\n(e) any rule of insolvency relating to partnerships;\n(f) any rule of law not inconsistent with this Act."
        }
      };


      /* =======================================================================
         6. CROSS-REFERENCE ENGINE — links every card to its sections & cases
         ======================================================================= */
      const ACTS = {
        ipa:  { key: 'ipa',  code: 'IPA 1932',  full: 'Indian Partnership Act, 1932', sections: IPA_SECTIONS,  cases: IPA_CASES },
        soga: { key: 'soga', code: 'SOGA 1930', full: 'Sale of Goods Act, 1930',      sections: SOGA_SECTIONS, cases: SOGA_CASES }
      };

      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      // Section numbers of THIS Act cited in a reference string.
      // Drops Contract Act references ("27 ICA"), Explanations ("Expl. 1") and anything after "·".
      function secNums(ref) {
        const s = String(ref).split('·')[0]
          .replace(/\b\d+\s*ICA\b/g, '')
          .replace(/Expl\.?\s*\d+/g, '')
          .replace(/Art\.?\s*\d+/g, '');
        const out = [];
        const re = /(?:^|[\s,./])(\d+(?:-A)?)/g;
        let m;
        while ((m = re.exec(s))) if (!out.includes(m[1])) out.push(m[1]);
        return out;
      }

      Object.values(ACTS).forEach((A) => {
        A.byNum = new Map(A.sections.map((s) => [s.num, s]));
        A.casesBySec = new Map();
        A.cases.forEach((c) => {
          c.nums = secNums(c.sec).filter((n) => A.byNum.has(n));
          c.nums.forEach((n) => {
            if (!A.casesBySec.has(n)) A.casesBySec.set(n, []);
            A.casesBySec.get(n).push(c);
          });
        });
      });

      function casesNamedIn(A, topic) {
        const parts = String(topic).split('·').slice(1).join('/').split('/')
          .map((p) => p.replace(/\(.*?\)/g, '').trim().toLowerCase()).filter((p) => p.length >= 5);
        return A.cases.filter((c) => parts.some((p) => c.name.toLowerCase().includes(p)));
      }

      const sectionRef = (A, n) => A.byNum.get(n);
      const gistOf = (A, s) => (GIST[A.key] && GIST[A.key][s.num]) || s.rule;

      /* =======================================================================
         7. CARD BANK — question on the front, a detailed answer on the back
         Each card: { id, act, bank, kind, topic, q, body?, answer, explain?, sections[], cases[], source }
         ======================================================================= */
      const BANK = [];

      Object.values(ACTS).forEach((A) => {
        A.sections.forEach((s) => {
          const inactive = /^(Omitted|Repealed)/.test(s.rule);
          const onSec = A.casesBySec.get(s.num) || [];
          const src = `${A.code} · Section ${s.num} — ${s.title} · ${s.ch}`;

          BANK.push({
            id: `${A.key}-s${s.num}-rule`, act: A.key, bank: 'sec', kind: 'Section → Rule', topic: s.ch,
            q: `Section ${s.num}, ${A.full}: state its heading and the rule it lays down.`,
            answer: `Section ${s.num} — ${s.title}`, explain: gistOf(A, s), explainLabel: 'Full gist of the section',
            sections: [], cases: onSec, source: src
          });
          if (inactive) return;

          BANK.push({
            id: `${A.key}-s${s.num}-ident`, act: A.key, bank: 'sec', kind: 'Rule → Section', topic: s.ch,
            q: `Identify the section of the ${A.full} that lays down this rule.`, body: s.rule,
            answer: `Section ${s.num} — ${s.title}`, explain: gistOf(A, s), explainLabel: `Full gist · ${s.ch}`,
            sections: [], cases: onSec, source: src
          });

          BANK.push({
            id: `${A.key}-s${s.num}-head`, act: A.key, bank: 'sec', kind: 'Heading → Section', topic: s.ch,
            q: `“${s.title}”: which section of the ${A.full} carries this heading, and what does it provide?`,
            answer: `Section ${s.num}`, explain: gistOf(A, s), explainLabel: 'Full gist of the section',
            sections: [], cases: onSec, source: src
          });

          if (onSec.length) {
            BANK.push({
              id: `${A.key}-s${s.num}-cases`, act: A.key, bank: 'case', kind: 'Section → Precedents', topic: `Sec. ${s.num}`,
              q: `Which precedents in your list interpret Section ${s.num} (${s.title}) of the ${A.full}? State what each decided.`,
              answer: onSec.map((c) => `${c.name} ${c.cite}`).join('\n'),
              explain: '', sections: [s], cases: onSec, casesFull: true, source: src
            });
          }
        });

        A.cases.forEach((c, idx) => {
          const secs = c.nums.map((n) => sectionRef(A, n)).filter(Boolean);
          const related = [];
          c.nums.forEach((n) => (A.casesBySec.get(n) || []).forEach((x) => { if (x !== c && !related.includes(x)) related.push(x); }));
          const src = `${c.name} ${c.cite} · ${c.sec}`;

          BANK.push({
            id: `${A.key}-c${idx + 1}-hold`, act: A.key, bank: 'case', kind: 'Case → Holding', topic: c.sec,
            q: `${c.name} ${c.cite}: what was the issue, what did the court hold, and which section(s) does it illustrate?`,
            answer: c.holding, explain: `Authority on ${c.sec.replace(/\.$/, "")}.`,
            sections: secs, cases: related.slice(0, 5), relatedLabel: 'Other cases on the same section(s)', source: src
          });

          BANK.push({
            id: `${A.key}-c${idx + 1}-name`, act: A.key, bank: 'case', kind: 'Holding → Case', topic: c.sec,
            q: 'Name the precedent (with citation) and the section(s) it is an authority on.', body: c.holding,
            answer: `${c.name} ${c.cite}`, explain: `Authority on ${c.sec.replace(/\.$/, "")}.`,
            sections: secs, cases: related.slice(0, 5), relatedLabel: 'Other cases on the same section(s)', source: src
          });
        });
      });

      PROBLEMS.forEach((p, i) => {
        const A = ACTS[p.act];
        const secs = secNums(p.topic).map((n) => sectionRef(A, n)).filter(Boolean);
        const named = casesNamedIn(A, p.topic);
        const onSecs = [];
        secs.forEach((s) => (A.casesBySec.get(s.num) || []).forEach((c) => { if (!named.includes(c) && !onSecs.includes(c)) onSecs.push(c); }));
        const cases = [...named, ...onSecs].slice(0, 5);
        const src = `${A.code} · ${p.topic}`;

        if (p.ar) {
          BANK.push({
            id: `${p.act}-ar${i}`, act: p.act, bank: 'prob', kind: 'Assertion – Reason', topic: p.topic,
            q: 'Assertion–Reason: Is A true? Is R true? If both are, does R correctly explain A?',
            body: `A: ${p.assertion}\nR: ${p.reason}`,
            answer: AR_OPTIONS[p.a], explain: p.e, sections: secs, cases, relatedLabel: 'Related precedents', source: src
          });
          return;
        }
        const ov = RECALL_OVERRIDES.find(([prefix]) => p.q.startsWith(prefix));
        BANK.push({
          id: `${p.act}-p${i}`, act: p.act, bank: 'prob', kind: 'Applied problem', topic: p.topic,
          q: ov ? ov[1].rq : p.q,
          answer: ov ? ov[1].ra : p.o[0],
          explain: p.e, sections: secs, cases, relatedLabel: 'Related precedents', source: src
        });
      });


      /* ---- Story-chain cards: drill the sequence ---- */
      Object.values(ACTS).forEach((A) => {
        const links = CHAIN[A.key];
        links.forEach((l, i) => {
          const nx = links[i + 1];
          if (!nx) return;
          const nxSec = A.byNum.get(nx[0]);
          BANK.push({
            id: `${A.key}-chain-next-${l[0]}`, act: A.key, bank: 'chain', kind: 'Chain → next', topic: A.byNum.get(l[0]).ch,
            q: `Story chain (${A.code}): Section ${l[0]} is “${l[1]}”. Which section comes next, and why does it follow?`,
            answer: `Section ${nx[0]} — ${nx[1]}`, explain: nx[2],
            sections: nxSec ? [nxSec] : [], cases: [], source: `${A.code} · Sections ${l[0]} → ${nx[0]}`
          });
          BANK.push({
            id: `${A.key}-chain-prev-${nx[0]}`, act: A.key, bank: 'chain', kind: 'Chain ← previous', topic: A.byNum.get(nx[0]).ch,
            q: `Story chain (${A.code}): Section ${nx[0]} is “${nx[1]}”. Which section leads into it, and what question did that section leave open?`,
            answer: `Section ${l[0]} — ${l[1]}`, explain: `Link: ${nx[2]}`,
            sections: [A.byNum.get(l[0])], cases: [], source: `${A.code} · Sections ${l[0]} → ${nx[0]}`
          });
        });
        CHAPTER_STORY[A.key].chapters.forEach(([ch, range, story], k) => {
          const members = links.filter((l) => A.byNum.get(l[0]).ch === ch);
          BANK.push({
            id: `${A.key}-chain-ch${k}`, act: A.key, bank: 'chain', kind: 'Chapter map', topic: ch,
            q: `${A.full}: which sections make up “${ch}”, and what is the story of that chapter?`,
            answer: `Sections ${range}`, explain: `${story}\n\n` + members.map((l) => `${l[0]}: ${l[1]}`).join('\n'),
            sections: [], cases: [], source: `${A.code} · ${ch}`
          });
        });
      });

      /* =======================================================================
         8. STATE & PERSISTENCE
         ======================================================================= */
      const STORAGE_KEY = 'statute_precedent_recall_v3';
      const THEME_KEY = 'statute_precedent_theme_v1';
      const state = {
        act: 'all', bank: 'all', reviewOnly: false,
        queue: [], idx: 0, flipped: false,
        mastered: new Set(), review: new Set()
      };

      function loadProgress() {
        try {
          const p = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
          if (p) { state.mastered = new Set(p.mastered || []); state.review = new Set(p.review || []); }
        } catch (e) { /* storage unavailable */ }
      }
      function saveProgress() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ mastered: [...state.mastered], review: [...state.review] })); } catch (e) { /* ignore */ }
      }

      function buildQueue() {
        state.queue = shuffle(BANK.filter((c) =>
          (state.act === 'all' || c.act === state.act) &&
          (state.bank === 'all' || c.bank === state.bank) &&
          (!state.reviewOnly || state.review.has(c.id))));
        state.idx = 0; state.flipped = false;
        renderAll();
      }

      /* =======================================================================
         9. RENDERING
         ======================================================================= */
      const $ = (id) => document.getElementById(id);
      const esc = (str) => String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

      function updateStats() {
        $('review-count-pill').textContent = state.review.size;
        $('btn-review-filter').classList.toggle('active', state.reviewOnly);
        const total = state.queue.length;
        if (!total) {
          $('session-stats').textContent = `0 cards in view · ${state.mastered.size} mastered · ${state.review.size} to review`;
          $('progress-bar-fill').style.width = '0%';
          return;
        }
        const pos = Math.min(state.idx + 1, total);
        $('session-stats').textContent = `Card ${pos} of ${total} · ${state.mastered.size} mastered · ${state.review.size} to review`;
        $('progress-bar-fill').style.width = `${((pos / total) * 100).toFixed(2)}%`;
      }

      function sectionHtml(A, s) {
        return `<div class="detail-item py-3">
            <div class="font-medium text-[15px]">Section ${esc(s.num)} — ${esc(s.title)}</div>
            <div class="font-mono-code text-[11px] mb-1" style="color: var(--ink-muted);">${esc(A.code)} · ${esc(s.ch)}</div>
            <p class="text-[15px] leading-relaxed" style="color: var(--ink-secondary); white-space: pre-line;">${esc(gistOf(A, s))}</p>
          </div>`;
      }
      function caseHtml(c) {
        return `<div class="detail-item py-3">
